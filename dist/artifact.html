<title>Тренажёр одинэсника</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Unbounded:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ==========================================================
   Механика взята из production-CSS Duolingo (кнопка с «липом»,
   радиусы, пружинная нижняя панель). Палитра — своя: 1С-жёлтый
   на тёплой бумаге, а не их зелёный.
   ========================================================== */
:root{
  --paper:#FBF9F4; --panel:#FFFFFF; --panel-2:#F4F1E9; --panel-3:#EBE7DC;
  --ink:#2B2A26; --ink-2:#6B6A64; --ink-3:#A5A198;
  --line:#E4E0D6; --line-2:#D2CCBE;

  --brand:#FFC800; --brand-lip:#D9A400; --on-brand:#2B2A26;
  --ok:#2FA84F;    --ok-lip:#22803C;    --ok-soft:#E8F6EA; --ok-line:#B6E0BF;
  --no:#E0453E;    --no-lip:#B7332D;    --no-soft:#FDEBE9; --no-line:#F5C4C0;
  --info:#2F7FD0;  --info-lip:#245FA0;  --info-soft:#E9F1FB; --info-line:#BBD5F1;
  --gold:#E8A400;  --purple:#8B5CD6;

  --lip:4px; --r:16px; --r-sm:12px;
  --spring:cubic-bezier(.35,1.8,.35,.83);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16150F; --panel:#1F1E17; --panel-2:#272519; --panel-3:#332F21;
    --ink:#F3F0E6; --ink-2:#B4AF9E; --ink-3:#7E7A6C;
    --line:#332F22; --line-2:#443F2E;
    --brand:#FFD01F; --brand-lip:#C79600; --on-brand:#1B1A12;
    --ok:#48C169; --ok-lip:#2E8A48; --ok-soft:#152A1B; --ok-line:#2A5236;
    --no:#F0625A; --no-lip:#B93B33; --no-soft:#2C1614; --no-line:#5A2622;
    --info:#5D9FE4; --info-lip:#2F6BB0; --info-soft:#12212F; --info-line:#27436A;
    --gold:#F0B420; --purple:#A67BE8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16150F; --panel:#1F1E17; --panel-2:#272519; --panel-3:#332F21;
  --ink:#F3F0E6; --ink-2:#B4AF9E; --ink-3:#7E7A6C;
  --line:#332F22; --line-2:#443F2E;
  --brand:#FFD01F; --brand-lip:#C79600; --on-brand:#1B1A12;
  --ok:#48C169; --ok-lip:#2E8A48; --ok-soft:#152A1B; --ok-line:#2A5236;
  --no:#F0625A; --no-lip:#B93B33; --no-soft:#2C1614; --no-line:#5A2622;
  --info:#5D9FE4; --info-lip:#2F6BB0; --info-soft:#12212F; --info-line:#27436A;
  --gold:#F0B420; --purple:#A67BE8;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:600 16px/1.5 Nunito,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0; font-weight:800; letter-spacing:-.01em; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
ol,ul{margin:0; padding:0; list-style:none}
:focus-visible{outline:3px solid var(--info); outline-offset:3px; border-radius:6px}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
.num{font-family:Unbounded,Nunito,sans-serif; font-variant-numeric:tabular-nums}
a{color:var(--info); text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important; transition-duration:.01ms!important}}

/* ---------- КНОПКА С «ЛИПОМ» ---------- */
.btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:0 20px; border-radius:var(--r);
  font-size:15px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink); z-index:0;
  transition:filter .2s, transform .12s;
}
.btn::before{
  content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit;
  background:var(--panel); box-shadow:0 var(--lip) 0 var(--line-2);
  transition:box-shadow .12s;
}
.btn:active:not(:disabled){transform:translateY(var(--lip))}
.btn:active:not(:disabled)::before{box-shadow:none}
@media (hover:hover){.btn:hover:not(:disabled){filter:brightness(1.06)}}
.btn.primary{color:var(--on-brand)} .btn.primary::before{background:var(--brand); box-shadow:0 var(--lip) 0 var(--brand-lip)}
.btn.ok{color:#fff} .btn.ok::before{background:var(--ok); box-shadow:0 var(--lip) 0 var(--ok-lip)}
.btn.no{color:#fff} .btn.no::before{background:var(--no); box-shadow:0 var(--lip) 0 var(--no-lip)}
.btn.info{color:#fff} .btn.info::before{background:var(--info); box-shadow:0 var(--lip) 0 var(--info-lip)}
.btn.big{min-height:56px; padding:0 30px; font-size:16px; width:100%; max-width:340px}
.btn.ghost{color:var(--ink-3); letter-spacing:.04em}
.btn.ghost::before{background:transparent; box-shadow:none}
.btn.ghost:active{transform:none}
.btn:disabled{cursor:not-allowed; color:var(--ink-3)}
.btn:disabled::before{background:var(--panel-3); box-shadow:0 var(--lip) 0 var(--line-2)}
.link{background:none; border:0; color:var(--ink-3); font-size:13px; font-weight:700; text-decoration:underline; text-underline-offset:3px; padding:8px}
.link:hover{color:var(--ink-2)}

/* ---------- КАРКАС ---------- */
.app{min-height:100dvh; display:flex; flex-direction:column}
.hud{
  position:sticky; top:0; z-index:40; background:var(--paper);
  border-bottom:2px solid var(--line); padding:10px 16px;
}
.hud-in{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:16px}
.hud .brand{display:flex; align-items:center; gap:9px; margin-right:auto; min-width:0}
.hud .brand svg{width:32px; height:38px; flex:none}
.hud .brand b{font-family:Unbounded,sans-serif; font-size:14px; font-weight:700; letter-spacing:-.02em; white-space:nowrap}
.hud .brand b span{color:var(--brand)}
@media (max-width:430px){.hud .brand b{display:none}}
.chip-stat{display:flex; align-items:center; gap:5px; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums}
.chip-stat svg{width:22px; height:22px; flex:none}
.chip-stat.fire svg{fill:var(--gold)} .chip-stat.fire{color:var(--gold)}
.chip-stat.xp svg{fill:var(--info)} .chip-stat.xp{color:var(--info)}
.chip-stat.hp svg{fill:var(--no)} .chip-stat.hp{color:var(--no)}
.chip-stat.hp.inf{color:var(--ink-3); font-size:19px}
.chip-stat.dim{color:var(--ink-3)} .chip-stat.dim svg{fill:var(--ink-3)}

.main{flex:1; padding:20px 16px 96px}
.wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:18px}

/* нижняя навигация */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--panel); border-top:2px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tabs-in{max-width:640px; margin:0 auto; display:flex; gap:4px}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:7px 4px; border-radius:var(--r-sm); border:2px solid transparent;
  font-size:10.5px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-3);
}
.tab svg{width:24px; height:24px; fill:var(--ink-3)}
.tab[aria-current="true"]{background:var(--info-soft); border-color:var(--info-line); color:var(--info)}
.tab[aria-current="true"] svg{fill:var(--info)}
.tab .badge{position:absolute; transform:translate(16px,-4px); background:var(--no); color:#fff; border-radius:99px; font-size:9px; padding:1px 5px; letter-spacing:0}

/* ---------- ПУТЬ ---------- */
.unit{display:flex; flex-direction:column; gap:6px; margin-bottom:10px}
.unit-head{
  position:sticky; top:60px; z-index:20;
  display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:var(--r);
  background:var(--u); color:#fff; box-shadow:0 var(--lip) 0 rgba(0,0,0,.22);
}
.unit-head h2{font-size:19px; line-height:1.2}
.unit-n{font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; opacity:.82}
.unit-head p{font-size:13px; opacity:.9; font-weight:600}
.unit-head-txt{min-width:0; flex:1}
.unit-prog{text-align:right; flex:none}
.unit-prog b{display:block; font-family:Unbounded,sans-serif; font-size:17px}
.unit-prog span{font-size:10px; text-transform:uppercase; letter-spacing:.06em; opacity:.85}
.unit-greet{
  font-size:14px; color:var(--ink-2); background:var(--panel); border:2px solid var(--line);
  border-radius:var(--r); padding:12px 15px; margin:8px 0 2px;
}
.path{display:flex; flex-direction:column; align-items:center; gap:30px; padding:18px 0 24px}
.node-wrap{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; transform:translateX(var(--off))}
.node{
  position:relative; width:70px; height:64px; border-radius:50%/54%; z-index:0;
  display:grid; place-items:center; transition:transform .12s, filter .2s;
}
.node::before{
  content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit;
  background:var(--u); box-shadow:0 7px 0 rgba(0,0,0,.24); transition:box-shadow .12s;
}
.node:active:not(:disabled){transform:translateY(7px)}
.node:active:not(:disabled)::before{box-shadow:none}
@media (hover:hover){.node:hover:not(:disabled){filter:brightness(1.08)}}
.node svg{width:30px; height:30px; fill:#fff}
.node.lock::before{background:var(--panel-3); box-shadow:0 7px 0 var(--line-2)}
.node.lock svg{fill:var(--ink-3)}
.node.gold::before{background:var(--gold); box-shadow:0 7px 0 #B98300}
.node.cur{width:80px; height:73px}
.node.cur svg{width:34px; height:34px}
.node-crowns{position:absolute; bottom:-9px; font-size:10px; color:var(--gold); letter-spacing:-1px; text-shadow:0 1px 0 rgba(0,0,0,.3)}
.node-flag{
  position:absolute; top:-32px; background:var(--panel); border:2px solid var(--line);
  border-radius:10px; padding:3px 10px; font-size:10.5px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--u); white-space:nowrap; animation:hop 1.1s var(--ease) infinite;
}
.node-flag::after{content:""; position:absolute; left:50%; bottom:-7px; margin-left:-5px; width:9px; height:9px; background:var(--panel); border-right:2px solid var(--line); border-bottom:2px solid var(--line); transform:rotate(45deg)}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.node-label{font-size:11.5px; font-weight:700; color:var(--ink-3); max-width:130px; text-align:center; line-height:1.25}

/* ---------- УРОК ---------- */
.lesson{position:fixed; inset:0; z-index:60; background:var(--paper); display:flex; flex-direction:column}
.lesson-top{display:flex; align-items:center; gap:14px; padding:14px 16px; max-width:640px; margin:0 auto; width:100%}
.x{font-size:22px; color:var(--ink-3); line-height:1; padding:4px 8px; font-weight:700}
.x:hover{color:var(--ink)}
.pbar{flex:1; height:16px; border-radius:99px; background:var(--panel-3); overflow:hidden}
.pbar>i{display:block; height:100%; border-radius:99px; background:var(--brand); transition:width .4s var(--ease)}
.hearts{display:flex; align-items:center; gap:4px; color:var(--no); font-weight:800; font-variant-numeric:tabular-nums}
.hearts svg{width:24px; height:24px; fill:var(--no)}
.hearts.inf{color:var(--ink-3); font-size:20px}
.lesson-body{flex:1; overflow-y:auto; padding:8px 16px 190px}
.ex{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
.ex-type{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.ex-q{font-size:clamp(20px,3.6vw,25px); line-height:1.25}
.ex-hint{
  border-left:5px solid var(--brand); background:var(--panel); border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:12px 15px; font-size:15.5px; font-style:italic; color:var(--ink-2);
}
pre.code{
  margin:0; padding:14px 16px; background:var(--panel); border:2px solid var(--line);
  border-radius:var(--r-sm); overflow-x:auto; font-size:13px; line-height:1.7; white-space:pre;
}
.code .kw{color:var(--info); font-weight:700}
.code .fn{color:var(--gold); font-weight:700}
.code .str{color:var(--ok)}
.code .cm{color:var(--ink-3); font-style:italic}
.code .n{color:var(--no)}

/* варианты ответа */
.opts{display:flex; flex-direction:column; gap:11px}
.opt{
  position:relative; display:flex; gap:13px; align-items:center; text-align:left; width:100%;
  padding:14px 16px; border-radius:var(--r-sm); border:2px solid var(--line); border-bottom-width:4px;
  background:var(--panel); font-size:15.5px; font-weight:600; line-height:1.4;
  transition:background .12s, border-color .12s, transform .1s;
}
@media (hover:hover){.opt:hover:not(:disabled){background:var(--panel-2)}}
.opt:active:not(:disabled){transform:translateY(2px); border-bottom-width:2px; margin-bottom:2px}
.opt-k{
  flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--line-2);
  display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--ink-3);
}
.opt.sel{background:var(--info-soft); border-color:var(--info)}
.opt.sel .opt-k{border-color:var(--info); color:var(--info)}
.opt.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ink)}
.opt.ok .opt-k{background:var(--ok); border-color:var(--ok); color:#fff}
.opt.no{background:var(--no-soft); border-color:var(--no)}
.opt.no .opt-k{background:var(--no); border-color:var(--no); color:#fff}
.opt:disabled{cursor:default}

/* сопоставление пар */
.match{display:grid; grid-template-columns:1fr 1fr; gap:9px; align-items:start}
.match-col{display:flex; flex-direction:column; gap:9px; min-width:0}
.chip{
  padding:11px 12px; border-radius:var(--r-sm); border:2px solid var(--line); border-bottom-width:4px;
  background:var(--panel); font-size:12.5px; font-weight:700; text-align:left; line-height:1.32;
  display:flex; align-items:center; min-height:60px;
  overflow-wrap:anywhere; hyphens:auto;      /* длинные термины переносятся, а не вылезают */
  transition:background .12s, border-color .12s, opacity .2s;
}
@media (max-width:420px){.chip{font-size:11.5px; padding:9px 10px; min-height:54px}}
.chip.sel{background:var(--info-soft); border-color:var(--info)}
.chip.matched{opacity:.34; border-color:var(--ok); background:var(--ok-soft)}
.chip.miss{animation:shake .4s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* сборка из блоков */
.build-line{
  min-height:76px; border-radius:var(--r-sm); background:var(--panel); border:2px dashed var(--line-2);
  padding:10px; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start;
}
.build-empty{color:var(--ink-3); font-size:14px; font-weight:600; padding:6px}
.build-bank{display:flex; flex-wrap:wrap; gap:8px; min-height:44px}
.tok{
  padding:8px 12px; border-radius:10px; border:2px solid var(--line); border-bottom-width:4px;
  background:var(--panel); font-family:"JetBrains Mono",monospace; font-size:12.5px; font-weight:500;
  max-width:100%; overflow-wrap:anywhere; text-align:left;
  transition:transform .1s, background .12s;
}
@media (max-width:420px){.tok{font-size:11.5px; padding:7px 10px}}
.tok:active:not(:disabled){transform:translateY(2px); border-bottom-width:2px; margin-bottom:2px}
@media (hover:hover){.tok:hover:not(:disabled){background:var(--panel-2)}}
.tok.in{background:var(--info-soft); border-color:var(--info-line)}

/* «расскажи вслух» */
.recall-hint{color:var(--ink-2); font-size:15px; background:var(--panel); border:2px solid var(--line); border-radius:var(--r-sm); padding:14px 16px}
.recall-a{background:var(--info-soft); border:2px solid var(--info-line); border-radius:var(--r-sm); padding:14px 16px; font-size:15px; line-height:1.6}

/* нижняя панель проверки */
.fb{position:fixed; left:0; right:0; bottom:0; z-index:70; border-top:2px solid var(--line); background:var(--panel); animation:up .2s var(--spring)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.fb-in{max-width:640px; margin:0 auto; padding:16px; display:flex; align-items:center; gap:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.fb.idle{background:var(--panel)}
.fb.idle .fb-in{justify-content:space-between}
.fb.ok{background:var(--ok-soft); border-top-color:var(--ok-line)}
.fb.no{background:var(--no-soft); border-top-color:var(--no-line)}
.fb-txt{flex:1; display:flex; flex-direction:column; gap:3px; min-width:0}
.fb-txt b{font-size:18px; font-weight:800}
.fb.ok .fb-txt b{color:var(--ok-lip)} .fb.no .fb-txt b{color:var(--no-lip)}
.fb-txt span{font-size:13.5px; color:var(--ink-2); font-weight:600; line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.fb .btn{flex:none; min-width:140px}
@media (max-width:560px){
  .fb-in{flex-direction:column; align-items:stretch; gap:12px}
  .fb .btn{width:100%}
  .fb.idle .fb-in{flex-direction:row; gap:10px}
  .fb.idle .btn{width:auto; min-width:0; flex:1 1 auto}
  .fb.idle .btn.ghost{flex:0 0 auto; padding:0 14px}
}

/* ---------- ЗАВЕРШЕНИЕ ---------- */
.finish{
  position:fixed; inset:0; z-index:60; background:var(--paper);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:28px 20px; text-align:center;
}
.finish h2{font-size:clamp(26px,5vw,34px); font-family:Unbounded,sans-serif; font-weight:800}
.finish p{color:var(--ink-2); max-width:44ch; font-size:15.5px}
.finish-hero svg{width:150px; height:150px; animation:pop .45s var(--spring)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.finish-stats{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:6px 0 4px}
.ds{border:2px solid var(--line); border-radius:var(--r); padding:10px 20px; min-width:104px; background:var(--panel)}
.ds b{display:block; font-family:Unbounded,sans-serif; font-size:23px; font-weight:800; line-height:1.1}
.ds span{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:800}
.ds.xp b{color:var(--info)} .ds.acc b{color:var(--ok)} .ds.time b{color:var(--ink-2)}
.finish .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:100%; max-width:340px}
.done .row .btn{flex:1}

/* ---------- ОБЩИЕ БЛОКИ ---------- */
.card{background:var(--panel); border:2px solid var(--line); border-radius:var(--r); padding:18px}
.sec-h{display:flex; flex-direction:column; gap:5px; margin-bottom:2px}
.sec-h h2{font-size:24px; font-family:Unbounded,sans-serif; font-weight:800}
.sec-h p{color:var(--ink-2); font-size:14.5px}
.eyebrow{font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.tile-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
.tile{background:var(--panel); border:2px solid var(--line); border-bottom-width:4px; border-radius:var(--r); padding:14px}
.tile b{display:block; font-family:Unbounded,sans-serif; font-size:26px; font-weight:800; line-height:1.1}
.tile span{font-size:11px; display:block; margin-top:2px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-weight:800}
.goal-ring{display:flex; align-items:center; gap:16px}
.ring{width:76px; height:76px; flex:none; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:10; stroke-linecap:round}
.ring .bg{stroke:var(--panel-3)}
.ring .fg{stroke:var(--brand); transition:stroke-dashoffset .6s var(--ease)}
.week{display:flex; gap:6px; align-items:flex-end; height:74px}
.week .d{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; justify-content:flex-end; height:100%}
.week .b{width:100%; border-radius:5px 5px 3px 3px; background:var(--brand); min-height:4px}
.week .b.zero{background:var(--panel-3)}
.week small{font-size:10px; color:var(--ink-3); font-weight:800; text-transform:uppercase}
.acc-item{border-bottom:2px solid var(--line)}
.acc-item:last-child{border-bottom:0}

@keyframes m-pop{0%{transform:scale(1)}28%{transform:scale(1.13) translateY(-6px)}56%{transform:scale(.97) translateY(2px)}100%{transform:scale(1)}}

@keyframes m-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.mascot.is-pop{animation:m-pop .6s var(--spring)}
.mascot.is-shake{animation:m-shake .5s ease-in-out}
.mascot.is-hop{animation:m-hop 1.15s ease-in-out infinite}
.mascot.idle-bob{animation:m-bob 3.4s ease-in-out infinite}

{t:"Битая ссылка",tr:"«битая ссылка»",g:"инфра",lvl:2,

{t:"Предопределённый элемент",tr:"предопределённый",g:"мета",lvl:2,

{t:"Субконто",tr:"субконто",g:"учёт",lvl:2,

{t:"План обмена",tr:"план обмена",g:"мета",lvl:2,

{t:"Язык запросов 1С",tr:"«запросник»",g:"запросы",lvl:1,
 d:"SQL-подобный декларативный язык только на чтение. Транслируется платформой в SQL к СУБД. Нет INSERT/UPDATE/DELETE.",
 live:"Знание запросов — половина собеседования. Отличия от SQL: точка через точку, виртуальные таблицы, ИТОГИ, автоупорядочивание.",
 fact:"Работает с таблицами метаданных и умеет обращаться к реквизитам через точку, чего в SQL нет.",
 ex:"«Покажи, как ты напишешь запрос по остаткам на дату» — вопрос №1 на любом собесе."},

{t:"Виртуальная таблица",tr:"ВТ регистра",g:"запросы",lvl:2,
 d:"Таблица, которой физически нет: платформа собирает её на лету из основной таблицы и таблицы итогов. Примеры: Остатки, Обороты, ОстаткиИОбороты, СрезПоследних.",
 live:"Правило номер один: параметры отбора передавать В САМУ виртуальную таблицу, а не в ГДЕ снаружи. Иначе платформа сначала соберёт всё, потом отфильтрует.",
 fact:"Физически в базе не существует: платформа собирает её из основной таблицы и таблицы итогов.",
 ex:"«Ты фильтр по складу поставил в ГДЕ — перенеси в параметры виртуальной таблицы, запрос ускорится на порядок.»"},

{t:"Временная таблица",tr:"ВТ",g:"запросы",lvl:2,
 d:"ПОМЕСТИТЬ ИмяТаблицы — материализованный промежуточный результат в пакетном запросе. Живёт в менеджере временных таблиц.",
 live:"Стандартный приём оптимизации: разбить монстра на пакет с ВТ и проиндексировать их через ИНДЕКСИРОВАТЬ ПО.",
 fact:"Живёт в пределах менеджера временных таблиц и позволяет проиндексировать промежуточный результат.",
 ex:"«Собери отобранную номенклатуру во временную таблицу и соединяй с остатками уже с ней.»"},

{t:"Пакетный запрос",tr:"пакет",g:"запросы",lvl:2,
 d:"Несколько запросов в одном тексте через символ «;». Выполняются последовательно, могут использовать временные таблицы друг друга.",
 live:"Выполнить() вернёт последний результат, ВыполнитьПакет() — массив всех.",
 fact:"Выполнить() вернёт результат последнего запроса, ВыполнитьПакет() — массив всех.",
 ex:"«Разбей на пакет, отладить будет проще — консолью посмотришь каждый шаг.»"},

{t:"СОЕДИНЕНИЕ",tr:"джойн",g:"запросы",lvl:1,
 d:"ВНУТРЕННЕЕ, ЛЕВОЕ, ПРАВОЕ, ПОЛНОЕ СОЕДИНЕНИЕ — как в SQL. ЛЕВОЕ используется чаще всего: сохранить все строки основной таблицы.",
 live:"Классическая ловушка: ЛЕВОЕ СОЕДИНЕНИЕ + условие на правую таблицу в ГДЕ превращает соединение во ВНУТРЕННЕЕ.",
 fact:"Левое соединение сохраняет все строки левой таблицы, подставляя NULL там, где справа совпадений нет.",
 ex:"«Строки пропали» — «У тебя в ГДЕ условие на правую таблицу, перенеси его в ПО.»"},

{t:"Точка через точку",tr:"«точка»",g:"запросы",lvl:2,
 d:"Обращение к реквизиту через ссылку прямо в запросе: Номенклатура.ЕдиницаИзмерения.Наименование. Платформа неявно добавляет ЛЕВОЕ СОЕДИНЕНИЕ.",
 live:"Одна из главных причин тормозов. Особенно смертельно, когда поле составного типа — джоин пойдёт ко всем таблицам типа.",
 fact:"Разворачивается платформой в неявное соединение; на составном типе соединение пойдёт ко всем таблицам типа.",
 ex:"«Убери точки через точку по составному реквизиту, там девять соединений вылезает.»"},

{t:"ЕСТЬNULL",tr:"ЕСТЬNULL()",g:"запросы",lvl:1,
 d:"Функция замены NULL на значение. После ЛЕВОГО СОЕДИНЕНИЯ и после виртуальных таблиц остатков числа приходят NULL, а не 0.",
 live:"Забыл ЕСТЬNULL — получил «Значение не является значением объектного типа» или NULL вместо суммы.",
 fact:"Заменяет NULL, который возникает при левом соединении, — без неё арифметика даёт NULL.",
 ex:"«Остаток пустой, а не ноль — оберни в ЕСТЬNULL(КоличествоОстаток, 0).»"},

{t:"ИТОГИ ... ПО",tr:"ИТОГИ",g:"запросы",lvl:2,
 d:"Конструкция запроса, формирующая иерархический результат с подытогами по группировкам. Обходится через ВыбратьИерархически().",
 live:"Специфика 1С, в SQL прямого аналога нет. В СКД итоги делает сама компоновка, в ручных запросах — ИТОГИ.",
 fact:"Строит иерархический результат с подытогами прямо в запросе — в SQL такой конструкции нет.",
 ex:"«Не городи вложенные циклы, сделай ИТОГИ ПО Склад и обходи иерархически.»"},

{t:"СКД",tr:"Система компоновки данных",g:"запросы",lvl:2,
 d:"Декларативный движок отчётов: схема (наборы данных, поля, ресурсы, связи), настройки (группировки, отборы, поля, условное оформление), компоновщик макета.",
 live:"90% отчётов делаются здесь. Пользователь сам меняет группировки и отборы — программисту не нужно переписывать код.",
 fact:"Итоговый запрос собирается на лету из настроек пользователя, а не берётся из кода как есть.",
 ex:"«Сделай на СКД» = «сделай так, чтобы бухгалтер сам себе всё перенастроил».",},

{t:"Ресурс СКД",tr:"ресурс",g:"запросы",lvl:2,
 d:"Поле схемы компоновки, которое агрегируется по группировкам: Сумма(Выручка), Максимум(Дата).",
 live:"Ошибка новичка: сделать поле обычным вместо ресурса — тогда в итогах по группировке пусто.",
 fact:"Считается по группировкам уже в компоновке, а не в тексте запроса.",
 ex:"«В итогах ноль» — «Ты Сумму не сделал ресурсом.»"},

{t:"Вычисляемое поле СКД",tr:"вычисляемое",g:"запросы",lvl:3,
 d:"Поле, рассчитываемое выражением на языке выражений СКД поверх результата запроса. Позволяет ВычислитьВыражение() по группировке.",
 live:"Инструмент для процентов, долей, нарастающих итогов и «сравнить с предыдущим периодом».",
 fact:"Считается уже после выборки данных, поэтому в условиях запроса использовано быть не может.",
 ex:"«Доля в продажах» — вычисляемое поле с ВычислитьВыражение по общему итогу."},

{t:"Консоль запросов",tr:"«консолька»",g:"запросы",lvl:1,
 d:"Внешняя обработка для написания и отладки запросов прямо в рабочей базе. Классика — консоль запросов с ИТС или сборки с Инфостарта.",
 live:"Первый инструмент, который скачивает себе любой одинэсник. Рядом живут консоль отчётов, консоль заданий, консоль кода.",
 fact:"Внешняя обработка для отладки текста запроса на живых данных без изменения конфигурации.",
 ex:"«Скинь консольку» — просьба, понятная без уточнений."},

/* ---------- ПЛАТФОРМА И ИНФРАСТРУКТУРА ---------- */
{t:"Кластер серверов 1С",tr:"кластер",g:"платформа",lvl:2,
 d:"Серверная часть: агент (ragent), менеджер кластера (rmngr) и рабочие процессы (rphost), которые исполняют код и держат сеансы.",
 live:"«Убей rphost» — стандартный совет, когда база встала. Процессы перезапускаются, зависшие сеансы отваливаются.",
 fact:"Состоит из ragent, rmngr и rphost; рабочие процессы перезапускаются без остановки кластера.",
 ex:"«rphost сожрал 40 гигов» — типичное сообщение в чате админов 1С."},

{t:"rphost",tr:"«эрпихост»",g:"инфра",lvl:2,
 d:"Рабочий процесс кластера. Именно в нём выполняется серверный код и живут сеансы. Настраивается количеством ИБ/соединений на процесс.",
 live:"Мониторят его память. Утечка в коде = раздувшийся rphost = перезапуск и вылет всех пользователей на нём.",
 fact:"Рабочий процесс кластера, в котором выполняется прикладной код; их может быть несколько на сервер.",
 ex:"«Поставь ограничение памяти рабочего процесса, чтобы перезапускался сам.»"},

{t:"Файловый вариант",tr:"файловая",g:"платформа",lvl:1,
 d:"База в файле 1Cv8.1CD, без сервера приложений. Просто, но плохо масштабируется: блокировки на уровне файла, лимит ~5–10 пользователей.",
 live:"Для учебной базы и микрофирмы — норма. При росте переезжают на клиент-серверную с MS SQL или PostgreSQL.",
 fact:"Держит базу в одном файле 1Cv8.1CD и не требует отдельного сервера приложений.",
 ex:"«У них файловая на сетевой шарке» — сразу понятно, где искать причину тормозов."},

{t:"Клиент-серверный вариант",tr:"клиент-сервер",g:"платформа",lvl:2,
 d:"Три звена: клиент → сервер 1С → СУБД (MS SQL, PostgreSQL, Oracle, IBM DB2). Обязателен для нормальной нагрузки.",
 live:"В России сейчас массово переезжают на PostgreSQL (в том числе сборки от 1С и Postgres Pro).",
 fact:"Разносит приложение и данные: сервер 1С отдельно, СУБД отдельно.",
 ex:"«Переехали на Postgres — половина запросов внезапно поехала иначе по планам.»"},

{t:"Сеанс и соединение",tr:"сеанс / соединение",g:"платформа",lvl:2,
 d:"Сеанс — логическая работа пользователя (виден в консоли кластера, потребляет лицензию). Соединение — техническая связь с рабочим процессом.",
 live:"Разница — частый вопрос на собеседовании администратора. Сеанс может жить без активного соединения.",
 fact:"Сеанс — работа пользователя, соединение — физический канал; на один сеанс их может быть несколько.",
 ex:"«Прибей сеанс» = выкинуть пользователя, «прибей соединение» — грубее и не всегда помогает."},

{t:"Управляемые блокировки",tr:"управляемые блокировки",g:"платформа",lvl:3,
 d:"Режим, в котором логические блокировки данных 1С ставит сама (БлокировкаДанных), а СУБД работает на низком уровне изоляции. Альтернатива устаревшим автоматическим.",
 live:"Все современные конфигурации — на управляемых. При проведении обязательно блокируют остатки перед их чтением и списанием.",
 fact:"Ставятся кодом через объект БлокировкаДанных и живут до конца транзакции.",
 ex:"«Ушёл в минус по складу» — «Ты остатки читаешь без установки управляемой блокировки, вот и гонка.»"},

{t:"Дедлок",tr:"взаимоблокировка",g:"инфра",lvl:3,
 d:"Два процесса ждут ресурсы друг друга. Платформа/СУБД снимает одну из транзакций с ошибкой.",
 live:"Классическое лечение — единый порядок обращения к ресурсам и уменьшение длительности транзакций. Ловят техжурналом (событие TDEADLOCK).",
 fact:"Взаимная блокировка двух транзакций, каждая из которых ждёт ресурс, занятый другой.",
 ex:"«Каждый вечер на закрытии месяца ловим дедлоки на регистре Взаиморасчёты.»"},

{t:"Технологический журнал",tr:"ТЖ, «техжурнал»",g:"инфра",lvl:3,
 d:"Низкоуровневый лог платформы, настраиваемый через logcfg.xml. События: EXCP, TLOCK, TDEADLOCK, DBMSSQL, CALL, SDBL.",
 live:"Главный инструмент расследования: почему упало, кто кого заблокировал, какой SQL ушёл в базу.",
 fact:"Пишется настройками в logcfg.xml и фиксирует события платформы, включая тексты запросов к СУБД.",
 ex:"«Включи ТЖ на полчаса по EXCP и TDEADLOCK, потом разберём.»"},

{t:"APDEX",tr:"апдекс",g:"инфра",lvl:3,
 d:"Метрика удовлетворённости временем отклика ключевых операций (0..1). Считается по замерам с целевым временем T.",
 live:"На это опирается методика «Экспертных» задач 1С и приёмка нагрузочного тестирования у крупных клиентов.",
 fact:"Считается по времени операций относительно заданного целевого времени и даёт число от 0 до 1.",
 ex:"«Подняли APDEX проведения реализации с 0,4 до 0,92 после оптимизации.»"},

{t:"Замер производительности",tr:"замер",g:"инфра",lvl:2,
 d:"Встроенный в конфигуратор инструмент: показывает, сколько времени заняла каждая строка кода в процентах.",
 live:"Первое, что делают, когда «тормозит обработка». Второе — смотрят план запроса в СУБД.",
 fact:"Показывает, сколько времени занял каждый оператор встроенного языка при выполнении.",
 ex:"«Сделай замер — покажи, где 80% времени сидит.»"},

{t:"Регламентное задание",tr:"регламентник",g:"платформа",lvl:2,
 d:"Задание по расписанию на сервере: обмены, пересчёт итогов, отправка почты. Выполняется в фоновом задании.",
 live:"В файловой базе регламентные задания сами не работают — нужен запущенный сеанс. Частая причина «а почему обмен не идёт».",
 fact:"Запускается по расписанию на сервере; в файловом варианте требует запущенного клиента.",
 ex:"«Обмен не работает по ночам» — «У них файловая, регламентники некому выполнять.»"},

{t:"Фоновое задание",tr:"фоновое",g:"платформа",lvl:2,
 d:"Асинхронное выполнение серверного кода вне пользовательского сеанса. Запускается ФоновыеЗадания.Выполнить().",
 live:"Так делают длительные операции, чтобы не морозить интерфейс. В БСП есть готовая обёртка ДлительныеОперации.",
 fact:"Выполняется вне пользовательского сеанса и не имеет доступа к интерактивным диалогам.",
 ex:"«Выгрузка на 40 минут — заверни в фоновое, а форме показывай прогресс.»"},

{t:"Журнал регистрации",tr:"ЖР",g:"инфра",lvl:2,
 d:"Лог событий информационной базы: входы, ошибки, изменения данных. Хранится в файлах (lgf/lgd) или в SQL.",
 live:"Первое место, куда смотрят при «кто удалил документ» и «почему у пользователя ошибка».",
 fact:"Пишет действия пользователей и системные события базы, а не запросы к СУБД.",
 ex:"«Посмотри в журнале регистрации, кто менял этот документ вчера в 18:40.»"},

{t:"Тестирование и исправление",tr:"«ТиИ»",g:"инфра",lvl:2,
 d:"Режим конфигуратора для проверки логической и ссылочной целостности, реиндексации и пересчёта итогов.",
 live:"Народное средство от «странных» ошибок. Делается только на копии и с бэкапом — ТиИ умеет и удалять данные.",
 fact:"Умеет не только чинить, но и удалять данные, поэтому запускается на копии и с резервной копией.",
 ex:"«Прогони ТиИ с реиндексацией, но сначала сделай бэкап, очень тебя прошу.»"},

{t:"chdbfl",tr:"«чдбфл»",g:"инфра",lvl:3,
 d:"Утилита проверки физической целостности ФАЙЛОВОЙ базы 1Cv8.1CD. Лежит рядом с платформой в bin.",
 live:"Применяется, когда файловая база «побилась» и не открывается вообще.",
 fact:"Работает только с файловой базой и запускается, когда база не открывается вообще.",
 ex:"«База не открывается» — «Гоняй chdbfl, потом ТиИ.»"},

{t:"Выгрузка dt",
 tr:".dt",g:"инфра",lvl:1,
 d:"Файл полной выгрузки информационной базы (данные + конфигурация). Делается из конфигуратора: Администрирование → Выгрузить информационную базу.",
 live:"Универсальный способ переноса базы между серверами и СУБД. Для больших баз медленный — там используют бэкап средствами СУБД.",
 fact:"Выгружает и структуру, и данные одним файлом; для больших баз медленнее, чем средства СУБД.",
 ex:"«Скинь dt-шку, разверну у себя и посмотрю.»"},

{t:"cf / cfe / epf / erf / dt",tr:"расширения файлов",g:"инфра",lvl:1,
 d:"cf — конфигурация; cfu — файл обновления; cfe — расширение; epf — внешняя обработка; erf — внешний отчёт; dt — выгрузка базы; mxl — табличный документ.",
 live:"Этот набор букв нужно знать наизусть — на нём построена вся бытовая переписка одинэсников.",
 fact:"Расширение файла указывает, что внутри: конфигурация, расширение, обработка, отчёт или выгрузка базы.",
 ex:"«Кинь cf-ку и epf-ку, cfe у меня своё.»"},

{t:"Конфигурация поставщика",tr:"«на поддержке»",g:"платформа",lvl:2,
 d:"Эталонная конфигурация от вендора, с которой сравнивается ваша. Пока конфигурация «на поддержке», платформа умеет обновлять её автоматически.",
 live:"Ключевая развилка проекта: остаться на поддержке (обновления дешёвые) или снять с поддержки (свобода, но обновления вручную).",
 fact:"Хранится в базе рядом с рабочей и нужна для сравнения при обновлении.",
 ex:"«Снята с поддержки?» — вопрос, который задают до того, как назвать сроки.",},

{t:"Снять с поддержки",tr:"«снять с замка»",g:"сленг",lvl:2,
 d:"Отключить у объектов конфигурации правило поддержки, чтобы менять что угодно. Обратной дороги, по сути, нет.",
 live:"Означает: обновления типовой теперь ручные, каждое — с трёхсторонним сравнением. Дорого и больно.",
 fact:"После этого автоматическое обновление недоступно: новая версия переносится сравнением и объединением вручную.",
 ex:"«Кто снял с поддержки?» — «Никто не признаётся.»"},

{t:"Сравнение и объединение",tr:"«сравнилка»",g:"платформа",lvl:2,
 d:"Инструмент конфигуратора для сравнения двух конфигураций и переноса изменений. Основа ручного обновления доработанной типовой.",
 live:"На этом уходят дни. Отсюда любовь к расширениям — они убирают эту боль.",
 fact:"Инструмент обновления снятой с поддержки конфигурации: показывает расхождения с поставкой и переносит изменения.",

{t:"РИБ",tr:"распределённая информационная база",g:"платформа",lvl:3,

{t:"EnterpriseData",tr:"ED",g:"платформа",lvl:3,

{t:"1C:EDT",tr:"«ЕДТ»",g:"инфра",lvl:2,

{t:"gitsync / OneScript",tr:"OScript",g:"инфра",lvl:3,

{t:"BSL Language Server",tr:"BSL LS",g:"инфра",lvl:3,

{id:"a1",t:"Что такое 1С на самом деле",sub:"Платформа, конфигурация, база — три разные вещи",
 html:`
<p>Первое, что ломает голову новичку: «1С» — это не программа и не язык. Это трёхэтажная конструкция, и каждый этаж живёт своей жизнью.</p>
<div class="grid g3">
  <div class="card pad"><span class="tag y">этаж 1</span><h4 style="margin:8px 0 6px">Платформа</h4><p style="font-size:14px;color:var(--ink-2)">Движок: интерпретатор языка, работа с СУБД, формы, кластер серверов. Ставится как обычное приложение. Сама по себе бесполезна.</p></div>
  <div class="card pad"><span class="tag y">этаж 2</span><h4 style="margin:8px 0 6px">Конфигурация</h4><p style="font-size:14px;color:var(--ink-2)">Прикладное решение: дерево метаданных + код. «Бухгалтерия 3.0», «УТ 11». Работает только поверх платформы.</p></div>
  <div class="card pad"><span class="tag y">этаж 3</span><h4 style="margin:8px 0 6px">Информационная база</h4><p style="font-size:14px;color:var(--ink-2)">Конкретная база конкретной фирмы: та же конфигурация + её данные + её доработки.</p></div>
</div>
<p style="margin-top:6px"><b>Почему это важно.</b> «Обновить 1С» — бессмысленная фраза. Обновляют либо платформу (риск: несовместимость), либо конфигурацию (риск: затрутся доработки). Это две разные операции с разными последствиями, и путать их нельзя.</p>
<div class="explain"><b>Состояние на 2026.</b> Платформа разошлась на две живые ветки: <b>8.3.27</b> — последний релиз линейки 8.3, на которой работает подавляющее большинство внедрений; <b>8.5.x</b> — новая линейка с переработанным интерфейсом (8.5.1 стала финальной 25.12.2025). Версии 8.3.28 не будет: наработки ушли в 8.5. Типовые постепенно переводят на 8.5, но 8.3 останется рабочей лошадкой ещё надолго. Учиться сейчас нужно на 8.3, поглядывая на 8.5.</div>
`},

{id:"a2",t:"Как устроено исполнение кода",sub:"Клиент, сервер и вечная война за количество вызовов",
 html:`
<p>В управляемом приложении код физически исполняется в двух разных местах. Понимание этой границы — водораздел между «пишет как получится» и «пишет как надо».</p>
<pre class="code"><span class="cm">// Форма живёт на клиенте. У клиента НЕТ доступа к базе.</span>
<span class="fn">&НаКлиенте</span>
<span class="kw">Процедура</span> ЗаполнитьЦены(Команда)
    <span class="cm">// здесь нельзя сделать Запрос — объекта просто нет</span>
    ЦеныИзБазы = ПолучитьЦеныНаСервере(Объект.Дата);  <span class="cm">// ← вызов сервера</span>
<span class="kw">КонецПроцедуры</span>

<span class="cm">// Сервер видит базу, но не видит форму пользователя.</span>
<span class="fn">&НаСервереБезКонтекста</span>
<span class="kw">Функция</span> ПолучитьЦеныНаСервере(Дата)
    Запрос = <span class="kw">Новый</span> Запрос;   <span class="cm">// ← а здесь можно всё</span>
    <span class="kw">Возврат</span> Запрос.Выполнить().Выгрузить();
<span class="kw">КонецФункции</span></pre>
<ul class="tight">
  <li><b>Каждый переход клиент → сервер — это сетевой пакет.</b> Один вызов на 100 килобайт лучше, чем сто вызовов по килобайту. Отсюда главное правило: не вызывать сервер в цикле.</li>
  <li><b>&НаСервереБезКонтекста</b> не тащит на сервер данные формы и обратно. Если процедуре не нужны реквизиты формы — всегда без контекста.</li>
  <li><b>Модуль объекта и модуль менеджера всегда серверные.</b> Клиентского кода там быть не может в принципе.</li>
  <li>Три клиента: <b>толстый</b> (видит базу напрямую, для отладки и админки), <b>тонкий</b> (штатный, только обмен с сервером), <b>веб</b> (тот же тонкий в браузере, с ограничениями по файлам и оборудованию).</li>
</ul>
<div class="explain"><b>На собеседовании спросят так:</b> «Что произойдёт, если в &НаКлиенте-процедуре обратиться к <span class="mono">Справочники.Номенклатура</span>?» Ответ: ошибка компиляции — менеджеры объектов недоступны на клиенте.</div>
`},

{id:"a3",t:"Кластер серверов",sub:"ragent, rmngr, rphost — три буквы, которые надо знать",
 html:`
<p>В клиент-серверном варианте между пользователем и СУБД стоит сервер 1С. Он не один процесс, а связка.</p>
<div class="scrollx"><table class="t">
<thead><tr><th>Процесс</th><th>Что делает</th><th>Когда о нём вспоминают</th></tr></thead>
<tbody>
<tr><td><b>ragent</b></td><td>Агент сервера. Служба, которая знает про кластеры на этой машине и запускает остальное.</td><td>Не стартует служба «Агент сервера 1С:Предприятия» — никто не подключится.</td></tr>
<tr><td><b>rmngr</b></td><td>Менеджер кластера. Распределяет сеансы, ведёт список баз, лицензии, блокировки.</td><td>Проблемы с лицензиями и распределением нагрузки.</td></tr>
<tr><td><b>rphost</b></td><td>Рабочий процесс. Именно здесь исполняется весь серверный код и живут сеансы пользователей.</td><td>Каждый день: «rphost сожрал память», «прибей rphost».</td></tr>
</tbody></table></div>
<ul class="tight">
  <li><b>Сеанс ≠ соединение.</b> Сеанс — логическая работа пользователя, потребляет лицензию, виден в консоли кластера. Соединение — техническая связь с рабочим процессом. Сеанс может существовать без активного соединения. Это классический вопрос на собеседовании администратора.</li>
  <li><b>Утечка памяти в коде превращается в раздутый rphost.</b> Поэтому в настройках кластера ставят ограничение объёма памяти рабочего процесса — при превышении он мягко перезапускается.</li>
  <li><b>Файловый вариант</b> (файл 1Cv8.1CD) сервера не имеет вовсе: клиент сам лезет в файл. Отсюда потолок в несколько пользователей и невозможность нормальных регламентных заданий.</li>
  <li><b>СУБД</b>: MS SQL, PostgreSQL (в России — массовый переезд, в том числе на сборки от 1С и Postgres Pro), Oracle, IBM DB2. Платформа транслирует запросы 1С в SQL конкретной СУБД — и планы выполнения на разных СУБД отличаются.</li>
</ul>
`},

{id:"a4",t:"Метаданные ложатся в таблицы",sub:"Что платформа делает с деревом за твоей спиной",
 html:`
<p>Ты добавляешь объект в дерево метаданных — платформа сама создаёт и меняет таблицы в СУБД. Никакого <span class="mono">CREATE TABLE</span> ты не пишешь. Но знать, что получилось, полезно: без этого невозможно читать план запроса.</p>
<div class="scrollx"><table class="t">
<thead><tr><th>Объект метаданных</th><th>Таблицы в СУБД (упрощённо)</th></tr></thead>
<tbody>
<tr><td><b>Справочник</b></td><td><span class="mono">_Reference&lt;N&gt;</span> — основная; <span class="mono">_Reference&lt;N&gt;_VT&lt;M&gt;</span> — каждая табличная часть</td></tr>
<tr><td><b>Документ</b></td><td><span class="mono">_Document&lt;N&gt;</span> + таблицы табличных частей</td></tr>
<tr><td><b>Регистр накопления</b></td><td><span class="mono">_AccumRg&lt;N&gt;</span> — движения; <span class="mono">_AccumRgT&lt;N&gt;</span> — <b>таблица итогов</b>; <span class="mono">_AccumRgOpt&lt;N&gt;</span> — итоги обороты</td></tr>
<tr><td><b>Регистр сведений</b></td><td><span class="mono">_InfoRg&lt;N&gt;</span></td></tr>
<tr><td><b>Регистр бухгалтерии</b></td><td><span class="mono">_AccRg&lt;N&gt;</span> + таблицы итогов и субконто</td></tr>
<tr><td><b>Последовательности, планы обмена</b></td><td><span class="mono">_Seq…</span>, <span class="mono">_Node…</span> и служебные таблицы регистрации изменений</td></tr>
</tbody></table></div>
<p><b>Главная идея — таблица итогов.</b> Регистр накопления хранит не только сами движения, но и заранее посчитанные остатки на границы периодов. Поэтому «остаток на дату» берётся почти мгновенно: платформа берёт ближайший рассчитанный итог и докручивает движениями. Отсюда два следствия:</p>
<ul class="tight">
  <li>Чем больше измерений у регистра, тем толще таблица итогов — и тем медленнее запись. Лишнее измерение стоит дорого.</li>
  <li>«Пересчёт итогов» в тестировании и исправлении чинит ситуацию, когда итоги разъехались с движениями.</li>
</ul>
<div class="explain">Ссылки в СУБД хранятся как бинарное поле <span class="mono">_IDRRef</span> (16 байт, GUID). Поэтому в 1С всё связано ссылками, а не кодами: переименовал контрагента — все документы автоматически показывают новое имя.</div>
`},

{id:"a5",t:"Жизненный цикл документа",sub:"От ввода до остатков на складе",
 html:`
<p>Это тот самый путь, который надо уметь рассказать на собеседовании без запинки.</p>
<ol class="tight" style="padding-left:22px">
  <li><b>Создание.</b> <span class="mono">ОбработкаЗаполнения</span> — если документ вводится на основании другого.</li>
  <li><b>Запись.</b> <span class="mono">ПередЗаписью</span> (можно отменить через <span class="mono">Отказ</span>) → запись в таблицу → <span class="mono">ПриЗаписи</span>. Всё в транзакции.</li>
  <li><b>Проведение.</b> Вызывается <span class="mono">ОбработкаПроведения</span> в модуле объекта. Внутри: установить управляемые блокировки → прочитать остатки → проверить → записать движения в регистры.</li>
  <li><b>Контроль.</b> После записи движений платформа проверяет, не ушли ли ресурсы в минус (если включён контроль остатков).</li>
  <li><b>Отмена проведения.</b> <span class="mono">ОбработкаУдаленияПроведения</span> — движения удаляются, документ остаётся.</li>
  <li><b>Пометка на удаление → удаление.</b> Двухшаговое: сначала пометка, потом отдельная обработка с контролем ссылок. Напрямую объект с входящими ссылками не удалится.</li>
</ol>
<pre class="code"><span class="fn">Процедура</span> ОбработкаПроведения(Отказ, Режим)
    <span class="cm">// 1. Блокируем ДО чтения — иначе гонка и минус на складе</span>
    Блокировка = <span class="kw">Новый</span> БлокировкаДанных;
    Элемент = Блокировка.Добавить(<span class="str">"РегистрНакопления.ТоварыНаСкладах"</span>);
    Элемент.Режим = РежимБлокировкиДанных.Исключительный;
    Элемент.ИсточникДанных = Товары;   <span class="cm">// отбор по строкам документа</span>
    Блокировка.Заблокировать();

    <span class="cm">// 2. Только теперь читаем остатки и пишем движения</span>
    Движения.ТоварыНаСкладах.Записывать = <span class="kw">Истина</span>;
    <span class="cm">// ...</span>
<span class="fn">КонецПроцедуры</span></pre>
<div class="explain"><b>Почему блокировка стоит до чтения.</b> Два кассира одновременно продают последнюю единицу товара. Оба прочитали «остаток 1», оба списали. Итог — минус один. Управляемая блокировка заставляет второго подождать, пока первый допишет движения.</div>
`},

{id:"a6",t:"Обновления, поддержка и расширения",sub:"Самая дорогая тема в жизни любого проекта",
 html:`
<p>Конфигурация клиента сравнивается с эталонной конфигурацией поставщика. Пока связь жива — конфигурация «на поддержке», и обновления накатываются почти автоматически.</p>
<div class="grid g2">
 <div class="card pad">
  <span class="tag g">правильный путь</span>
  <h4 style="margin:8px 0 6px">Расширение (.cfe)</h4>
  <ul class="tight">
   <li>Отдельный контейнер доработок поверх типовой</li>
   <li>Заимствует объекты, переопределяет методы через <span class="mono">&Вместо</span>, <span class="mono">&После</span>, <span class="mono">&Перед</span></li>
   <li>Конфигурация остаётся на поддержке — обновления дешёвые</li>
   <li>Ограничение: не всё можно сделать расширением</li>
  </ul>
 </div>
 <div class="card pad">
  <span class="tag r">дорога в один конец</span>
  <h4 style="margin:8px 0 6px">Снятие с поддержки</h4>
  <ul class="tight">
   <li>Правишь что угодно прямо в конфигурации</li>
   <li>Каждое обновление — ручное трёхстороннее сравнение</li>
   <li>Неделя работы вместо часа, и так навсегда</li>
   <li>Именно отсюда фраза «у нас конфа снята с поддержки» произносится с траурной интонацией</li>
  </ul>
 </div>
</div>
<p><b>Режим совместимости</b> — свойство конфигурации, заставляющее новую платформу вести себя как старая. Позволяет обновить платформу, ничего не сломав. Обратная сторона: новые возможности платформы недоступны, пока режим не снят, а снятие — отдельный проект с полным регрессом.</p>
<p><b>Функциональные опции</b> — механизм включения и выключения кусков функциональности. Именно поэтому в типовой «нет нужного поля»: оно есть, просто опция выключена. Прежде чем пилить доработку, всегда проверь, нет ли готовой опции.</p>
`}
];

/* ======================= ТЕОРИЯ: ПОД КАПОТОМ ======================= */
const HOOD = [
{id:"h1",t:"Язык запросов: чем он не SQL",g:"запросы",
 html:`
<ul class="tight">
<li><b>Только чтение.</b> Ни INSERT, ни UPDATE, ни DELETE. Данные меняются только через объектную модель или наборы записей.</li>
<li><b>Виртуальные таблицы.</b> Таблиц <span class="mono">Остатки</span>, <span class="mono">Обороты</span>, <span class="mono">СрезПоследних</span> физически не существует — платформа собирает их из движений и итогов.</li>
<li><b>Точка через точку.</b> <span class="mono">Номенклатура.ЕдиницаИзмерения.Наименование</span> — платформа молча дописывает ЛЕВОЕ СОЕДИНЕНИЕ. Для составного типа — соединение с каждой таблицей типа.</li>
<li><b>ИТОГИ ... ПО</b> — иерархический результат с подытогами. В SQL прямого аналога нет.</li>
<li><b>Пакеты и временные таблицы.</b> Несколько запросов через «;», <span class="mono">ПОМЕСТИТЬ</span> + <span class="mono">ИНДЕКСИРОВАТЬ ПО</span>.</li>
<li><b>NULL везде.</b> После левого соединения и после виртуальных таблиц числа приходят NULL, а не 0. <span class="mono">ЕСТЬNULL(Поле, 0)</span> — рефлекс.</li>
</ul>
<pre class="code"><span class="kw">ВЫБРАТЬ</span>
    Тов.Номенклатура <span class="kw">КАК</span> Номенклатура,
    <span class="fn">ЕСТЬNULL</span>(Ост.КоличествоОстаток, 0) <span class="kw">КАК</span> Остаток
<span class="kw">ИЗ</span>
    Справочник.Номенклатура <span class="kw">КАК</span> Тов
    <span class="kw">ЛЕВОЕ СОЕДИНЕНИЕ</span> РегистрНакопления.ТоварыНаСкладах.<span class="fn">Остатки</span>(
        &amp;Дата,                                  <span class="cm">// период — в параметры ВТ!</span>
        Склад = &amp;Склад                          <span class="cm">// отбор — тоже сюда, а не в ГДЕ</span>
    ) <span class="kw">КАК</span> Ост
    <span class="kw">ПО</span> Тов.Ссылка = Ост.Номенклатура</pre>
<div class="explain"><b>Три ошибки, за которые снимают на собеседовании:</b> отбор в <span class="mono">ГДЕ</span> вместо параметров виртуальной таблицы; условие на правую таблицу левого соединения в <span class="mono">ГДЕ</span> (соединение молча становится внутренним); запрос внутри цикла по табличной части.</div>
`},

{id:"h2",t:"Блокировки и транзакции",g:"нагрузка",
 html:`
<ul class="tight">
<li><b>Два режима.</b> Автоматические блокировки (устарели, СУБД сама, высокий уровень изоляции) и управляемые (современные: 1С сама ставит логические блокировки, СУБД работает на READ COMMITTED). Все актуальные конфигурации — на управляемых.</li>
<li><b>Разделяемая и исключительная.</b> Разделяемая совместима с разделяемой (много читателей), исключительная не совместима ни с чем.</li>
<li><b>Правило проведения:</b> заблокировать → прочитать → проверить → записать. Читать остатки без блокировки и потом списывать — гарантированный минус на складе под нагрузкой.</li>
<li><b>Дедлок</b> — два процесса ждут ресурсы друг друга. Лечение: единый порядок обращения к ресурсам, короткие транзакции, гранулярные блокировки.</li>
<li><b>Эскалация.</b> СУБД может укрупнить блокировку строк до блокировки страницы или таблицы. На больших пачках движений это внезапно останавливает всю базу.</li>
<li><b>Вложенных транзакций в 1С нет.</b> <span class="mono">НачатьТранзакцию</span> внутри транзакции только увеличивает счётчик; откат откатывает всё целиком.</li>
</ul>
<div class="explain"><b>Как ловят.</b> Технологический журнал (logcfg.xml) с событиями <span class="mono">TLOCK</span>, <span class="mono">TTIMEOUT</span>, <span class="mono">TDEADLOCK</span> — покажет, кто кого ждал и на каком ресурсе.</div>
`},

{id:"h3",t:"СКД: почему все отчёты делают здесь",g:"отчёты",
 html:`
<p>Система компоновки данных — декларативный движок отчётов. Разработчик описывает <b>что</b> есть, пользователь решает <b>как</b> смотреть.</p>
<ul class="tight">
<li><b>Схема (СКД)</b> — наборы данных (запрос, объект, объединение), поля, ресурсы, вычисляемые поля, связи, параметры.</li>
<li><b>Настройки</b> — группировки, отборы, выбранные поля, сортировка, условное оформление. Их правит пользователь, и код при этом не меняется.</li>
<li><b>Ресурс</b> — поле, которое агрегируется по группировкам. Забыл сделать ресурсом — в итогах пусто. Самая частая ошибка новичка.</li>
<li><b>Компоновщик макета → процессор компоновки → процессор вывода</b> — три шага, которые превращают схему и настройки в табличный документ.</li>
<li><b>Главное преимущество:</b> СКД сама дописывает в запрос только те поля и соединения, которые реально выбраны пользователем. Ручной запрос так не умеет.</li>
</ul>
<div class="explain"><b>Вопрос-ловушка:</b> «В чём разница между схемой компоновки данных и системой компоновки данных?» Схема — объект-описание конкретного отчёта. Система — механизм платформы, который эти схемы исполняет.</div>
`},

{id:"h4",t:"Регистры: как выбрать правильный",g:"данные",
 html:`
<div class="scrollx"><table class="t">
<thead><tr><th>Нужно</th><th>Регистр</th><th>Почему</th></tr></thead>
<tbody>
<tr><td>Остаток товара на складе на дату</td><td><b>Накопления (остатки)</b></td><td>Приход/расход, есть таблица итогов, виртуальная таблица Остатки</td></tr>
<tr><td>Сколько продали за месяц</td><td><b>Накопления (обороты)</b></td><td>Остаток бессмысленен, нужны только суммы за период</td></tr>
<tr><td>Цена номенклатуры на дату</td><td><b>Сведений, периодический</b></td><td>СрезПоследних вернёт актуальную запись на дату</td></tr>
<tr><td>Настройка «ответственный по складу»</td><td><b>Сведений, непериодический</b></td><td>Просто соответствие ключ → значение</td></tr>
<tr><td>Проводки Дт/Кт</td><td><b>Бухгалтерии</b></td><td>Двойная запись, план счетов, субконто</td></tr>
<tr><td>Начисления зарплаты с перерасчётом</td><td><b>Расчёта</b></td><td>Период действия, вытеснение, зависимость по базе</td></tr>
</tbody></table></div>
<p><b>Измерение, ресурс, реквизит</b> — три вида полей регистра, и путать их нельзя:</p>
<ul class="tight">
<li><b>Измерение</b> — разрез, входит в ключ, индексируется. В разрезе ЧЕГО храним.</li>
<li><b>Ресурс</b> — числовое поле, которое суммируется. СКОЛЬКО храним.</li>
<li><b>Реквизит</b> — просто дополнительная информация. Ни в ключ, ни в сумму не попадает.</li>
</ul>
`},

{id:"h5",t:"Производительность: с чего начинают",g:"нагрузка",
 html:`
<ol class="tight" style="padding-left:22px">
<li><b>Замер производительности</b> в конфигураторе — покажет, какая строка кода съедает время. Начинают всегда с него, а не с догадок.</li>
<li><b>Технологический журнал</b> — события <span class="mono">DBMSSQL</span> (какой SQL ушёл в базу), <span class="mono">EXCP</span> (исключения), <span class="mono">TLOCK</span>/<span class="mono">TDEADLOCK</span> (блокировки), <span class="mono">CALL</span> (вызовы сервера).</li>
<li><b>План запроса в СУБД</b> — если запрос идёт по Table Scan вместо Index Seek, проблема в отсутствующем индексе или в неудачном условии.</li>
<li><b>APDEX</b> — метрика удовлетворённости откликом (0..1) по ключевым операциям с целевым временем. Основа приёмки у крупных заказчиков.</li>
</ol>
<p><b>Топ причин тормозов в реальных базах:</b></p>
<ul class="tight">
<li>Запрос внутри цикла по табличной части (N+1 в чистом виде)</li>
<li>Отборы в <span class="mono">ГДЕ</span> вместо параметров виртуальных таблиц</li>
<li>Точка через точку по составному реквизиту</li>
<li>Соединение с подзапросом вместо временной таблицы</li>
<li>Отсутствие индекса на измерении, по которому идёт частый отбор</li>
<li>Длинные транзакции и блокировки на закрытии месяца</li>
<li>Неоправданно много измерений в регистре — раздутая таблица итогов</li>
</ul>
`},

{id:"h6",t:"Обмены и интеграции",g:"интеграции",
 html:`
<ul class="tight">
<li><b>Планы обмена</b> — базовый механизм: узлы + автоматическая регистрация изменений. Если данные «не уехали», первым делом смотрят регистрацию.</li>
<li><b>РИБ</b> — распределённая база: реплика с главным и подчинёнными узлами, изменения конфигурации разъезжаются автоматически.</li>
<li><b>КД 2.0 / КД 3.0</b> — конвертация данных: инструмент построения правил обмена между разными конфигурациями.</li>
<li><b>EnterpriseData</b> — универсальный формат-посредник от 1С. Конфигурации обмениваются не своими структурами, а общим форматом. Плюс: не переписывать правила при обновлении.</li>
<li><b>HTTP-сервисы и Web-сервисы (SOAP)</b> — «в чём разница» спрашивают почти на каждом собеседовании. HTTP-сервис — REST-подобный, лёгкий, работает с JSON. Web-сервис — SOAP с WSDL и XDTO, тяжелее и строже.</li>
<li><b>XDTO</b> — механизм платформы для работы с XML-схемами и типизированными объектами обмена.</li>
<li><b>JSON</b> — <span class="mono">ЗаписьJSON</span>/<span class="mono">ЧтениеJSON</span> и сериализация через <span class="mono">ЗначениеВJSON</span>. Стандарт для современных интеграций.</li>
</ul>
`},

{id:"h7",t:"БСП: не изобретай велосипед",g:"типовые",
 html:`
<p>Библиотека стандартных подсистем встроена почти во все типовые конфигурации. Знание БСП — главный маркер того, что разработчик работал с типовыми, а не только с самописками.</p>
<ul class="tight">
<li><b>Пользователи и права доступа</b>, профили групп доступа, RLS</li>
<li><b>Печать</b> — механизм печатных форм и комплектов документов</li>
<li><b>Дополнительные отчёты и обработки</b> — как подключить внешку без изменения конфигурации</li>
<li><b>Дополнительные реквизиты и сведения</b> — поля пользователя без доработки (поверх плана видов характеристик)</li>
<li><b>Присоединённые файлы</b> — вложения к объектам</li>
<li><b>Версионирование объектов</b> — история изменений</li>
<li><b>Длительные операции</b> — обёртка над фоновыми заданиями с прогрессом</li>
<li><b>Обмен данными</b>, обновление ИБ, регламентные задания, контактная информация, банки, адресный классификатор</li>
</ul>
<div class="explain">Исходники БСП открыты и лежат на GitHub (<span class="mono">1c-syntax/ssl_3_1</span>), а фирма «1С» выпускает расширение <span class="mono">ssl-support</span> для 1C:EDT. Читать код БСП — лучший способ научиться писать в стиле типовых.</div>
`},

{id:"h8",t:"Инженерная культура: Git, EDT, автотесты",g:"инструменты",
 html:`
<p>Ещё десять лет назад 1С-разработка жила в собственном мире без версионирования и тестов. Сейчас в сильных командах это уже норма, и на собеседовании про это спрашивают.</p>
<ul class="tight">
<li><b>Хранилище конфигурации</b> — штатный механизм: объекты захватываются эксклюзивно, потом помещаются. Древняя модель с блокировками, но работает.</li>
<li><b>1C:EDT</b> — среда на базе Eclipse: конфигурация лежит как исходники, есть нормальный Git, рефакторинг, сравнение веток. Тяжёлая, но это профессиональный стандарт для команд.</li>
<li><b>gitsync / OneScript</b> — выгрузка истории хранилища в Git без EDT. Плюс пакетный менеджер <span class="mono">opm</span> и целая экосистема утилит.</li>
<li><b>Vanessa Automation</b> — BDD-автотесты на Gherkin: сценарии «Дано / Когда / Тогда», которые кликают интерфейс. Рядом — xUnitFor1C и ADD.</li>
<li><b>BSL Language Server</b> — открытый анализатор кода 1С: диагностики, метрики, интеграция с VS Code и SonarQube. Даёт линтинг там, где платформа его не даёт.</li>
<li><b>CI/CD</b> — сборка cf/cfe, прогон тестов, выкладка на тестовый контур через Jenkins или GitLab CI.</li>
</ul>
`},

{id:"h9",t:"Права доступа и RLS",g:"типовые",
 html:`
<ul class="tight">
<li><b>Роль</b> — объект метаданных с набором прав на объекты (чтение, добавление, изменение, удаление, просмотр, интерактивное удаление).</li>
<li><b>RLS (Record Level Security)</b> — ограничение доступа на уровне записей: пользователь видит только свою организацию или свой склад. Задаётся текстом на языке запросов в шаблоне ограничения.</li>
<li><b>Цена RLS</b> — платформа дописывает условие ограничения в каждый запрос пользователя. Кривой RLS убивает производительность всей базы.</li>
<li>В типовых на БСП роли не назначаются напрямую — через <b>профили групп доступа</b>.</li>
</ul>
<div class="explain">«У пользователя не видно документа» — в 80% случаев это RLS, а не ошибка кода. Проверять начинают с профиля группы доступа.</div>
`},

{id:"h10",t:"Что ломается чаще всего",g:"практика",
 html:`
<p>Список задач, которые джуниор получит в первый месяц — и как их обычно решают.</p>
<div class="scrollx"><table class="t">
<thead><tr><th>Симптом от пользователя</th><th>Где искать на самом деле</th></tr></thead>
<tbody>
<tr><td>«Документ не проводится»</td><td>Контроль остатков, отсутствие цены, незаполненный обязательный реквизит. Смотреть текст ошибки и <span class="mono">ОбработкаПроведения</span>.</td></tr>
<tr><td>«Остатки неправильные»</td><td>Движения документа, задним числом введённые документы, разъехавшиеся итоги, перепроведение в хронологии.</td></tr>
<tr><td>«У меня не видно кнопку»</td><td>Права и профиль группы доступа, функциональная опция, настройка формы у конкретного пользователя.</td></tr>
<tr><td>«Отчёт пустой»</td><td>Отбор в настройках СКД, период, RLS, поле не сделано ресурсом.</td></tr>
<tr><td>«Тормозит»</td><td>Замер производительности → запрос в цикле → точки через точку → план запроса.</td></tr>
<tr><td>«Данные не ушли в другую базу»</td><td>Регистрация изменений в плане обмена, состояние узла, ошибки в правилах обмена.</td></tr>
<tr><td>«База не открывается»</td><td>Файловая — chdbfl, потом ТиИ. Клиент-серверная — служба агента, место на диске, журнал СУБД.</td></tr>
<tr><td>«После обновления всё сломалось»</td><td>Затёртые доработки. Сравнение с конфигурацией поставщика, откат на бэкап.</td></tr>
</tbody></table></div>
`}
];

</script>
<script>
/* PHRASES, QUIZ, INTERVIEW */
/* ============ СЛЕНГ-ДЕКОДЕР: живые фразы из рабочих чатов ============ */
const PHRASES = [
{p:"«Конфа снята с поддержки, так что обновление — это неделя в сравнилке.»",
 o:["Конфигурацию отключили от автоматических обновлений, обновлять придётся вручную",
    "Вендор прекратил выпуск обновлений для этой конфигурации, поэтому придётся переходить на другой продукт",
    "У клиента закончилась подписка ИТС, поэтому свежие релизы недоступны, пока её не продлят"],
 a:0,w:"«Снята с поддержки» — разорвана связь с конфигурацией поставщика. «Сравнилка» — инструмент конфигуратора «Сравнение, объединение конфигураций». Отсюда неделя вместо часа."},

{p:"«Кинь внешку, только под управляйку, у нас 8.3.27.»",
 o:["Пришли внешнюю обработку (.epf), совместимую с управляемыми формами, платформа 8.3.27",
    "Привези внешний жёсткий диск с копией базы, чтобы развернуть её на месте у клиента",
    "Сделай выгрузку данных во внешний файл в формате, который читает восьмая платформа"],
 a:0,w:"«Внешка» — внешняя обработка .epf. «Управляйка» — управляемые формы. Обработка под обычные формы в управляемом приложении просто не откроется."},

{p:"«Остатки поехали — глянь движения, там задним числом провели поступление.»",
 o:["Остатки разошлись с реальностью: смотри движения, документ провели задним числом",
    "Товар физически перевезли на другой склад, поэтому в отчётах он числится в другом подразделении",
    "Регистр накопления удалили вместе с движениями, и восстановить остатки можно только из копии"],
 a:0,w:"«Поехали» = разъехались с реальностью. «Движения» — записи документа в регистрах. Проведение задним числом ломает последовательность и себестоимость."},

{p:"«Не лезь в типовой модуль, сделай расширением — иначе на релизе всё затрёт.»",
 o:["Не меняй код типовой напрямую — вынеси доработку в расширение .cfe",
    "Не открывай этот модуль напрямую: он закрыт паролем поставщика, доступ есть только у вендора",
    "Не используй общие модули для такой логики, они медленнее и хуже читаются при отладке"],
 a:0,w:"Классический совет на код-ревью. Расширение позволяет остаться на поддержке; правка типового модуля означает потерю изменений при обновлении."},

{p:"«У тебя запрос в цикле по ТЧ — вот и APDEX 0,3.»",
 o:["Внутри цикла по табличной части идёт запрос к базе, это и есть тормоз",
    "В табличной части слишком много строк, поэтому форма не успевает отрисовать их за отведённое время",
    "Запрос написан рекурсивно и уходит в бесконечность, пока платформа не оборвёт его по таймауту"],
 a:0,w:"Запрос в цикле — 1С-версия проблемы N+1. Вместо N запросов делают один и работают с результатом. APDEX — метрика удовлетворённости откликом от 0 до 1."},

{p:"«Прибей сеанс, он висит с обеда и держит лицензию.»",
 o:["Завершить принудительно сеанс пользователя в консоли кластера — он занимает клиентскую лицензию",
    "Удалить пользователя из базы, чтобы освободить занятую им клиентскую лицензию",
    "Перезагрузить сервер СУБД, потому что зависшее соединение держит блокировку"],
 a:0,w:"Лицензию расходует именно сеанс, а не соединение. При нештатном завершении клиента сеанс держится ещё около 20 минут, потом уходит в спящий режим."},

{p:"«Данные не доехали в розницу — проверь регистрацию в плане обмена.»",
 o:["Изменения не зарегистрировались к отправке для этого узла обмена",
    "В магазине пропал интернет, поэтому сообщения обмена не доходят до центральной базы",
    "В розничной конфигурации нет нужного справочника, поэтому данные просто некуда принимать"],
 a:0,w:"План обмена автоматически регистрирует изменения для каждого узла. Нет регистрации — нечего выгружать. Это первое место, куда смотрят при сбое обмена."},

{p:"«Отчёт пустой» — «Ты Сумму ресурсом сделал?»",
 o:["В СКД поле не объявлено ресурсом, поэтому в итогах по группировкам ничего не считается",
    "В настройках отчёта не задан период, поэтому выборка получается пустой",
    "У пользователя нет прав на регистр, из которого отчёт берёт данные"],
 a:0,w:"Ресурс СКД — поле, которое агрегируется по группировкам. Если поле обычное, а не ресурс, в строках группировок будет пусто. Ошибка новичка номер один."},

{p:"«База битая, гоняй chdbfl, потом ТиИ с реиндексацией. Бэкап сделал?»",
 o:["Проверить целостность файловой базы утилитой, затем тестирование и исправление",
    "Переустановить платформу 1С, потому что повреждены её файлы, а сама база при этом цела",
    "Пересоздать базу с нуля и загрузить данные из выгрузки, потеряв всё, что накопилось после неё"],
 a:0,w:"chdbfl — утилита проверки физической целостности файловой базы. ТиИ — «Тестирование и исправление» в конфигураторе. Оба умеют удалять данные, поэтому бэкап обязателен."},

{p:"«Фильтр в ГДЕ убери, кинь в параметры виртуальной таблицы.»",
 o:["Отбор надо передавать прямо в параметры виртуальной таблицы регистра",
    "Условие ГДЕ вообще нельзя использовать в запросах к регистрам — платформа его игнорирует",
    "Виртуальные таблицы не поддерживают отборы, поэтому фильтровать приходится уже готовый результат"],
 a:0,w:"Один из главных приёмов оптимизации. Отбор внутри виртуальной таблицы попадает в SQL раньше агрегации и позволяет использовать индексы регистра."},

{p:"«Строки пропали после ЛЕВОГО СОЕДИНЕНИЯ» — «Условие на правую таблицу в ГДЕ перенеси в ПО.»",
 o:["Условие на правую таблицу в ГДЕ превращает левое соединение во внутреннее",
    "Левое соединение в 1С всегда работает как внутреннее, поэтому строки без пары не попадают в выборку",
    "Надо поменять таблицы местами в соединении, тогда сохранятся все строки основной таблицы"],
 a:0,w:"Классическая ловушка, общая с SQL. Условие на правую таблицу должно быть в ПО, иначе строки без пары отфильтруются по NULL."},

{p:"«Он у нас на УПП сидит, обычные формы, ищем человека второй месяц.»",
 o:["Проект на устаревшей конфигурации с legacy-интерфейсом, специалистов на рынке мало",
    "Сотрудник работает в другом отделе на старом компьютере, поэтому его сложно застать на месте",
    "Компания использует бесплатную учебную версию, поэтому доработки в ней невозможны"],
 a:0,w:"УПП — «Управление производственным предприятием», прошлое поколение на обычных формах. Дефицитная и оплачиваемая, но тупиковая компетенция: конфигурация уходит с поддержки."},

{p:"«Сделай через доп. реквизиты, это ПВХ, конфу трогать не будем.»",
 o:["Добавить поле дополнительными реквизитами БСП, не изменяя конфигурацию",
    "Добавить реквизит в справочник через конфигуратор, сняв конфигурацию с поддержки поставщика",
    "Завести отдельный справочник под это поле и связать его с номенклатурой вручную"],
 a:0,w:"ПВХ — план видов характеристик, механизм расширяемой типизации. Поверх него в БСП сделаны «Дополнительные реквизиты и сведения» — поля, которые заводит сам пользователь."},

{p:"«Ты в проде или в копии?»",
 o:["Уточнение, работаешь ли ты в рабочей базе с живыми пользователями или в тестовой копии",
    "Вопрос о том, скопировал ли ты код из другой конфигурации или написал его сам",
    "Вопрос о режиме работы: продуктивно ли идёт разработка или ты где-то застрял"],
 a:0,w:"Вопрос, от которого холодеет спина. «Прод» — рабочая база. Правило, которое нарушают все и потом жалеют: не экспериментировать на проде."},

{p:"«Тут &Вместо стоит — убьёшь типовую проверку. Переделай на &После.»",
 o:["Аннотация подменяет типовую процедуру целиком, нужна выполняющаяся после",
    "Надо поменять порядок процедур в модуле расширения, чтобы типовая вызвалась первой",
    "Нужно удалить расширение целиком и перенести доработку прямо в конфигурацию"],
 a:0,w:"&Вместо подменяет типовой метод целиком (штатная логика не выполнится). &После добавляет свой код после типового — безопаснее и переживает обновления."},

{p:"«Регламентники не работают» — «У них файловая, некому выполнять.»",
 o:["В файловом варианте регламентные задания выполняются только при активном сеансе, отдельного сервера нет",
    "Регламентные задания отключены в настройках базы, их надо включить в списке заданий",
    "У пользователя нет прав на запуск заданий, поэтому расписание не срабатывает"],
 a:0,w:"В клиент-серверном варианте задания выполняет кластер независимо от пользователей. В файловом — нужен запущенный сеанс, иначе ночные обмены просто не идут."},

{p:"«Списываешь остатки без блокировки — уйдёшь в минус под нагрузкой.»",
 o:["Перед чтением остатков надо ставить управляемую блокировку на регистр",
    "Нельзя списывать товар, пока он не оприходован документом поступления на этот склад",
    "Надо включить автоматические блокировки в свойствах конфигурации, тогда СУБД всё сделает сама"],
 a:0,w:"Порядок обязателен: заблокировать → прочитать → проверить → записать. Без блокировки два сеанса прочитают один и тот же остаток и оба спишут."},

{p:"«Дедлок каждый вечер на закрытии месяца, надо порядок захвата причесать.»",
 o:["Взаимная блокировка: код обращается к ресурсам в разном порядке",
    "Сервер перегружен вечером, потому что все запускают отчёты в конце рабочего дня",
    "Пользователи закрывают месяц одновременно с бухгалтерией, и база не тянет такую нагрузку"],
 a:0,w:"Золотое правило методики 1С: захватывать ресурсы во всех участках кода в одном и том же порядке. A→X→Y против B→Y→X даёт дедлок гарантированно."},

{p:"«Точки через точку по составному реквизиту убери — там девять джойнов вылезает.»",
 o:["Обращение через точку порождает соединения со всеми таблицами типа",
    "Надо убрать лишние точки в синтаксисе запроса, платформа не понимает такую запись",
    "Составные типы в запросах не поддерживаются, поэтому обращаться к ним нужно через функцию"],
 a:0,w:"Платформа неявно дописывает ЛЕВОЕ СОЕДИНЕНИЕ на каждое обращение через точку. Лечится ВЫРАЗИТЬ(... КАК ...) или явным соединением."},

{p:"«Возьми БСПшный механизм длительных операций, не изобретай прогресс-бар.»",
 o:["Взять готовый механизм длительных операций из БСП с индикацией прогресса",
    "Взять готовый компонент с Инфостарта, который рисует прогресс поверх формы",
    "Переписать обработку так, чтобы она выполнялась быстрее и прогресс был не нужен"],
 a:0,w:"«Не изобретай — в БСП это уже есть» — стандартный комментарий на ревью. ДлительныеОперации.ВыполнитьВФоне + ОжидатьЗавершение — типовой паттерн."},

{p:"«У пользователя не видно документ» — «RLS смотри, не код.»",
 o:["Ограничение доступа на уровне записей скрывает документ от пользователя",
    "Документ помечен на удаление, поэтому пропал из списка до очистки помеченных",
    "У пользователя старая версия клиента, которая не умеет показывать этот документ"],
 a:0,w:"RLS (Record Level Security) дописывает условие ограничения в каждый запрос пользователя. В 80% случаев «не видно» — это права, а не ошибка кода."},

{p:"«Замер сделай, потом приходи. Гадать не будем.»",
 o:["Запустить замер производительности и увидеть, какая строка съедает время",
    "Измерить время выполнения секундомером и сравнить с тем, что было на прошлой неделе",
    "Замерить объём базы данных, потому что от него напрямую зависит скорость работы"],
 a:0,w:"Оптимизация всегда начинается с измерения, а не с догадок. Замер производительности показывает распределение времени по строкам кода в процентах."},

{p:"«Взял дт-шку, развернул у себя, воспроизвёл.»",
 o:["Получил файл полной выгрузки информационной базы, загрузил её локально и повторил проблему",
    "Скачал документацию по задаче и разобрал описанный там сценарий по шагам",
    "Установил дополнительный модуль, который воспроизводит ошибку у себя локально"],
 a:0,w:".dt — файл выгрузки ИБ (данные + конфигурация). Универсальный способ передать базу целиком. Для больших баз медленно — там бэкапят средствами СУБД."},

{p:"«ЕСТЬNULL забыл — вот тебе и „поле не является значением объектного типа“.»",
 o:["После левого соединения незаполненные числа приходят как NULL",
    "В запросе используется несуществующее поле, поэтому платформа не может его вычислить",
    "Объект был удалён из базы, и ссылка на него стала указывать в пустоту"],
 a:0,w:"После ЛЕВОГО СОЕДИНЕНИЯ и после виртуальных таблиц остатков пустые значения — это NULL, а не 0 и не пустая ссылка. Рефлекс: ЕСТЬNULL(Поле, 0)."},

{p:"«rphost сожрал 40 гигов, поставь ограничение памяти рабочего процесса.»",
 o:["Рабочий процесс разросся из-за утечки, нужен лимит памяти в кластере",
    "Надо докупить оперативную память на сервер, потому что её перестало хватать всем сеансам",
