const INTERVIEW = [
{lvl:"junior",g:"Метаданные",q:"Какие основные объекты метаданных вы знаете и чем они отличаются?",
 a:"Справочники — условно-постоянные списки (Номенклатура, Контрагенты). Документы — факты хозяйственной жизни с датой и признаком проведения, формируют движения. Регистры сведений — данные в разрезе измерений, периодические и непериодические. Регистры накопления — количественный учёт, остатки и обороты. Регистры бухгалтерии — проводки по плану счетов. Регистры расчёта — периодические расчёты в зарплате. Отчёты и обработки собственных данных не хранят."},
{lvl:"junior",g:"Метаданные",q:"Чем отличаются измерение, ресурс и реквизит регистра?",
 a:"Измерение — разрез хранения, входит в ключ записи и индексируется. Ресурс — числовое поле, которое суммируется по группировкам и попадает в таблицу итогов. Реквизит — дополнительная информация, ни в ключ, ни в агрегацию не входит. Формула для запоминания: в разрезе ЧЕГО храним СКОЛЬКО, плюс справочная информация."},
{lvl:"junior",g:"Метаданные",q:"Когда использовать регистр сведений, а когда регистр накопления?",
 a:"Регистр сведений — когда нужно хранить состояние или соответствие: цена на дату, курс валюты, ответственный по складу. Регистр накопления — когда величина накапливается приходами и расходами и нужны остатки либо обороты: товары на складах, взаиморасчёты, продажи. Проверочный вопрос: имеет ли смысл слово «остаток». Если да — накопления."},
{lvl:"junior",g:"Метаданные",q:"Чем отличается табличная часть от регистра сведений?",
 a:"Табличная часть принадлежит конкретному объекту и живёт только вместе с ним, доступ идёт через объект. Регистр сведений независим, имеет собственный ключ по измерениям, поддерживает периодичность и срезы, читается запросом напрямую и может заполняться разными источниками."},
{lvl:"junior",g:"Метаданные",q:"Чем отличаются NULL, Неопределено, Пустая ссылка и Битая ссылка?",
 a:"NULL — отсутствие значения в результате запроса, обычно после левого соединения. Неопределено — значение по умолчанию для нетипизированной переменной или реквизита составного типа. Пустая ссылка — валидная ссылка соответствующего типа, указывающая на «ничего» (Справочники.Контрагенты.ПустаяСсылка()). Битая ссылка — ссылка на физически отсутствующий в базе объект, следствие нарушения целостности."},
{lvl:"junior",g:"Запросы",q:"Напишите запрос: остатки номенклатуры на складе на определённую дату.",
 a:"ВЫБРАТЬ Ост.Номенклатура, ЕСТЬNULL(Ост.КоличествоОстаток, 0) КАК Остаток ИЗ РегистрНакопления.ТоварыНаСкладах.Остатки(&Дата, Склад = &Склад) КАК Ост. Ключевое, что оценивают: параметры передаются в саму виртуальную таблицу, а не в ГДЕ; результат обёрнут в ЕСТЬNULL."},
{lvl:"junior",g:"Запросы",q:"Что такое виртуальная таблица и какие вы знаете?",
 a:"Таблица, которой физически нет в СУБД: платформа формирует её на лету из таблицы движений и таблиц итогов. Для регистра накопления — Остатки, Обороты, ОстаткиИОбороты. Для регистра сведений — СрезПоследних и СрезПервых (только для периодических). Для регистра бухгалтерии — Обороты, ОстаткиИОбороты, ДвиженияССубконто."},
{lvl:"junior",g:"Запросы",q:"Чем виртуальная таблица отличается от временной?",
 a:"Виртуальная формируется платформой из данных регистра в момент выполнения запроса и существует только внутри него. Временная создаётся разработчиком через ПОМЕСТИТЬ, материализуется в менеджере временных таблиц, живёт между запросами пакета и может быть проиндексирована через ИНДЕКСИРОВАТЬ ПО."},
{lvl:"junior",g:"Запросы",q:"Зачем нужна функция ЕСТЬNULL?",
 a:"Заменяет NULL на заданное значение. После левого соединения и после виртуальных таблиц остатков непустых пар может не быть, и числовые поля приходят как NULL. Арифметика с NULL даёт NULL, а сравнение NULL с числом не истинно — из-за этого молча пропадают строки и обнуляются суммы."},
{lvl:"junior",g:"Формы",q:"Чем отличаются управляемые формы от обычных?",
 a:"В обычных формах разработчик размещает элементы вручную, код исполняется в толстом клиенте без разделения на клиент и сервер. В управляемых состав формы описывается декларативно, платформа сама компонует представление под тонкий, веб- и мобильный клиент, а код обязан разделяться директивами компиляции. Обычные формы — legacy, для нового кода не используются."},
{lvl:"junior",g:"Формы",q:"Какие директивы компиляции вы знаете?",
 a:"&НаКлиенте — исполняется у пользователя, базы не видит. &НаСервере — исполняется на сервере с полным контекстом формы, контекст передаётся туда и обратно. &НаСервереБезКонтекста — на сервере без данных формы, только явные параметры, самая экономичная. &НаКлиентеНаСервереБезКонтекста — чистая функция, платформа сама решает, где исполнить."},
{lvl:"junior",g:"Формы",q:"Чем отличается ПередЗаписью от ПриЗаписи?",
 a:"ПередЗаписью выполняется до записи в базу, ещё вне финального состояния, и может отменить операцию через параметр Отказ — там уместны проверки. ПриЗаписи выполняется уже внутри транзакции записи, когда объект записан; там делают связанные изменения. Ошибка в ПриЗаписи откатывает всю транзакцию."},
{lvl:"junior",g:"Модули",q:"Чем отличается модуль объекта от модуля менеджера?",
 a:"Модуль объекта относится к конкретному экземпляру: там живут ПередЗаписью, ПриЗаписи, ОбработкаПроведения, ОбработкаЗаполнения. Модуль менеджера относится к типу в целом: общие методы вроде печати, автозаполнения, выборок, вызываемые без создания объекта. Оба всегда исполняются на сервере."},
{lvl:"junior",g:"Проведение",q:"Что происходит при проведении документа?",
 a:"Вызывается ОбработкаПроведения в модуле объекта, всё внутри транзакции. Корректная последовательность: установить управляемые блокировки на нужные регистры, прочитать остатки, выполнить проверки, записать движения. После записи платформа контролирует, не ушли ли ресурсы в минус, если контроль включён. Отмена проведения удаляет движения через ОбработкаУдаленияПроведения."},

{lvl:"middle",g:"Запросы",q:"Как оптимизировать медленный запрос?",
 a:"Сначала измерить: замер производительности, затем технологический журнал по DBMSSQL и план запроса в СУБД. Дальше по списку: перенести отборы в параметры виртуальных таблиц; убрать обращения через точку по составным реквизитам, заменив на ВЫРАЗИТЬ или явное соединение; вынести подзапросы и виртуальные таблицы во временные таблицы с ИНДЕКСИРОВАТЬ ПО; убрать соединения через ИЛИ; не выбирать лишние поля; проверить, что нет запроса в цикле."},
{lvl:"middle",g:"Запросы",q:"Чем ОБЪЕДИНИТЬ отличается от ОБЪЕДИНИТЬ ВСЕ?",
 a:"ОБЪЕДИНИТЬ устраняет дубликаты строк, что требует сортировки и сравнения и стоит дороже. ОБЪЕДИНИТЬ ВСЕ просто склеивает наборы. Если дубликаты заведомо невозможны или не мешают, используют ОБЪЕДИНИТЬ ВСЕ."},
{lvl:"middle",g:"Запросы",q:"Почему обращение через точку в запросе может быть опасным?",
 a:"Платформа неявно добавляет левое соединение с таблицей, на которую ведёт ссылка. Для составного типа соединение добавляется с таблицей каждого возможного типа — одно обращение может развернуться в несколько соединений. Решение: ВЫРАЗИТЬ(Поле КАК Документ.Реализация) либо явное соединение с нужной таблицей."},
{lvl:"middle",g:"Блокировки",q:"Чем управляемые блокировки отличаются от автоматических?",
 a:"В автоматическом режиме целостность обеспечивает СУБД на высоком уровне изоляции — разработчик не делает ничего, но параллельность низкая. В управляемом режиме СУБД работает на READ COMMITTED, а логические блокировки по измерениям ставит сам механизм 1С — параллельность выше, но ответственность на разработчике: не поставил блокировку перед чтением, поставил после — получил гонку и минус на складе."},
{lvl:"middle",g:"Блокировки",q:"Что такое дедлок и как с ним бороться?",
 a:"Циклическое ожидание: транзакция A держит ресурс X и ждёт Y, транзакция B держит Y и ждёт X. Разрешается только принудительным снятием одной из них. Лечение: единый порядок захвата ресурсов во всём коде, короткие транзакции, узкая область блокировки по измерениям вместо всего регистра, никаких пользовательских диалогов внутри транзакции. Диагностика — технологический журнал, событие TDEADLOCK."},
{lvl:"middle",g:"Блокировки",q:"Есть ли в 1С вложенные транзакции?",
 a:"Синтаксически НачатьТранзакцию можно вызвать внутри уже открытой, но настоящей вложенности нет — платформа лишь увеличивает счётчик. Фиксируется всё только при закрытии внешней транзакции, а откат откатывает всё целиком. Поэтому попытка «откатить только часть» через вложенную транзакцию не работает."},
{lvl:"middle",g:"СКД",q:"Из чего состоит схема компоновки данных?",
 a:"Наборы данных (запрос, объект, объединение), поля с ролями, вычисляемые поля, ресурсы, параметры, связи наборов и настройки по умолчанию. Дальше работает цепочка: компоновщик макета соединяет схему с настройками, процессор компоновки выполняет запросы и агрегирует, процессор вывода формирует табличный документ."},
{lvl:"middle",g:"СКД",q:"В чём разница между схемой компоновки данных и системой компоновки данных?",
 a:"Система компоновки данных — механизм платформы, который умеет исполнять отчёты. Схема компоновки данных — конкретный объект-описание одного отчёта, который этот механизм исполняет. Вопрос-ловушка на созвучии аббревиатур."},
{lvl:"middle",g:"Типовые",q:"Что такое БСП и зачем она нужна?",
 a:"Библиотека стандартных подсистем — общий набор готовых механизмов от 1С, встроенный почти во все типовые: права доступа и профили, печать, дополнительные отчёты и обработки, дополнительные реквизиты и сведения, присоединённые файлы, версионирование, длительные операции, обмен данными, обновление ИБ. Смысл в том, чтобы не изобретать заново и писать в стиле, который поймёт следующий разработчик."},
{lvl:"middle",g:"Типовые",q:"Как правильно дорабатывать типовую конфигурацию?",
 a:"По возрастанию инвазивности: сначала штатные настройки и функциональные опции; затем механизмы БСП — дополнительные реквизиты, дополнительные обработки; затем расширение конфигурации с аннотациями &После и &Перед; &Вместо только когда иначе никак. Правка типовых модулей со снятием с поддержки — крайняя мера, потому что превращает каждое будущее обновление в ручное сравнение."},
{lvl:"middle",g:"Обмены",q:"В чём разница между HTTP-сервисом и Web-сервисом?",
 a:"Web-сервис — SOAP: описание в WSDL, типизация через XDTO, строгий контракт, больше накладных расходов. HTTP-сервис — произвольная обработка HTTP-запроса, REST-подобный подход, обычно JSON, легче и гибче. Для новых интеграций по умолчанию берут HTTP-сервис; SOAP — когда так требует внешняя система."},
{lvl:"middle",g:"Обмены",q:"Как устроен обмен через план обмена?",
 a:"В плане обмена описаны узлы и состав данных. При изменении объекта платформа автоматически регистрирует изменение для всех подписанных узлов в служебной таблице регистрации. При выгрузке формируется сообщение с зарегистрированными изменениями; регистрация снимается только после подтверждения приёма квитанцией. Поэтому при разборе «данные не уехали» первым делом смотрят регистрацию изменений."},
{lvl:"middle",g:"Обмены",q:"Что такое EnterpriseData?",
 a:"Универсальный формат обмена от 1С на базе XDTO, введённый в Конвертации данных 3.0. Конфигурации обмениваются не собственными структурами, а общей схемой-посредником. Главное преимущество: правила не приходится переписывать при обновлении конфигураций с обеих сторон. Ограничение — не все прикладные поля есть в формате, нестандартное приходится дописывать вручную."},
{lvl:"middle",g:"Права",q:"Что такое RLS и чем он опасен?",
 a:"Record Level Security — ограничение доступа на уровне записей: условие на языке запросов, которое платформа дописывает в каждый запрос пользователя. Позволяет показывать сотруднику только его организацию или склад. Опасность в производительности: сложные ограничения разворачиваются в запросы с десятками и сотнями соединений, оптимизатор СУБД перестаёт находить хороший план, и время выполнения становится непредсказуемым."},
{lvl:"middle",g:"Платформа",q:"Чем отличается фоновое задание от регламентного?",
 a:"Регламентное задание — описание того, что и по какому расписанию должно выполняться. Фоновое задание — конкретный экземпляр исполнения, который можно запустить и программно. Важнейший нюанс: в файловом варианте регламентные задания выполняются только при активном сеансе, поэтому ночные обмены в файловой базе не идут; в клиент-серверном их выполняет кластер независимо от пользователей."},

{lvl:"senior",g:"Нагрузка",q:"Что такое APDEX и как он считается?",
 a:"Метрика удовлетворённости временем отклика. Для ключевой операции задаётся целевое время T. APDEX = (NS + NT/2) / N, где NS — число выполнений быстрее T, NT — от T до 4T, N — всего замеров. Значение выше 0,85 считается хорошим, ниже 0,7 — критичным. В БСП это подсистема «Оценка производительности» с ключевыми операциями и регистром замеров."},
{lvl:"senior",g:"Нагрузка",q:"Что такое разделитель итогов и когда он не помогает?",
 a:"Служебное поле _Splitter в таблице итогов регистра накопления. При конкурентной записи по одному набору измерений каждая транзакция пишет в свою параллельную строку итога вместо конкуренции за одну, при чтении платформа их суммирует. Не помогает, когда включено БлокироватьДляИзменения: управляемая блокировка по измерениям всё равно сериализует транзакции, и выигрыш от разделения теряется."},
{lvl:"senior",g:"Нагрузка",q:"Что такое эскалация блокировок?",
 a:"СУБД укрупняет множество блокировок строк или страниц до блокировки всей таблицы, когда их становится слишком много (в MS SQL ориентир — около 5000 в одной операции) либо не хватает памяти под менеджер блокировок. Эффект: массовая операция внезапно останавливает работу всех пользователей с этой таблицей. Лечится дроблением пакетов и сокращением объёма изменений в одной транзакции."},
{lvl:"senior",g:"Нагрузка",q:"Как диагностировать проблему производительности в проде?",
 a:"Сверху вниз: подсистема оценки производительности и APDEX покажут, какие ключевые операции деградировали. Замер производительности локализует строку кода. Технологический журнал по DBMSSQL, TLOCK, TTIMEOUT, TDEADLOCK, EXCP покажет реальный SQL, длительности и конфликты блокировок. План запроса в СУБД покажет сканы вместо поиска по индексу. Дальше — уровень ОС и сети. Гадать без замеров бессмысленно."},
{lvl:"senior",g:"Платформа",q:"Как работает балансировка нагрузки в кластере серверов?",
 a:"Агент сервера ведёт реестр кластеров, менеджер кластера собирает статистику по производительности рабочих процессов и направляет новые подключения к наименее загруженному rphost. Уже подключённые клиенты переносятся только при отказе процесса или существенной разнице производительности. Через требования назначения функциональности можно закреплять сервисы и базы за конкретными серверами, но полноценно это доступно в версии КОРП."},
{lvl:"senior",g:"Платформа",q:"Что такое режим совместимости и чем он мешает?",
 a:"Свойство конфигурации, заставляющее новую платформу вести себя как указанная старая версия. Позволяет обновить платформу, не меняя поведение прикладного решения. Обратная сторона: новые возможности платформы и языка остаются недоступны, пока режим не снят. Снятие — отдельный проект с полным регрессионным тестированием, потому что меняется поведение множества механизмов сразу."},
{lvl:"senior",g:"Архитектура",q:"Когда стоит выбрать разделение данных вместо RLS?",
 a:"Разделение данных через общий реквизит-разделитель физически отделяет данные областей столбцом во всех таблицах — доступ фильтруется дёшево и предсказуемо. RLS фильтрует одну общую таблицу условием в каждом запросе, и на сложных правилах его стоимость растёт непредсказуемо. Если изоляция нужна между независимыми организациями или арендаторами, разделение данных архитектурно чище; RLS уместнее для гибких правил внутри одной организации."},
{lvl:"senior",g:"Инструменты",q:"Как организовать командную разработку и CI для 1С?",
 a:"Два пути. Штатный: хранилище конфигурации с захватом объектов, поверх — выгрузка истории в Git через 1С:ГитКонвертер или gitsync на OneScript. Современный: 1C:EDT, где конфигурация хранится исходниками и Git работает нативно. Дальше пайплайн: сборка cf и cfe через vrunner, загрузка в тестовую базу, синтаксическая проверка, автотесты Vanessa Automation и YAxUnit, статический анализ BSL Language Server с гейтом в SonarQube, отчёты в Allure. На практике полный цикл есть у меньшинства команд."}

{"q":"Из каких процессов состоит узел кластера серверов 1С?","s":"Скрининг","g":"общее","a":"Три вида процессов. <b>ragent</b> — агент сервера, запускается службой и держит весь узел: знает список кластеров на этой машине. <b>rmngr</b> — менеджер кластера: ведёт сеансы и соединения, распределяет нагрузку. <b>rphost</b> — рабочий процесс, в котором выполняется прикладной код; их несколько, и именно они потребляют память.","k":["ragent — агент сервера, служба","rmngr — менеджер кластера, сеансы и распределение","rphost — рабочий процесс, здесь исполняется код","rphost можно перезапускать, не роняя весь кластер"]},
{"q":"Что такое кластер серверов 1С?","s":"Скрининг","g":"нагрузка","see":["Кластер серверов 1С"],"a":"Логическое объединение рабочих процессов, обслуживающих одну или несколько информационных баз. Клиент подключается не к СУБД, а к кластеру: тот выполняет прикладной код и сам ходит в базу данных. Кластер даёт отказоустойчивость и балансировку — нагрузку можно разнести по нескольким рабочим серверам.","k":["клиент не ходит в СУБД напрямую, только в кластер","кластер выполняет прикладной код на сервере","даёт балансировку нагрузки и отказоустойчивость","может объединять несколько рабочих серверов"]},
{"q":"С какими платформами виртуализации приходилось работать?","s":"Скрининг","g":"язык","see":["Платформа"],"t":"hr","a":"Проверяют, понимаете ли вы, где физически живёт сервер. Достаточно назвать то, с чем сталкивались: VMware, Hyper-V, Proxmox, KVM. Если не сталкивались — так и скажите, но добавьте, что знаете о влиянии виртуализации на производительность 1С: диски и память на виртуалке часто и есть причина тормозов.","k":["назвать конкретные платформы, а не «работал с виртуалками»","если опыта нет — сказать прямо","связать с производительностью: диск и память виртуалки"]},
{"q":"Какой опыт работы с Linux у вас есть?","s":"Скрининг","g":"опыт","t":"hr","a":"Вопрос про инфраструктуру, а не про программирование. Ждут понимания, что сервер 1С и PostgreSQL часто живут под Linux. Полезно назвать уровень честно: ставили ли сервер сами, читаете ли логи, умеете ли работать в консоли. «Не администрировал, но ориентируюсь» — нормальный ответ, если это правда.","k":["сервер 1С и PostgreSQL часто работают под Linux","честно обозначить уровень: пользователь, читатель логов, администратор","преувеличивать опасно — проверят следующим вопросом"]},
{"q":"Что такое БСП и какие её подсистемы вы применяли?","s":"Скрининг","g":"типовые","a":"Библиотека стандартных подсистем — набор готовых механизмов, встроенный почти во все типовые конфигурации. Отвечать стоит не определением, а конкретикой: какие подсистемы использовали. Самые ходовые — присоединённые файлы, дополнительные реквизиты и сведения, дополнительные отчёты и обработки, длительные операции, регламентные задания, версионирование объектов.","k":["БСП встроена почти во все типовые","называйте конкретные подсистемы, а не только определение","дополнительные обработки — способ поставить внешку туда, где нельзя менять конфигурацию","«не изобретай — в БСП это уже есть» — обычный довод на код-ревью"],"miss":"Ответ «это библиотека от 1С» и всё. Интервьюер ждёт, что вы назовёте подсистемы, которыми пользовались руками."},
{"q":"В каком объекте метаданных описываются этапы производства?","s":"Скрининг","g":"общее","see":["Модуль объекта"],"a":"В <b>Спецификациях</b> и <b>Ресурсных спецификациях</b> — там задаётся состав материалов и последовательность этапов. Сами этапы как объекты производства ведутся документами «Этап производства», а маршрут описывается в ресурсной спецификации ERP. В более простых конфигурациях этапов нет вовсе: производство сворачивается в одну операцию выпуска.","k":["ресурсная спецификация задаёт маршрут и этапы","этап производства оформляется документом","в лёгких конфигурациях этапов нет — только выпуск"]},
{"q":"Какие счета затрат есть в плане счетов бухгалтерского учёта?","s":"Скрининг","g":"учёт","see":["План счетов"],"a":"Основные счета затрат — <b>20</b> «Основное производство», <b>23</b> «Вспомогательные производства», <b>25</b> «Общепроизводственные расходы», <b>26</b> «Общехозяйственные расходы», <b>44</b> «Расходы на продажу». Затраты собираются на них в течение месяца, а при закрытии месяца распределяются на себестоимость или на финансовый результат.","k":["20 — основное производство","25 и 26 — общепроизводственные и общехозяйственные","44 — расходы на продажу","закрываются при закрытии месяца, а не сразу"]},
{"q":"Какие три основных типа номенклатуры выделяют в учёте?","s":"Скрининг","g":"учёт","see":["Номенклатура","Характеристики"],"a":"Три типа номенклатуры: товары, продукция и услуги. <b>Товар</b> покупают и перепродают, он лежит на складе. <b>Продукция</b> выпускается собственным производством. <b>Услуга</b> не имеет остатка на складе вообще — её нельзя оприходовать. Различие не косметическое: от типа зависит, какие счета и регистры задействует документ.","k":["товар — купили и продали, есть складской остаток","продукция — выпущена своим производством","услуга — складского остатка не имеет","от типа зависят счета учёта и движения"]},
{"q":"Какой вид регистра накопления используется для контроля остатков?","s":"Скрининг","g":"мета","see":["Регистр накопления","Регистр сведений","Регистр бухгалтерии"],"a":"Регистр накопления вида <b>«Остатки»</b>. У него есть виртуальные таблицы Остатки, Обороты и ОстаткиИОбороты, и именно он умеет отдать состояние на момент. Вид <b>«Обороты»</b> хранит только приход-расход за период и остатка не считает — для контроля хватает его не будет.","k":["вид «Остатки», а не «Обороты»","виртуальные таблицы Остатки, Обороты, ОстаткиИОбороты","у вида «Обороты» таблицы остатков нет"],"miss":"Сказать просто «регистр накопления». Интервьюер спрашивает именно про вид — их два, и подходит только один."},
{"q":"Какая предопределённая процедура вызывается при вводе на основании?","s":"Скрининг","g":"язык","see":["Документ-основание"],"a":"Предопределённая процедура <b>ОбработкаЗаполнения</b> в модуле объекта. В неё приходит параметр «Основание» — ссылка на документ-источник, и по нему заполняются реквизиты. Логику ввода на основании кладут именно сюда, а не в форму: тогда заполнение отработает и при программном создании документа.","k":["ОбработкаЗаполнения в модуле объекта","параметр Основание — ссылка на документ-источник","в модуле объекта, чтобы работало и из кода"]},
{"q":"Сколько модулей у обработки и какие это модули?","s":"Скрининг","g":"язык","see":["Обработка"],"a":"Два: <b>модуль объекта</b> и <b>модуль менеджера</b>. Плюс у каждой формы обработки свой модуль формы, но он принадлежит форме, а не самой обработке. В модуле объекта — логика конкретного экземпляра, в модуле менеджера — то, что относится к обработке в целом.","k":["модуль объекта и модуль менеджера","модуль формы принадлежит форме, а не обработке","менеджер — про тип целиком, объект — про экземпляр"]},

{"q":"До этого места работы опыт в 1С уже был?","s":"Скрининг","g":"опыт","t":"hr","a":"Проверяют, сходится ли рассказ с резюме, и восстанавливают хронологию. Отвечайте по порядку: где начинали, сколько это длилось, чем занимались. Если пришли из смежной области — эникей, поддержка, бухгалтерия — это плюс, а не минус: такие люди быстрее понимают предметную область.","k":["ответить хронологически, без прыжков","смежный опыт называть, а не прятать","совпадать с тем, что написано в резюме"]},
{"q":"Работали ли с нетиповыми конфигурациями?","s":"Скрининг","g":"типовые","see":["Конфигурация","Расширение конфигурации","Хранилище конфигурации"],"t":"hr","a":"Проверяют, умеете ли вы работать там, где нет документации и поддержки поставщика. Полезно различить в ответе три случая: типовая без изменений, типовая доработанная и самописная — работа в них устроена по-разному. Если была самописка, скажите, как в ней разбирались.","k":["различать типовую, доработанную и самописную","в самописке нет обновлений от вендора и часто нет документации","рассказать, как разбирались в чужом коде"]},
{"q":"Как к вам попадали задачи и кто определял приоритеты?","s":"Скрининг","g":"опыт","t":"hr","a":"Выясняют, из какого процесса вы пришли: заявки от пользователей, задачи от аналитика, доска спринта. Ответ показывает, привыкли ли вы к постановке или к тому, чтобы вытягивать её самому. Полезно назвать инструмент учёта задач и того, кто расставлял приоритеты.","k":["назвать источник задач: заявки, аналитик, спринт","назвать инструмент учёта задач","сказать, кто расставлял приоритеты"]},
{"q":"Сколько человек было в команде или вы вели задачи в одиночку?","s":"Скрининг","g":"опыт","t":"hr","a":"Проверяют опыт совместной разработки: хранилище или Git, код-ревью, разделение зон. Одиночная работа не минус, но тогда стоит показать, что вы знаете, как устроена командная: захват объектов в хранилище, конфликты при объединении.","k":["назвать размер команды и свою роль в ней","сказать, как разделяли работу: хранилище, ветки","если работали один — показать понимание командного процесса"]},
{"q":"Работали по техническому заданию и был ли в команде аналитик?","s":"Скрининг","g":"опыт","t":"hr","a":"Выясняют, кто у вас превращал пожелание пользователя в постановку. Если аналитика не было и постановку делали сами — так и скажите: умение вытащить требования из бухгалтера ценится отдельно. Если ТЗ было — стоит упомянуть, насколько подробным оно приходило.","k":["сказать, был ли аналитик или постановку делали сами","умение собрать требования самому — плюс","оценить, насколько подробным было ТЗ"]},
{"q":"Сколько активных пользователей было в системе?","s":"Скрининг","g":"общее","t":"hr","a":"Вопрос про масштаб, а не про точную цифру. Разница между 20 и 500 одновременных сеансов — это разные проблемы: во втором случае появляются блокировки, регламентные задания в окно и разговоры про производительность. Назовите порядок и добавьте, файловая была база или клиент-серверная.","k":["назвать порядок величины, а не точное число","уточнить: одновременных сеансов или всего заведено","сказать, файловая база или клиент-серверная"]},
{"q":"Приходилось ли писать фоновые задания, обрабатывающие много транзакций одновременно?","s":"Скрининг","g":"нагрузка","t":"hr","a":"Проверяют, сталкивались ли вы с конкурентным доступом. Если да — расскажите, как делили работу на порции, ставили ли управляемые блокировки и как ловили взаимоблокировки. Если нет — честно скажите, но покажите, что знаете порядок: заблокировать, прочитать, проверить, записать.","k":["фоновое задание выполняется вне пользовательского сеанса","при параллельной обработке нужны управляемые блокировки","порядок: заблокировать → прочитать → проверить → записать","разбиение на порции снижает конкуренцию"]},
{"q":"Приходилось ли работать с индексами?","s":"Скрининг","g":"запросы","t":"hr","a":"Ждут не теорию про B-дерево, а практику: индексировали ли вы измерения регистров и реквизиты, ставили ли <b>ИНДЕКСИРОВАТЬ ПО</b> на временных таблицах в пакетных запросах. Хороший ответ связывает индекс с конкретной проблемой: «запрос по временной таблице тормозил, добавили индекс — стало быстрее».","k":["индексирование реквизитов и измерений в конфигураторе","ИНДЕКСИРОВАТЬ ПО на временных таблицах","связать индекс с конкретным замером до и после"],"miss":"Общие слова про «ускоряют выборку». Ждут случай из практики."},
{"q":"Чем занималась компания и в чём была специфика её производства?","s":"Скрининг","g":"общее","t":"hr","a":"Проверяют, разбирались ли вы в предметной области или только правили код по постановке. Понимание бизнеса клиента — половина работы одинэсника: без него нельзя отличить ошибку в данных от особенности учёта. Достаточно двух-трёх предложений про отрасль и про то, что в учёте было нестандартного.","k":["назвать отрасль и масштаб","сказать, что в учёте было нестандартного","показать, что понимали бизнес, а не только код"]},
{"q":"Почему ищете новую работу и что не устраивает на текущей?","s":"Скрининг","g":"общее","see":["Полнотекстовый поиск"],"t":"hr","a":"Проверяют, не конфликтный ли вы человек и совпадут ли ожидания. Работает формулировка через то, чего хотите, а не через то, чем плохо сейчас: «упёрся в потолок по задачам, хочу расти в производительность и архитектуру». Критика прошлого работодателя почти всегда читается против вас.","k":["говорить о том, куда хотите, а не о том, что бесит","называть конкретное направление роста","не критиковать прошлых коллег и руководителя"]},
{"q":"По каким критериям выбираете работодателя и на что смотрите в вакансии?","s":"Скрининг","g":"общее","see":["Документ-основание"],"t":"hr","a":"Смотрят, осознанный ли выбор и подойдёте ли вы по ожиданиям. Полезно назвать два-три конкретных критерия — конфигурации, тип компании (франч, продуктовая, внутренняя автоматизация), процессы разработки. Ответ «главное деньги» закрывает разговор о мотивации, ответ «мне всё равно» — о серьёзности намерений.","k":["назвать два-три конкретных критерия","различать франч, продуктовую компанию и внутреннюю автоматизацию","критерии должны совпадать с тем, куда вы пришли"]},

var MOODS = {
  idle:    {brows:"neutral", eyes:"open",   mouth:"smile"},
  blink:   {brows:"neutral", eyes:"blink",  mouth:"smile"},
  happy:   {brows:"up",      eyes:"happy",  mouth:"big"},
  cheer:   {brows:"up",      eyes:"happy",  mouth:"big"},
  sad:     {brows:"worried", eyes:"sad",    mouth:"frown"},
  think:   {brows:"down",    eyes:"squint", mouth:"flat"},
  wow:     {brows:"up",      eyes:"wide",   mouth:"o"},
  neutral: {brows:"neutral", eyes:"open",   mouth:"flat"}
};

function useTag(id, tf){ return '<use href="#' + id + '"' + (tf ? ' transform="' + tf + '"' : '') + '/>'; }
function scaleAt(cx, cy, sx, sy){
  return 'translate(' + cx + ' ' + cy + ') scale(' + sx + ' ' + sy + ') translate(' + (-cx) + ' ' + (-cy) + ')';
}

var MASCOT = {
  names: Object.keys(MDATA),
  moods: MOODS,
  /* набор слоёв для настроения: у персонажа может быть свой */
  mood: function(name, m){
    var D = MDATA[name] || {};
    if(D.moods && D.moods[m]) return D.moods[m];
    if(D.moods && D.moods.idle && !MOODS[m]) return D.moods.idle;
    return MOODS[m] || MOODS.idle;
  },
  /* какое тело показывать для настроения */
  bodyId: function(name, m){
    var D = MDATA[name]; if(!D) return null;
    var set = MASCOT.mood(name, m);
    if(D.art && D.art.body){
      var key = D.art.body[set.body || 'default'] || D.art.body['default'];
      if(key) return name + '-body-' + key;
    }
    return name + '-body';
  },
  part: function(name, layer, state){
    var D = MDATA[name];
    if(!D || !state) return '';
    /* нарисованное состояние важнее выведенного трансформацией */
    if(state.charAt(0) !== '@' && D.art && D.art[layer] && D.art[layer][state])
      return useTag(name + '-' + layer + '-' + D.art[layer][state]);
    var st = state.charAt(0) === '@' ? state.slice(1) : state;
    var refKey = D.art && D.art[layer] ? (D.art[layer]['default'] || D.art[layer]['open'] || D.art[layer]['smile'] || D.art[layer]['neutral']) : null;
    var refId = refKey ? (name + '-' + layer + '-' + refKey) : null;

    if(layer === "eyes"){
      if(!D.eyes) return '';
      var e0 = D.eyes[0], e1 = D.eyes[1] || D.eyes[0];
      var sw = Math.max(3, e0.ry * 0.30);
      var line = function(e, bend){
        return '<path fill="none" stroke="' + D.ink + '" stroke-width="' + sw.toFixed(1) +
          '" stroke-linecap="round" d="M' + (e.cx - e.rx * 0.95).toFixed(1) + ' ' + e.cy +
          ' Q' + e.cx + ' ' + (e.cy + bend).toFixed(1) + ' ' + (e.cx + e.rx * 0.95).toFixed(1) + ' ' + e.cy + '"/>';
      };
      var lid = function(e){
        var y = e.cy - e.ry * 0.58;
        return '<path fill="' + D.skin + '" d="M' + (e.cx - e.rx * 1.3).toFixed(1) + ' ' + y.toFixed(1) +
          ' q' + (e.rx * 1.3).toFixed(1) + ' ' + (-e.ry * 0.5).toFixed(1) + ' ' + (e.rx * 2.6).toFixed(1) + ' 0' +
          ' v' + (-e.ry * 1.5).toFixed(1) + ' h' + (-e.rx * 2.6).toFixed(1) + 'z"/>';
      };
      var mid = (e0.cx + e1.cx) / 2;
      var whole = function(tf){
        if(refId) return useTag(refId, tf);
        return D.eyes.map(function(e, i){ return useTag(name + '-eye' + i, tf); }).join('');
      };
      if(st === "blink")  return line(e0, e0.ry * 0.45) + line(e1, e1.ry * 0.45);
      if(st === "happy")  return line(e0, -e0.ry * 1.5) + line(e1, -e1.ry * 1.5);
      if(st === "wide")   return whole(scaleAt(mid, e0.cy, 1.14, 1.14));
      if(st === "squint") return whole(scaleAt(mid, e0.cy, 1, 0.45));
      if(st === "sad")    return whole('') + D.eyes.map(lid).join('');
      return whole('');
    }
    if(layer === "brows"){
      var tilt = st === "down" ? -9 : st === "worried" ? 11 : 0;
      var lift = st === "up" ? D.lift * 1.6 : st === "worried" ? D.lift * 0.3 : st === "down" ? -D.lift * 0.5 : 0;
      if(refId){
        var mv = (lift ? 'translate(0 ' + (-lift).toFixed(1) + ')' : '');
        return useTag(refId, mv);
      }
      return D.brows.map(function(b, i){
        var side = b.left ? 1 : -1;
        var tf = (lift ? 'translate(0 ' + (-lift).toFixed(1) + ') ' : '') +
                 (tilt ? 'rotate(' + (tilt * side).toFixed(1) + ' ' + b.cx + ' ' + b.cy + ')' : '');
        return useTag(name + '-brow' + i, tf.trim());
      }).join('');
    }
    if(layer === "mouth"){
      var m = D.mouth;
      if(!m) return '';
      var msw = Math.max(3, m.h * 0.30);
      var curve = function(bend){
        return '<path fill="none" stroke="' + D.mouthFill + '" stroke-width="' + msw.toFixed(1) +
          '" stroke-linecap="round" d="M' + (m.cx - m.w * 0.42).toFixed(1) + ' ' + m.cy +
          ' Q' + m.cx + ' ' + (m.cy + bend).toFixed(1) + ' ' + (m.cx + m.w * 0.42).toFixed(1) + ' ' + m.cy + '"/>';
      };
      if(st === "flat")  return curve(0);
      if(st === "frown") return curve(-m.h * 0.55);
      if(st === "o")     return '<ellipse cx="' + m.cx + '" cy="' + m.cy + '" rx="' + (m.w * 0.26).toFixed(1) +
                                '" ry="' + (m.h * 0.5).toFixed(1) + '" fill="' + D.mouthFill + '"/>';
      if(st === "big")   return refId ? useTag(refId, scaleAt(m.cx, m.cy, 1.2, 1.2))
                                      : useTag(name + '-mouth', scaleAt(m.cx, m.cy, 1.2, 1.2));
      return refId ? useTag(refId) : useTag(name + '-mouth');
    }
    return '';
  },
  defs: function(){
    return '<svg id="mascot-defs" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">' +
           '<defs>' + MDEFS + '</defs></svg>';
  },
  render: function(name, opts){
    opts = opts || {};
    var D = MDATA[name];
    if(!D) return '';
    var moodName = typeof opts.mood === "string" ? opts.mood : "idle";
    var m = typeof opts.mood === "string" ? MASCOT.mood(name, opts.mood) : (opts.mood || MOODS.idle);
    var head = opts.frame === "head";
    var vb = D.vb[head ? "head" : "full"];
    /* Портрет обязан обрезаться рамкой: у svg по умолчанию overflow visible,
       и у ростовых персонажей ниже головы дорисовывалось всё туловище. */
    return '<svg class="mascot' + (head ? ' is-head' : '') + (opts.cls ? ' ' + opts.cls : '') + '" viewBox="' + vb +
      '" data-char="' + name + '" data-mood="' + moodName +
      '" role="img" aria-label="' + (opts.label || name) + '">' +
      '<use class="m-body" href="#' + MASCOT.bodyId(name, moodName) + '"/>' +
      '<g class="m-brows">' + MASCOT.part(name, "brows", m.brows) + '</g>' +
      '<g class="m-eyes">'  + MASCOT.part(name, "eyes",  m.eyes)  + '</g>' +
      '<g class="m-mouth">' + MASCOT.part(name, "mouth", m.mouth) + '</g>' +
      (D.hasFront ? useTag(name + '-front') : '') +
    '</svg>';
  }
};

/* =====================================================================
   ДВИЖОК МИМИКИ
   Состояние меняет не картинку целиком, а три слоя лица — так же, как
   стейт-машина в анимационном движке Duolingo подменяет глаза и рот,
   не трогая тело. Плюс холостой цикл моргания и короткие реакции.
   ===================================================================== */
var RIG = (function(){
  var reduced = false;
  try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}

  var live = [];                       /* активные персонажи на экране */

  function faceSet(el, mood){
    var char = el.getAttribute("data-char");
    var m = typeof mood === "string" ? MASCOT.mood(char, mood) : mood;
    var b = el.querySelector(".m-brows"), e = el.querySelector(".m-eyes"), o = el.querySelector(".m-mouth");
    if(b) b.innerHTML = MASCOT.part(char, "brows", m.brows);
    if(e) e.innerHTML = MASCOT.part(char, "eyes",  m.eyes);
    if(o) o.innerHTML = MASCOT.part(char, "mouth", m.mouth);
    /* у некоторых настроений своя поза тела — например, разведённые руки на ликовании */
    if(typeof mood === "string" && MASCOT.bodyId){
      var body = el.querySelector(".m-body");
      var want = MASCOT.bodyId(char, mood);
      if(body && want && body.getAttribute("href") !== "#" + want) body.setAttribute("href", "#" + want);
    }
    el.setAttribute("data-mood", typeof mood === "string" ? mood : "custom");
  }

  /* моргание: пауза 2.4–6 с, иногда двойное — так живее */
  function scheduleBlink(rec){
    clearTimeout(rec.blinkT);
    rec.blinkT = setTimeout(function(){
      if(!document.body.contains(rec.el)) return detach(rec);
      if(rec.busy) return scheduleBlink(rec);
      var base = rec.mood;
      var eyes = rec.el.querySelector(".m-eyes");
      var char = rec.el.getAttribute("data-char");
      if(!eyes) return;
      eyes.innerHTML = MASCOT.part(char, "eyes", "blink");
      var twice = Math.random() < 0.25;
      setTimeout(function(){
        if(!document.body.contains(rec.el)) return detach(rec);
        eyes.innerHTML = MASCOT.part(char, "eyes", MASCOT.mood(char, base).eyes);
        if(twice){
          setTimeout(function(){
            eyes.innerHTML = MASCOT.part(char, "eyes", "blink");
            setTimeout(function(){
              eyes.innerHTML = MASCOT.part(char, "eyes", MASCOT.mood(char, base).eyes);
            }, 110);
          }, 150);
        }
        scheduleBlink(rec);
      }, 120);
    }, 2400 + Math.random()*3600);
  }

  function detach(rec){
    clearTimeout(rec.blinkT); clearTimeout(rec.backT);
    var i = live.indexOf(rec); if(i >= 0) live.splice(i, 1);
  }
  function find(el){ for(var i=0;i<live.length;i++) if(live[i].el === el) return live[i]; return null; }

  function attach(el){
    if(!el || el.__rig) return null;
    el.__rig = 1;
    var rec = {el:el, mood: el.getAttribute("data-mood") || "idle", busy:false, blinkT:0, backT:0};
    live.push(rec);
    if(!reduced) scheduleBlink(rec);
    return rec;
  }

  /* короткая анимация тела: класс снимается сам */
  function pulse(el, cls, ms){
    if(reduced) return;
    el.classList.remove(cls);
    void el.offsetWidth;                 /* перезапуск анимации */
    el.classList.add(cls);
    setTimeout(function(){ el.classList.remove(cls); }, ms);
  }

  var REACT = {
    correct:   {mood:"happy", anim:"is-pop",   hold:1400},
    wrong:     {mood:"sad",   anim:"is-shake", hold:1600},
    celebrate: {mood:"cheer", anim:"is-hop",   hold:2600},
    think:     {mood:"think", anim:"",         hold:1200},
    wow:       {mood:"wow",   anim:"is-pop",   hold:1400}
  };

  return {
    /* привязать все ещё не привязанные фигуры внутри корня */
    scan: function(root){
      /* перерисовка выбрасывает старые узлы — снимаем их таймеры сразу,
         иначе на каждом рендере копится по будильнику на мёртвую фигуру */
      for(var j = live.length - 1; j >= 0; j--){
        if(!document.body || !document.body.contains(live[j].el)) detach(live[j]);
      }
      var list = (root || document).querySelectorAll(".mascot[data-char]");
      for(var i = 0; i < list.length; i++) attach(list[i]);
    },
    stopAll: function(){ for(var i = live.length - 1; i >= 0; i--) detach(live[i]); },
    /* задать постоянное настроение */
    set: function(el, mood){
      var rec = find(el) || attach(el);
      if(!rec) return;
      rec.mood = mood; rec.busy = false;
      clearTimeout(rec.backT);
      faceSet(el, mood);
      if(!reduced) scheduleBlink(rec);
    },
    /* сыграть реакцию и вернуться в покой */
    play: function(el, event){
      if(!el) return;
      var r = REACT[event]; if(!r) return;
      var rec = find(el) || attach(el);
      if(!rec) return;
      rec.busy = true;
      clearTimeout(rec.backT);
      faceSet(el, r.mood);
      if(r.anim) pulse(el, r.anim, r.hold);
      rec.backT = setTimeout(function(){
        rec.busy = false;
        faceSet(el, rec.mood);
      }, r.hold);
    },
    /* реакция для всех фигур на экране — удобно для экрана урока */
    playAll: function(event, root){
      var list = (root || document).querySelectorAll(".mascot[data-char]");
      for(var i = 0; i < list.length; i++) RIG.play(list[i], event);
    },
    reduced: function(){ return reduced; }
  };
})();

</script>

 .split(",").forEach(function(w){ KW[w]=1; });

"ЕСТЬNULL,ВЫРАЗИТЬ,Остатки,Обороты,ОстаткиИОбороты,СрезПоследних,СрезПервых,СУММА,КОЛИЧЕСТВО,МАКСИМУМ,МИНИМУМ,СРЕДНЕЕ,ПОДСТРОКА,ДАТАВРЕМЯ"
 .split(",").forEach(function(w){ FNW[w]=1; });

/* =====================================================================
   ЗВУК
   Синтез через Web Audio, без единого файла: внешние медиа в артефакте
   заблокированы политикой безопасности, а data-URI раздули бы страницу.
   Контекст создаётся только по первому нажатию — до жеста браузер
   всё равно не даст ничего воспроизвести.
   ===================================================================== */
var SFX = (function(){
  var ctx = null, master = null, broken = false;

  function init(){
    if(broken) return null;
    try{
      if(!ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC){ broken = true; return null; }
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 1.7;
        master.connect(ctx.destination);
      }
      if(ctx.state === "suspended") ctx.resume();
      return ctx;
    }catch(e){ broken = true; return null; }
  }

  /* одна нота: частота, скольжение, длительность, тембр, огибающая */
  function note(o){
    var c = init(); if(!c) return;
    var t = c.currentTime + (o.at || 0);
    var dur = o.dur || 0.12;
    var osc = c.createOscillator();
    var g = c.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(o.f, t);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);

    var peak = o.gain == null ? 0.16 : o.gain;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + (o.attack || 0.010));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    var tail = osc;
    if(o.lp){
      var f = c.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.setValueAtTime(o.lp, t);
      if(o.lpTo) f.frequency.exponentialRampToValueAtTime(o.lpTo, t + dur);
      tail.connect(f); tail = f;
    }
    tail.connect(g);
    g.connect(master);
    osc.start(t);
    osc.stop(t + dur + 0.06);
  }

  var on = function(){ return !(typeof S !== "undefined" && S.mute); };

  return {
    /* верный ответ: короткая светлая квинта вверх */
    correct: function(){
      if(!on()) return;

      note({f:1175, dur:0.16, type:"triangle", gain:0.13, at:0.070});

    /* неверный: низкий короткий гудок со съездом вниз, приглушённый */
    wrong: function(){
      if(!on()) return;
      note({f:200, to:126, dur:0.26, type:"sawtooth", gain:0.11, lp:1100, lpTo:420});
      note({f:100, to:70,  dur:0.24, type:"sine",     gain:0.09});
    },
    /* конец урока: восходящее трезвучие */
    finish: function(){
      if(!on()) return;
      [[523,0],[659,0.085],[784,0.17],[1047,0.28]].forEach(function(p){
        note({f:p[0], dur:p[1] === 0.28 ? 0.42 : 0.20, type:"triangle", gain:0.13, at:p[1]});
      });
    },

    fail: function(){

      note({f:330, dur:0.20, type:"triangle", gain:0.12});
      note({f:247, dur:0.34, type:"triangle", gain:0.12, at:0.16});

    heart: function(){

      note({f:520, to:300, dur:0.09, type:"square", gain:0.05, lp:1800});
    },

/* ================= ГЕНЕРАТОР УПРАЖНЕНИЙ =================
   Из 169 карточек, 30 фраз, 20 задач и 12 сборок собирается
   несколько сотен упражнений шести типов. Дистракторы берутся
   из соседних карточек той же группы — поэтому они правдоподобны.  */

function seed(s){ var h = 2166136261; for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return function(){ h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0)/4294967296; }; }
function shuffle(a, rnd){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor((rnd?rnd():Math.random())*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(arr, n, rnd){ return shuffle(arr, rnd).slice(0, n); }
function clip(s, n){
  if(s.length <= n) return s;
  var cut = s.slice(0, n);
  var sp = cut.lastIndexOf(" ");
  if(sp > n * 0.55) cut = cut.slice(0, sp);        /* режем по границе слова, а не посреди */
  return cut.replace(/[\s,.;:—–-]+$/, "") + "…";
}

/* Границы слова: \b в JS не знает кириллицы, поэтому задаём явно. */
var NW = "[^а-яёА-ЯЁa-zA-Z0-9]";
function reWord(w){
  return new RegExp("(^|" + NW + ")(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(" + NW + "|$)", "gi");
}

/* Обрезка, которая не врёт.
   «Клиентское приложение, которое не работает с базой…» — обрывок
   утверждает обратное тому, что написано дальше («…напрямую»).
   Поэтому режем по границе фразы и никогда не заканчиваем на слове,
   которое требует продолжения. */
var DANGLING = ["не","ни","без","только","кроме","вместо","нельзя","а","но","и","или","как","чем","что","чтобы","то","этой","этого","этом","при","для","из","по","с","в","на","к","о","от","до","же"];
function clipClause(s, soft, hard){
  if(s.length <= soft) return s;
  /* Ищем границу фразы в окне. Конец предложения всегда лучше запятой:
     иначе «…плюс код. То, что…» режется после «То» и повисает. */
  var lo = Math.floor(soft * 0.5), hi = Math.min(s.length, hard);
  var sent = -1, comma = -1;
  for(var i = lo; i < hi; i++){
    if(/[.;:!?]/.test(s[i])) sent = i;
    else if(s[i] === "," && i > soft * 0.7) comma = i;
  }
  var best = sent > 0 ? sent : comma;
  var cut;
  if(best > 0 && best < hard){
    cut = s.slice(0, best);
    if(cut.length >= soft * 0.5) return cut.replace(/[\s,;:—–-]+$/, "") + (best < s.length - 1 ? "…" : "");
  }
  /* границы нет — режем по слову и добираем, пока хвост не повиснет */
  cut = s.slice(0, Math.min(hard, s.length));
  var sp = cut.lastIndexOf(" ");
  if(sp > 0) cut = cut.slice(0, sp);
  var guard = 0;
  while(guard++ < 12){
    var tail = cut.replace(/[\s,.;:—–-]+$/, "").split(" ").pop().toLowerCase().replace(/[^а-яёa-z]/g, "");
    if(DANGLING.indexOf(tail) < 0) break;
    var back = cut.replace(/[\s,.;:—–-]+$/, "").lastIndexOf(" ");
    if(back <= 0) break;
    cut = cut.slice(0, back);
  }
  return cut.replace(/[\s,.;:—–-]+$/, "") + "…";
}

/* Прячем сам термин во фразе: иначе вариант «О чём речь?» решается
   чтением, а не пониманием. Возвращает null, если от фразы почти
   ничего не осталось — тогда этот вариант вопроса не годится. */
function maskTerm(text, card){
  if(!text) return null;
  var masked = text;
  var forms = [card.t];
  if(card.tr && card.tr.length > 3 && /^[А-ЯЁA-Z]/.test(card.tr)) forms.push(card.tr);
  forms.forEach(function(w){
    masked = masked.replace(reWord(w), function(m, a, hit, b){ return a + "…" + b; });
  });
  if(masked === text) return text;
  if(masked.replace(/…/g, "").length < text.length * 0.6) return null;
  return masked;
}

/* Дистракторы: сначала из той же группы, потом из любых.
   Карточки-сравнения (nolabel) дистракторами не бывают: их утверждения
   верны сразу про несколько терминов, и вопрос получил бы два верных
   ответа. Вопрос о самой такой карточке задать по-прежнему можно. */
function others(card, pool, n, rnd){
  var same = pool.filter(function(c){ return c !== card && !c.nolabel && c.g === card.g; });
  var rest = pool.filter(function(c){ return c !== card && !c.nolabel && c.g !== card.g; });
  var out = pick(same, n, rnd);
  if(out.length < n) out = out.concat(pick(rest, n - out.length, rnd));
  return out;
}

function exChoose(key, q, code, options, correctIdx, why, hint){
  return {k:key, type:"choose", q:q, code:code||"", o:options, a:correctIdx, w:why, hint:hint||""};
}
/* Готовые банки (QUIZ, PHRASES, CLOZE) хранят верный ответ первым.
   Без перемешивания он всегда оказывался на позиции 0 — задание решалось
   без чтения. Здесь варианты тасуются и индекс верного пересчитывается. */
function exFromBank(key, q, code, texts, correctIdx, why, hint, rnd, notes){
  /* пояснение к варианту едет вместе с ним через перемешивание */
  var opts = shuffle(texts.map(function(t, i){ return {t:t, c: i === correctIdx ? 1 : 0, n: notes ? (notes[i] || "") : ""}; }), rnd);
  var a = 0;
  for(var i = 0; i < opts.length; i++) if(opts[i].c) a = i;
  return {k:key, type:"choose", q:q, code:code||"", o:opts, a:a, w:why, hint:hint||""};
}

/* --- из карточки термина --- */
function genFromCard(card, pool, variant, rnd){
  var d = others(card, pool, 3, rnd);
  /* Карточки-сравнения (nolabel) не являются названиями, поэтому не
     годятся ни как верный ответ, ни как дистрактор там, где выбирают
     термин: иначе у вопроса оказывается два верных ответа. */
  if((variant === 1 || variant === 2) && card.nolabel) variant = 3;
  if(variant === 1 || variant === 2){
    var named = pool.filter(function(c){ return c !== card && !c.nolabel && c.g === card.g; });
    if(named.length < 3) named = pool.filter(function(c){ return c !== card && !c.nolabel; });
    d = pick(named, 3, rnd);
  }
  if(variant === 0){
    var opts = shuffle([{t:clipClause(card.d,110,150), c:1, s:card.t}].concat(d.map(function(x){ return {t:clipClause(x.d,110,150), c:0, s:x.t}; })), rnd);
    return exChoose("c0|"+card.t, "Что такое «" + card.t + "»?", "", opts, opts.findIndex(function(o){return o.c;}), card.live, card.tr);
  }
  if(variant === 1){
    var opts1 = shuffle([{t:card.t, c:1, s:card.t}].concat(d.map(function(x){ return {t:x.t, c:0, s:x.t}; })), rnd);
    return exChoose("c1|"+card.t, "Как это называется?", "", opts1, opts1.findIndex(function(o){return o.c;}), card.t + " — " + card.d, clipClause(card.d, 120, 165));
  }
  if(variant === 2){
    var phrase = maskTerm(card.ex, card);
    if(phrase){
      var opts2 = shuffle([{t:card.t, c:1, s:card.t}].concat(d.map(function(x){ return {t:x.t, c:0, s:x.t}; })), rnd);
      return exChoose("c2|"+card.t, "О чём речь в этой фразе?", "", opts2, opts2.findIndex(function(o){return o.c;}), card.t + " — " + card.d, phrase);
    }
    variant = 3;                       /* фраза без термина не остаётся — берём другой вопрос */
  }
  /* Вариант «на практике» строится на поле fact — коротком проверяемом
     утверждении, верном ровно для этого термина и неверном для соседей.
     Раньше верным ответом было live, то есть авторская реплика о рынке
     и людях; выбрать её среди чужих таких же можно было только по
     памяти, а не по знанию. */
  var withFact = d.filter(function(x){ return x.fact; });
  if(card.fact && withFact.length >= 3){
    var opts3 = shuffle([{t:card.fact, c:1, s:card.t}].concat(withFact.slice(0, 3).map(function(x){ return {t:x.fact, c:0, s:x.t}; })), rnd);
    return exChoose("c3|"+card.t, "Что из этого верно про «" + card.t + "»?", "", opts3,
      opts3.findIndex(function(o){return o.c;}), card.d + (card.live ? " " + card.live : ""), card.tr);
  }
  var optsD = shuffle([{t:clipClause(card.d, 110, 150), c:1, s:card.t}].concat(d.map(function(x){ return {t:clipClause(x.d, 110, 150), c:0, s:x.t}; })), rnd);
  return exChoose("c0|"+card.t, "Что такое «" + card.t + "»?", "", optsD,
    optsD.findIndex(function(o){return o.c;}), card.live, card.tr);
}

/* --- сопоставление пар --- */
function genMatch(cards, rnd){
  var four = cards.slice(0, 4);
  return {k:"m|"+four.map(function(c){return c.t;}).join("|"), type:"match",
    q:"Собери пары: термин и его значение",
    pairs: four.map(function(c){ return {l:c.t, r:clipClause(c.d, 52, 82)}; }),
    w:"Пары: " + four.map(function(c){ return c.t + " — " + clipClause(c.d, 60, 92); }).join(" · ")};
}

/* --- сборка запроса из блоков --- */
function genBuild(b){
  return {k:"b|"+b.task, type:"build", q:b.task, tokens:b.tokens, extra:b.extra||[],
          set:!!b.set, w:b.w};
}

/* --- готовые задачи и фразы --- */
function genQuiz(q, i, rnd){
  return exFromBank("q|"+i, q.q, q.code||"", q.o, q.a, q.w, "", rnd, q.on);
}
function genPhrase(p, i, rnd){
  return exFromBank("p|"+i, "Что имеет в виду собеседник?", "", p.o, p.a, p.w, p.p, rnd, p.on);
}
function genCloze(c, i, rnd){
  return exFromBank("z|"+i, c.q, c.code, c.o, c.a, c.w, "", rnd, c.on);
}
/* вопрос с реального собеседования как задание «расскажи вслух» */
function genIvRecall(q, i){
  return {k:"iv|"+i, type:"recall", q:q.q,
          w: (q.see && q.see.length)
             ? "Спрашивают на реальных интервью. К этому вопросу относятся карточки: " + q.see.join(", ") + "."
             : "Вопрос из живой практики — отвечай своим опытом, готового определения тут нет.",
          meta:q.s};
}
function genInterview(q, i){
  return {k:"i|"+i, type:"recall", q:q.q, w:q.a, meta:q.lvl + " · " + q.g};
}

/* ================= НАРЕЗКА КУРСА =================
   Юнит → уроки по 5 карточек. Последний урок юнита — проверка. */
function buildCourse(){
  var course = [];
  UNITS.forEach(function(u){
    var cards = CARDS.filter(function(c){ return u.groups.indexOf(c.g) >= 0 && c.lvl >= u.lvl[0] && c.lvl <= u.lvl[1]; });
    cards.sort(function(a,b){ return a.lvl - b.lvl; });
    var quizzes = QUIZ.map(function(q,i){ return {q:q, i:i}; }).filter(function(x){ return u.quizG.indexOf(x.q.g) >= 0; });
    var lessons = [];

    if(u.boss){
      ["junior","middle","senior"].forEach(function(lvl, i){
        lessons.push({id:u.id+".L"+i, t:lvl === "junior" ? "Junior" : lvl === "middle" ? "Middle" : "Senior",
                      kind:"boss", lvl:lvl});
      });
    } else if(u.slang){
      /* сленг: все карточки группы режем по 5, фразы распределяем поровну */
      var n = Math.max(1, Math.ceil(cards.length / 5));
      var per = PHRASES.length / n;
      for(var s = 0; s < n; s++){
        lessons.push({id:u.id+".L"+s, t:"Урок "+(s+1),
                      kind:"slang",
                      from:Math.round(s*per), to:Math.round((s+1)*per),
                      cards:cards.slice(s*5, s*5+5)});
      }
      lessons.push({id:u.id+".LX", t:"Проверка", kind:"check", cards:cards, quiz:[], build:false});
    } else {
      for(var i2 = 0; i2 < cards.length; i2 += 5){
        var chunk = cards.slice(i2, i2+5);
        /* хвост короче трёх карточек не делаем отдельным уроком — он скучный */
        if(chunk.length < 3 && lessons.length){
          lessons[lessons.length-1].cards = lessons[lessons.length-1].cards.concat(chunk);
          break;
        }
        lessons.push({id:u.id+".L"+(i2/5), t:"Урок "+(lessons.length+1), kind:"cards", cards:chunk,
                      quiz: quizzes.length ? [quizzes[(i2/5) % quizzes.length]] : []});
      }
      lessons.push({id:u.id+".LX", t:"Проверка", kind:"check", cards:cards, quiz:quizzes, build:!!u.build});
    }
    course.push({u:u, lessons:lessons});
  });
  return course;
}

/* ================= СБОРКА УРОКА =================
   Урок собирается в момент открытия из всей базы знаний, а не из
   фиксированного пула. Состав: новые карточки раздела + повторение
   уже виденного из любых тем + прикладная задача + пары.
   Порядок перемешивается так, чтобы подряд не шло больше двух
   заданий одной темы — смешанная практика даёт худший результат
   в моменте, но заметно лучший перенос (Rohrer & Taylor, 2007).
   ================================================================= */

/* какие карточки ученик уже видел: ключи упражнений вида "c0|Термин" */
function seenTitles(srs){
  var set = {};
  for(var k in srs){ if(srs.hasOwnProperty(k)){ var t = k.split("|")[1]; if(t) set[t] = srs[k]; } }
  return set;
}

/* карточки на повторение: сперва просроченные, потом просто знакомые,
   и по возможности из других тем, чем ядро урока */
function pickReview(exclude, n, rnd, srs, coreGroups){
  var seen = seenTitles(srs), now = Date.now();
  var ex = {}; exclude.forEach(function(c){ ex[c.t] = 1; });
  var due = [], known = [];
  CARDS.forEach(function(c){
    if(ex[c.t]) return;
    var s = seen[c.t];
    if(!s) return;
    (s.d && s.d <= now ? due : known).push(c);
  });
  var other = function(list){ return list.filter(function(c){ return coreGroups.indexOf(c.g) < 0; }); };
  var out = pick(other(due), n, rnd);
  if(out.length < n) out = out.concat(pick(due.filter(function(c){ return out.indexOf(c) < 0; }), n - out.length, rnd));
  if(out.length < n) out = out.concat(pick(other(known), n - out.length, rnd));
  if(out.length < n) out = out.concat(pick(known.filter(function(c){ return out.indexOf(c) < 0; }), n - out.length, rnd));
  /* У новичка истории ещё нет. Чтобы урок не был однотемным, добираем
     карточки из других тем — они пойдут как первое знакомство. */
  if(out.length < n){
    var fresh = CARDS.filter(function(c){
      return !ex[c.t] && out.indexOf(c) < 0 && coreGroups.indexOf(c.g) < 0 && c.lvl <= 2;
    });
    out = out.concat(pick(fresh, n - out.length, rnd));
  }
  return out;
}

/* вариант задания зависит от того, впервые ли ученик видит термин:
   первое знакомство — узнавание, дальше — воспроизведение и применение */
function variantFor(card, srs, rnd){
  var s = seenTitles(srs)[card.t];
  if(!s) return 0;                       // впервые: определение по термину
  var box = s.b || 0;
  var pool = box >= 3 ? [2, 3, 1] : [1, 2, 3];
  return pool[Math.floor(rnd() * pool.length)];
}

/* перемешивание с ограничением: не больше двух подряд из одной темы */
function interleave(items, rnd){
  /* Раскладываем по темам и всегда берём из самой многочисленной,
     отличной от предыдущей. Жадный проход по списку оставлял хвост
     из заданий одной темы и давал тройки подряд. */
  var buckets = {}, order = [];
  shuffle(items, rnd).forEach(function(it){
    var g = it.g || "?";
    if(!buckets[g]){ buckets[g] = []; order.push(g); }
    buckets[g].push(it);
  });
  var out = [], last = null;
  while(true){
    var keys = order.filter(function(k){ return buckets[k].length; });
    if(!keys.length) break;
    keys.sort(function(a, b){ return buckets[b].length - buckets[a].length; });
    var key = null;
    for(var i = 0; i < keys.length; i++) if(keys[i] !== last){ key = keys[i]; break; }
    if(!key) key = keys[0];              /* остались задания только одной темы */
    last = key;
    out.push(buckets[key].shift());
  }
  return out;
}

/* прикладные задачи раздела, без повторов внутри урока */
function appliedFor(unit, lesson, rnd, used){
  var out = [];
  var qs = QUIZ.map(function(q, i){ return {q:q, i:i}; })
               .filter(function(x){ return unit.quizG.indexOf(x.q.g) >= 0 && !used["q|" + x.i]; });
  if(qs.length){ var q = pick(qs, 1, rnd)[0]; out.push(genQuiz(q.q, q.i, rnd)); used["q|" + q.i] = 1; }
  /* сборка кода и пропуск в коде — отдельные типы обработки материала,
     поэтому подмешиваются во все уроки, а не только в проверочные */
  var topics = unit.quizG.concat(unit.groups);
  var bs = BUILD.filter(function(b){ return topics.indexOf(b.g) >= 0; });
  var cz = CLOZE.map(function(c, i){ return {c:c, i:i}; })
                .filter(function(x){ return topics.indexOf(x.c.g) >= 0 && !used["z|" + x.i]; });
  if(!bs.length && !cz.length){                       /* у раздела нет своих — берём любые */
    bs = BUILD; cz = CLOZE.map(function(c, i){ return {c:c, i:i}; }).filter(function(x){ return !used["z|" + x.i]; });
  }
  if(bs.length && (rnd() < 0.5 || !cz.length)) out.push(genBuild(pick(bs, 1, rnd)[0]));
  else if(cz.length){ var z = pick(cz, 1, rnd)[0]; out.push(genCloze(CLOZE[z.i], z.i, rnd)); used["z|" + z.i] = 1; }
  return out;
}

function tag(ex, g){ ex.g = g; return ex; }

function makeLesson(unit, lesson, attempt, ctx){
  var rnd = seed(lesson.id + "#" + attempt);
  ctx = ctx || {};
  var srs = ctx.srs || {};
  var used = {};
  var ex = [];

  if(lesson.kind === "boss"){
    var qs = INTERVIEW.map(function(q, i){ return {q:q, i:i}; }).filter(function(x){ return x.q.lvl === lesson.lvl; });
    pick(qs, Math.min(8, qs.length), rnd).forEach(function(x){ ex.push(tag(genInterview(x.q, x.i), x.q.g)); });
    return interleave(ex, rnd);
  }

  var core = lesson.kind === "check" ? pick(lesson.cards, Math.min(6, lesson.cards.length), rnd)
                                     : (lesson.cards || []);
  var coreGroups = [];
  core.forEach(function(c){ if(coreGroups.indexOf(c.g) < 0) coreGroups.push(c.g); });

  /* ядро: по одному заданию на карточку, вариант — по степени знакомства */
  core.forEach(function(c){ ex.push(tag(genFromCard(c, CARDS, variantFor(c, srs, rnd), rnd), c.g)); });

  /* фразы сленга — свой тип задания */
  if(lesson.kind === "slang"){
    for(var i = lesson.from; i < lesson.to; i++) ex.push(tag(genPhrase(PHRASES[i], i, rnd), "сленг"));
  }

  /* Сколько нужно повторения, чтобы разбавить самую массивную тему урока:
     чтобы N заданий одной темы не шли подряд, нужно хотя бы N-1 чужих. */
  var counts = {}, domin = 0;
  ex.forEach(function(x){ counts[x.g] = (counts[x.g] || 0) + 1; if(counts[x.g] > domin) domin = counts[x.g]; });
  var otherN = ex.length - domin;
  var reviewN = Math.max(lesson.kind === "check" ? 4 : 3,
                         Math.min(7, domin - 1 - otherN));
  var review = pickReview(core, reviewN, rnd, srs, coreGroups);
  review.forEach(function(c){ ex.push(tag(genFromCard(c, CARDS, variantFor(c, srs, rnd), rnd), c.g)); });

  /* прикладное */
  appliedFor(unit, lesson, rnd, used).forEach(function(x){ ex.push(tag(x, unit.quizG[0] || coreGroups[0])); });
  if(lesson.kind === "check"){
    appliedFor(unit, lesson, rnd, used).forEach(function(x){ ex.push(tag(x, unit.quizG[0] || coreGroups[0])); });
  }

  /* один вопрос с реального собеседования — в проверочных уроках */
  if(lesson.kind === "check" && typeof IVBANK !== "undefined"){
    var topics = unit.quizG.concat(unit.groups);
    var ivs = IVBANK.map(function(q, i){ return {q:q, i:i}; })
                    .filter(function(x){ return topics.indexOf(x.q.g) >= 0; });
    if(ivs.length){ var iv = pick(ivs, 1, rnd)[0]; ex.push(tag(genIvRecall(iv.q, iv.i), iv.q.g)); }
  }

  /* пары: намеренно смешиваем ядро с повторением, чтобы столкнуть темы */
  var pairPool = core.concat(review);
  if(pairPool.length >= 4) ex.push(tag(genMatch(pick(pairPool, 4, rnd), rnd), "пары"));

  return interleave(ex, rnd);
}

/* ===================== СОСТОЯНИЕ ===================== */
var KEY = "odinesnik.v2";
var S = {
  xp:0, byDay:{}, day:"", streak:0, goal:30,
  hearts:5, heartAt:0, noHearts:false,
  crowns:{}, mistakes:[], srs:{}, road:{}, seenGreet:{}, runs:{}
};
try{ var raw = localStorage.getItem(KEY); if(raw){ var p = JSON.parse(raw); for(var k in p) if(p.hasOwnProperty(k)) S[k] = p[k]; } }catch(e){}
/* перенос отметок дорожной карты из первой версии */
try{
  if(!Object.keys(S.road).length){
    var old = localStorage.getItem("odinesnik.v1");
    if(old){ var o = JSON.parse(old); if(o && o.road) S.road = o.road; }
  }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

var TODAY = new Date().toISOString().slice(0,10);
var YESTERDAY = new Date(Date.now()-864e5).toISOString().slice(0,10);
/* Серия держится на факте занятия. Duolingo меняла именно это правило:
   продление любым уроком, а не выполнением дневной цели, дало заметный рост удержания. */
(function(){
  if(S.day && S.day !== TODAY && S.day !== YESTERDAY) S.streak = 0;  /* пропуск дня — серия сгорела */
  save();
})();
function markActive(){
  if(S.day === TODAY) return;
  S.streak = (S.day === YESTERDAY) ? (S.streak||0)+1 : 1;
  S.day = TODAY; save();
}
function todayXP(){ return S.byDay[TODAY] || 0; }
function addXP(n){ S.xp = (S.xp||0)+n; S.byDay[TODAY] = todayXP()+n; save(); }

/* сердца восстанавливаются по одному раз в 20 минут */
var HEART_MS = 20*60*1000;
function hearts(){
  if(S.noHearts) return 5;
  if(S.hearts >= 5) return 5;
  var gained = Math.floor((Date.now() - (S.heartAt||0)) / HEART_MS);
  if(gained > 0){
    S.hearts = Math.min(5, S.hearts + gained);
    S.heartAt = S.hearts >= 5 ? 0 : Date.now();
    save();
  }
  return S.hearts;
}
function loseHeart(){
  if(S.noHearts) return 5;
  if(S.hearts >= 5) S.heartAt = Date.now();
  S.hearts = Math.max(0, S.hearts-1); save(); return S.hearts;
}
function refillHearts(){ S.hearts = 5; S.heartAt = 0; save(); }
function heartTimer(){
  if(S.noHearts || S.hearts >= 5) return "";
  var left = HEART_MS - ((Date.now() - (S.heartAt||Date.now())) % HEART_MS);
  var m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
  return m + ":" + (s<10?"0":"") + s;
}

/* ===================== КУРС И ЗАМКИ ===================== */
var COURSE = buildCourse();
var FLAT = [];
COURSE.forEach(function(sec){ sec.lessons.forEach(function(l){ FLAT.push({sec:sec, l:l}); }); });

function crowns(id){ return S.crowns[id] || 0; }
function unlocked(idx){
  if(idx === 0) return true;
  return crowns(FLAT[idx-1].l.id) > 0;
}
function currentIdx(){
  for(var i = 0; i < FLAT.length; i++) if(crowns(FLAT[i].l.id) === 0) return i;
  return FLAT.length-1;
}
function unitProgress(sec){
  var done = 0;
  sec.lessons.forEach(function(l){ if(crowns(l.id) > 0) done++; });
  return {done:done, total:sec.lessons.length};
}
function totalCrowns(){ var n = 0; FLAT.forEach(function(f){ n += crowns(f.l.id); }); return n; }

/* ===================== СЕССИЯ УРОКА ===================== */
var LS = null;

function startLesson(idx){
  var f = FLAT[idx];
  if(hearts() === 0 && !S.noHearts){ screen = "nohearts"; render(); return; }
  /* seed переставал меняться после третьей звезды — урок повторялся дословно.
     Теперь у каждого запуска свой номер, он же уходит в seed. */
  if(!S.runs) S.runs = {};
  S.runs[f.l.id] = (S.runs[f.l.id] || 0) + 1;
  var attempt = crowns(f.l.id) + "r" + S.runs[f.l.id];
  LS = {
    idx: idx, sec: f.sec, lesson: f.l,
    queue: makeLesson(f.sec.u, f.l, attempt, {srs: S.srs, mistakes: S.mistakes}),
    done: 0, total: 0, wrong: 0, combo: 0, bestCombo: 0,
    pick: null, checked: false, correct: false,
    matched: {}, matchPick: null, built: [], startedAt: Date.now()
  };
  LS.total = LS.queue.length;
  screen = "lesson"; render();
}
function currentEx(){ return LS && LS.queue.length ? LS.queue[0] : null; }

function checkAnswer(){
  var e = currentEx(); if(!e || LS.checked) return;
  var ok = false;
  if(e.type === "choose") ok = LS.pick !== null && e.o[LS.pick] && !!e.o[LS.pick].c;
  else if(e.type === "build"){
    var sortJoin = function(a){ return a.slice().sort().join(""); };
    var sameSet = sortJoin(LS.built) === sortJoin(e.tokens);
    ok = e.set ? sameSet : LS.built.join(" ") === e.tokens.join(" ");
    /* подсказка по существу: состав верный, но порядок другой */
    LS.buildHint = (!ok && sameSet) ? "Блоки выбраны верно, но порядок другой." :
                   (!ok && LS.built.length !== e.tokens.length) ? "Блоков должно быть " + e.tokens.length + "." : "";
  }
  else if(e.type === "match") ok = Object.keys(LS.matched).length === e.pairs.length*2;
  else if(e.type === "recall") ok = LS.pick === 1;

  LS.checked = true; LS.correct = ok;
  if(ok){
    LS.combo++; LS.bestCombo = Math.max(LS.bestCombo, LS.combo);
    if(LS.combo > 0 && LS.combo % 5 === 0 && !S.noHearts && S.hearts < 5){
      S.hearts++; LS.gainedHeart = true; save();
    }
    /* Ответ, подсмотренный в разборе, знанием не считается: интервал
       повторения не растёт и карточка остаётся в разборе ошибок.
       Иначе можно пройти урок на сто процентов, ничего не выучив. */
    if(e.type !== "recall" && !LS.peeked){
      var s = S.srs[e.k] || {b:0};
      s.b = Math.min(5, (s.b||0)+1); s.d = Date.now() + [0,1,3,8,21,45][s.b]*864e5;
      S.srs[e.k] = s;
      var mi = S.mistakes.indexOf(e.k);
      if(mi >= 0) S.mistakes.splice(mi, 1);
    }
  } else {
    LS.combo = 0; LS.wrong++;
    if(e.type !== "recall"){
      var repeat = LS.seen && LS.seen[e.k];
      if(S.mistakes.indexOf(e.k) < 0) S.mistakes.unshift(e.k);
      S.mistakes = S.mistakes.slice(0, 60);
      S.srs[e.k] = {b:0, d:Date.now()};
      if(!repeat){ loseHeart(); SFX.heart(); }   /* разбор ошибки внутри урока — бесплатно */
    }
  }
  if(!LS.seen) LS.seen = {};
  LS.seen[e.k] = 1;
  save(); render();
  SFX[ok ? "correct" : "wrong"]();
  RIG.playAll(ok ? "correct" : "wrong", document.getElementById("lesson"));
}

function nextEx(){
  var e = LS.queue.shift();
  /* Ошибку прогоняем ещё раз, но не больше двух возвратов на задание:
     иначе упражнение, которое не даётся, крутится в уроке бесконечно. */
  if(!LS.requeued) LS.requeued = {};
  var back = LS.requeued[e.k] || 0;
  if(!LS.correct && e.type !== "recall" && back < 2){ LS.requeued[e.k] = back + 1; LS.queue.push(e); }
  else LS.done++;
  LS.pick = null; LS.checked = false; LS.correct = false; LS.peeked = false;
  LS.matched = {}; LS.matchPick = null; LS.built = []; LS.buildHint = "";
  if(!S.noHearts && hearts() === 0){ SFX.fail(); screen = "failed"; render(); return; }
  if(!LS.queue.length){ finishLesson(); return; }
  render();
}

function finishLesson(){
  var id = LS.lesson.id;
  if(LS.lesson.kind === "mistakes"){
    refillHearts();                       /* разбор ошибок возвращает жизни */
  } else {
    S.crowns[id] = Math.min(3, crowns(id) + 1);
  }
  markActive();
  var base = (LS.lesson.kind === "check" || LS.lesson.kind === "boss") ? 30 : 20;
  LS.perfect = LS.wrong === 0;
  LS.comboBonus = Math.min(5, Math.floor(LS.bestCombo / 2));   /* комбо-бонус, потолок +5 */
  LS.earned = base + LS.comboBonus + (LS.perfect ? 5 : 0);
  addXP(LS.earned);
  save();
  SFX.finish();
  screen = "done"; render();
}

/* ===================== РАЗБОР ОШИБОК ===================== */
function mistakeLesson(){
  var pool = [];
  COURSE.forEach(function(sec){ sec.lessons.forEach(function(l){
    if(l.kind === "boss") return;
    for(var a = 0; a < 2; a++){
      makeLesson(sec.u, l, a, {srs: S.srs}).forEach(function(e){ if(S.mistakes.indexOf(e.k) >= 0) pool.push(e); });
    }
  }); });
  var seen = {}, out = [];
  pool.forEach(function(e){ if(!seen[e.k]){ seen[e.k] = 1; out.push(e); } });
  return out.slice(0, 12);
}
function startMistakes(){
  var ex = mistakeLesson();
  if(!ex.length) return;
  LS = {idx:-1, sec:null, lesson:{id:"mistakes", t:"Разбор ошибок", kind:"mistakes"},
        queue:ex, done:0, total:ex.length, wrong:0, combo:0, bestCombo:0,
        pick:null, checked:false, correct:false, matched:{}, matchPick:null, built:[], startedAt:Date.now()};
  screen = "lesson"; render();
}

/* =====================================================================
   МОДУЛЬ «СОБЕСЕДОВАНИЕ»
   Симуляция интервью по банку реальных вопросов: стадия, пул вопросов
   вперемешку по темам, самооценка после каждого ответа и разбор в конце
   с указанием, какие карточки повторить.
   ===================================================================== */

var IV_STAGES = [
  {id:"Скрининг",    t:"Скрининг",     sub:"Разговор с рекрутером: опыт, ожидания, формальности", n:8},
  {id:"Техскрининг", t:"Техскрининг",  sub:"Первый технический фильтр — быстрые вопросы по верхам", n:10},
  {id:"Техничка",    t:"Техничка",     sub:"Полноценное техническое интервью с разработчиком", n:14}
];
var IV_MARKS = [
  {id:"solid", t:"Ответил уверенно",  c:"ok",   v:2},
  {id:"shaky", t:"Плавал",            c:"",     v:1},
  {id:"none",  t:"Не знаю",           c:"no",   v:0}
];

var IVS = null;   /* текущая сессия */

function ivPool(stage){
  return IVBANK.filter(function(q){ return q.s === stage; });
}

/* вопросы берём вперемешку по темам, чтобы собес не шёл блоками */
function ivPick(stage, n, rnd){
  var pool = ivPool(stage);
  if(pool.length < n) pool = IVBANK.slice();
  var byTopic = {}, order = [];
  shuffle(pool, rnd).forEach(function(q){
    if(!byTopic[q.g]){ byTopic[q.g] = []; order.push(q.g); }
    byTopic[q.g].push(q);
  });
  order = shuffle(order, rnd);
  var out = [], guard = 0;
  while(out.length < n && guard++ < n * 20){
    var moved = false;
    for(var i = 0; i < order.length && out.length < n; i++){
      var b = byTopic[order[i]];
      if(b && b.length){ out.push(b.shift()); moved = true; }
    }
    if(!moved) break;
  }
  return out;
}

function ivStart(stageId){
  var st = IV_STAGES.filter(function(s){ return s.id === stageId; })[0] || IV_STAGES[0];
  var rnd = seed(stageId + "#" + Date.now());
  IVS = {
    stage: st, list: ivPick(st.id, st.n, rnd), i: 0,
    shown: false, marks: [], startedAt: Date.now()
  };
  screen = "iv"; render();
}

function ivCurrent(){ return IVS && IVS.list[IVS.i]; }

function ivRate(markId){
  var q = ivCurrent(); if(!q) return;
  var m = IV_MARKS.filter(function(x){ return x.id === markId; })[0];
  IVS.marks.push({q:q, m:m});
  SFX[m.v === 2 ? "correct" : m.v === 1 ? "heart" : "wrong"]();
  /* то, что не далось, отправляем в разбор ошибок через связанные карточки */
  if(m.v < 2 && q.see){
    q.see.forEach(function(t){
      var key = "c0|" + t;
      if(S.mistakes.indexOf(key) < 0) S.mistakes.unshift(key);
    });
    S.mistakes = S.mistakes.slice(0, 60);
  }
  IVS.i++; IVS.shown = false;
  if(IVS.i >= IVS.list.length) ivFinish(); else { save(); render(); }
}

function ivFinish(){
  var solid = IVS.marks.filter(function(x){ return x.m.v === 2; }).length;
  IVS.score = Math.round(IVS.marks.reduce(function(a, x){ return a + x.m.v; }, 0) / (IVS.marks.length * 2) * 100);
  IVS.solid = solid;
  /* сводка по темам */
  var t = {};
  IVS.marks.forEach(function(x){
    var g = x.q.g;
    if(!t[g]) t[g] = {n:0, v:0};
    t[g].n++; t[g].v += x.m.v;
  });
  IVS.byTopic = Object.keys(t).map(function(g){
    return {g:g, n:t[g].n, pct: Math.round(t[g].v / (t[g].n * 2) * 100)};
  }).sort(function(a, b){ return a.pct - b.pct; });

  if(!S.iv) S.iv = {runs:0, best:0, asked:0};
  S.iv.runs++; S.iv.asked += IVS.marks.length;
  if(IVS.score > (S.iv.best || 0)) S.iv.best = IVS.score;
  addXP(10 + Math.round(IVS.score / 10));
  markActive();
  save();
  SFX[IVS.score >= 55 ? "finish" : "fail"]();
  screen = "ivdone"; render();
}

var IV_TOPIC_NAME = {
  "запросы":"Запросы и СКД", "мета":"Метаданные", "язык":"Язык и формы",
  "нагрузка":"Блокировки и нагрузка", "типовые":"Типовые и БСП",
  "интеграции":"Интеграции", "инфра":"Инструменты и СУБД", "учёт":"Учёт",
  "опыт":"Опыт и мотивация", "общее":"Разное"
};
var ivTopic = function(g){ return IV_TOPIC_NAME[g] || g; };

/* =====================================================================
   МАТЕРИАЛЫ РАЗДЕЛА («книжечка»)
   На каждый раздел пути — своя страница разбора: простая аналогия,
   интерактивная схема, пояснения и проверочный вопрос.

   Схемы описаны данными, а не размеченным SVG: узлы, стрелки и текст
   к каждому узлу. Так их можно править, не трогая разметку, и так они
   гарантированно совпадают с тем, что рассказано рядом.
   ===================================================================== */

var bookUnit = null;      /* id раздела, чьи материалы открыты */
var bookNode = null;      /* выбранный узел схемы */

/* ---------- отрисовка схемы ---------- */
function bookDiagram(d, sel, pre){
  pre = pre || "";
  var mid = "ah" + pre.replace(/[^0-9]/g, "");   /* свой маркер на схему: id должны быть уникальны */
  if(!d) return "";
  var pad = 10;
  var svg = '<svg class="dia" viewBox="0 0 ' + d.w + ' ' + d.h + '" role="img" ' +
    'aria-label="' + esc(d.alt || "Схема") + '">';

  /* стрелки рисуем первыми, чтобы они уходили под блоки */
  svg += '<defs><marker id="' + mid + '" viewBox="0 0 10 10" refX="9" refY="5" ' +
    'markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>';

  var at = {};
  d.nodes.forEach(function(n){ at[n.id] = n; });

  (d.links || []).forEach(function(l, i){
    var a = at[l.a], b = at[l.b];
    if(!a || !b) return;
    var ax, ay, bx, by;
    var horiz = Math.abs((a.x + a.w / 2) - (b.x + b.w / 2)) > Math.abs((a.y + a.h / 2) - (b.y + b.h / 2));
    if(horiz){
      var left = a.x < b.x;
      ax = left ? a.x + a.w : a.x;      ay = a.y + a.h / 2;
      bx = left ? b.x : b.x + b.w;      by = b.y + b.h / 2;
    } else {
      var up = a.y < b.y;
      ax = a.x + a.w / 2;               ay = up ? a.y + a.h : a.y;
      bx = b.x + b.w / 2;               by = up ? b.y : b.y + b.h;
    }
    if(l.dy){ ay += l.dy; by += l.dy; }
    var mx = (ax + bx) / 2, my = (ay + by) / 2;
    var cls = "dia-link" + (l.back ? " back" : "");
    svg += '<line class="' + cls + '" x1="' + ax + '" y1="' + ay + '" x2="' + bx + '" y2="' + by +
           '" marker-end="url(#' + mid + ')"/>';
    if(l.t){
      svg += '<text class="dia-lt" x="' + mx + '" y="' + (my + (horiz ? -7 : 0)) + '" ' +
             'text-anchor="middle">' + esc(l.t) + '</text>';
    }
  });

  d.nodes.forEach(function(n){
    var on = sel === n.id;
    svg += '<g class="dia-node' + (on ? " on" : "") + ' k-' + (n.c || "base") + '" ' +
      'tabindex="0" role="button" data-dianode="' + esc(pre + n.id) + '" ' +
      'aria-pressed="' + (on ? "true" : "false") + '">' +
      '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="12"/>' +
      '<text class="dia-t" x="' + (n.x + n.w / 2) + '" y="' + (n.y + (n.s ? n.h / 2 - 4 : n.h / 2 + 5)) + '" ' +
      'text-anchor="middle">' + esc(n.t) + '</text>';
    if(n.s) svg += '<text class="dia-s" x="' + (n.x + n.w / 2) + '" y="' + (n.y + n.h / 2 + 14) + '" ' +
      'text-anchor="middle">' + esc(n.s) + '</text>';
    svg += '</g>';
  });
  svg += '</svg>';
  return svg;
}

/* ---------- страница материалов ---------- */
function vBook(){

  /* схема */

               '<p>' + d.say[sel] + '</p>'
             : '<p class="muted">Пока ничего не выбрано.</p>') +
