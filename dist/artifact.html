/* =====================================================================
   ДВИЖОК МИМИКИ
   Состояние меняет не картинку целиком, а три слоя лица — так же, как
   стейт-машина в анимационном движке Duolingo подменяет глаза и рот,
   не трогая тело. Плюс холостой цикл моргания и короткие реакции.
   ===================================================================== */
var RIG = (function(){
  var reduced = false;
  try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}

  var live = [];                       /* активные персонажи на экране */

  function faceSet(el, mood){
    var char = el.getAttribute("data-char");
    var m = typeof mood === "string" ? MASCOT.mood(char, mood) : mood;
    var b = el.querySelector(".m-brows"), e = el.querySelector(".m-eyes"), o = el.querySelector(".m-mouth");
    if(b) b.innerHTML = MASCOT.part(char, "brows", m.brows);
    if(e) e.innerHTML = MASCOT.part(char, "eyes",  m.eyes);
    if(o) o.innerHTML = MASCOT.part(char, "mouth", m.mouth);
    /* у некоторых настроений своя поза тела — например, разведённые руки на ликовании */
    if(typeof mood === "string" && MASCOT.bodyId){
      var body = el.querySelector(".m-body");
      var want = MASCOT.bodyId(char, mood);
      if(body && want && body.getAttribute("href") !== "#" + want) body.setAttribute("href", "#" + want);
    }
    el.setAttribute("data-mood", typeof mood === "string" ? mood : "custom");
  }

  /* моргание: пауза 2.4–6 с, иногда двойное — так живее */
  function scheduleBlink(rec){
    clearTimeout(rec.blinkT);
    rec.blinkT = setTimeout(function(){
      if(!document.body.contains(rec.el)) return detach(rec);
      if(rec.busy) return scheduleBlink(rec);
      var base = rec.mood;
      var eyes = rec.el.querySelector(".m-eyes");
      var char = rec.el.getAttribute("data-char");
      if(!eyes) return;
      eyes.innerHTML = MASCOT.part(char, "eyes", "blink");
      var twice = Math.random() < 0.25;
      setTimeout(function(){
        if(!document.body.contains(rec.el)) return detach(rec);
        eyes.innerHTML = MASCOT.part(char, "eyes", MASCOT.mood(char, base).eyes);
        if(twice){
          setTimeout(function(){
            eyes.innerHTML = MASCOT.part(char, "eyes", "blink");
            setTimeout(function(){
              eyes.innerHTML = MASCOT.part(char, "eyes", MASCOT.mood(char, base).eyes);
            }, 110);
          }, 150);
        }
        scheduleBlink(rec);
      }, 120);
    }, 2400 + Math.random()*3600);
  }

  function detach(rec){
    clearTimeout(rec.blinkT); clearTimeout(rec.backT);
    var i = live.indexOf(rec); if(i >= 0) live.splice(i, 1);
  }
  function find(el){ for(var i=0;i<live.length;i++) if(live[i].el === el) return live[i]; return null; }

  function attach(el){
    if(!el || el.__rig) return null;
    el.__rig = 1;
    var rec = {el:el, mood: el.getAttribute("data-mood") || "idle", busy:false, blinkT:0, backT:0};
    live.push(rec);
    if(!reduced) scheduleBlink(rec);
    return rec;
  }

  /* короткая анимация тела: класс снимается сам */
  function pulse(el, cls, ms){
    if(reduced) return;
    el.classList.remove(cls);
    void el.offsetWidth;                 /* перезапуск анимации */
    el.classList.add(cls);
    setTimeout(function(){ el.classList.remove(cls); }, ms);
  }

  var REACT = {
    correct:   {mood:"happy", anim:"is-pop",   hold:1400},
    wrong:     {mood:"sad",   anim:"is-shake", hold:1600},
    celebrate: {mood:"cheer", anim:"is-hop",   hold:2600},
    think:     {mood:"think", anim:"",         hold:1200},
    wow:       {mood:"wow",   anim:"is-pop",   hold:1400}
  };

  return {
    /* привязать все ещё не привязанные фигуры внутри корня */
    scan: function(root){
      /* перерисовка выбрасывает старые узлы — снимаем их таймеры сразу,
         иначе на каждом рендере копится по будильнику на мёртвую фигуру */
      for(var j = live.length - 1; j >= 0; j--){
        if(!document.body || !document.body.contains(live[j].el)) detach(live[j]);
      }
      var list = (root || document).querySelectorAll(".mascot[data-char]");
      for(var i = 0; i < list.length; i++) attach(list[i]);
    },
    stopAll: function(){ for(var i = live.length - 1; i >= 0; i--) detach(live[i]); },
    /* задать постоянное настроение */
    set: function(el, mood){
      var rec = find(el) || attach(el);
      if(!rec) return;
      rec.mood = mood; rec.busy = false;
      clearTimeout(rec.backT);
      faceSet(el, mood);
      if(!reduced) scheduleBlink(rec);
    },
    /* сыграть реакцию и вернуться в покой */
    play: function(el, event){
      if(!el) return;
      var r = REACT[event]; if(!r) return;
      var rec = find(el) || attach(el);
      if(!rec) return;
      rec.busy = true;
      clearTimeout(rec.backT);
      faceSet(el, r.mood);
      if(r.anim) pulse(el, r.anim, r.hold);
      rec.backT = setTimeout(function(){
        rec.busy = false;
        faceSet(el, rec.mood);
      }, r.hold);
    },
    /* реакция для всех фигур на экране — удобно для экрана урока */
    playAll: function(event, root){
      var list = (root || document).querySelectorAll(".mascot[data-char]");
      for(var i = 0; i < list.length; i++) RIG.play(list[i], event);
    },
    reduced: function(){ return reduced; }
  };
})();

</script>

function hl(code){

  function(mm, cm, str, amp, id){

/* ================= ГЕНЕРАТОР УПРАЖНЕНИЙ =================
   Из 169 карточек, 30 фраз, 20 задач и 12 сборок собирается
   несколько сотен упражнений шести типов. Дистракторы берутся
   из соседних карточек той же группы — поэтому они правдоподобны.  */

function seed(s){ var h = 2166136261; for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return function(){ h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0)/4294967296; }; }
function shuffle(a, rnd){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor((rnd?rnd():Math.random())*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(arr, n, rnd){ return shuffle(arr, rnd).slice(0, n); }
function clip(s, n){ return s.length > n ? s.slice(0, n).replace(/[\s,.;:—-]+$/,"") + "…" : s; }

/* дистракторы: сначала из той же группы, потом из любых */
function others(card, pool, n, rnd){
  var same = pool.filter(function(c){ return c !== card && c.g === card.g; });
  var rest = pool.filter(function(c){ return c !== card && c.g !== card.g; });
  var out = pick(same, n, rnd);
  if(out.length < n) out = out.concat(pick(rest, n - out.length, rnd));
  return out;
}

function exChoose(key, q, code, options, correctIdx, why, hint){
  return {k:key, type:"choose", q:q, code:code||"", o:options, a:correctIdx, w:why, hint:hint||""};
}
/* Готовые банки (QUIZ, PHRASES, CLOZE) хранят верный ответ первым.
   Без перемешивания он всегда оказывался на позиции 0 — задание решалось
   без чтения. Здесь варианты тасуются и индекс верного пересчитывается. */
function exFromBank(key, q, code, texts, correctIdx, why, hint, rnd){
  var opts = shuffle(texts.map(function(t, i){ return {t:t, c: i === correctIdx ? 1 : 0}; }), rnd);
  var a = 0;
  for(var i = 0; i < opts.length; i++) if(opts[i].c) a = i;
  return {k:key, type:"choose", q:q, code:code||"", o:opts, a:a, w:why, hint:hint||""};
}

/* --- из карточки термина --- */
function genFromCard(card, pool, variant, rnd){
  var d = others(card, pool, 3, rnd);
  if(variant === 0){
    var opts = shuffle([{t:clip(card.d,150), c:1}].concat(d.map(function(x){ return {t:clip(x.d,150), c:0}; })), rnd);
    return exChoose("c0|"+card.t, "Что такое «" + card.t + "»?", "", opts, opts.findIndex(function(o){return o.c;}), card.live, card.tr);
  }
  if(variant === 1){
    var opts1 = shuffle([{t:card.t, c:1}].concat(d.map(function(x){ return {t:x.t, c:0}; })), rnd);
    return exChoose("c1|"+card.t, "Как это называется?", "", opts1, opts1.findIndex(function(o){return o.c;}), card.t + " — " + card.d, clip(card.d, 160));
  }
  if(variant === 2){
    var opts2 = shuffle([{t:card.t, c:1}].concat(d.map(function(x){ return {t:x.t, c:0}; })), rnd);
    return exChoose("c2|"+card.t, "О чём речь в этой фразе?", "", opts2, opts2.findIndex(function(o){return o.c;}), card.live, card.ex);
  }
  var opts3 = shuffle([{t:clip(card.live,150), c:1}].concat(d.map(function(x){ return {t:clip(x.live,150), c:0}; })), rnd);
  return exChoose("c3|"+card.t, "«" + card.t + "» — что это значит на практике?", "", opts3, opts3.findIndex(function(o){return o.c;}), card.d + " " + card.ex, card.tr);
}

/* --- сопоставление пар --- */
function genMatch(cards, rnd){
  var four = cards.slice(0, 4);
  return {k:"m|"+four.map(function(c){return c.t;}).join("|"), type:"match",
    q:"Собери пары: термин и его значение",

    w:"Пары: " + four.map(function(c){ return c.t + " — " + clip(c.d, 60); }).join(" · ")};
}

/* --- сборка запроса из блоков --- */

/* ================= НАРЕЗКА КУРСА =================
   Юнит → уроки по 5 карточек. Последний урок юнита — проверка. */
function buildCourse(){
  var course = [];
  UNITS.forEach(function(u){
    var cards = CARDS.filter(function(c){ return u.groups.indexOf(c.g) >= 0 && c.lvl >= u.lvl[0] && c.lvl <= u.lvl[1]; });
    cards.sort(function(a,b){ return a.lvl - b.lvl; });
    var quizzes = QUIZ.map(function(q,i){ return {q:q, i:i}; }).filter(function(x){ return u.quizG.indexOf(x.q.g) >= 0; });
    var lessons = [];

    if(u.boss){
      ["junior","middle","senior"].forEach(function(lvl, i){
        lessons.push({id:u.id+".L"+i, t:lvl === "junior" ? "Junior" : lvl === "middle" ? "Middle" : "Senior",
                      kind:"boss", lvl:lvl});
      });
    } else if(u.slang){
      /* сленг: все карточки группы режем по 5, фразы распределяем поровну */
      var n = Math.max(1, Math.ceil(cards.length / 5));
      var per = PHRASES.length / n;
      for(var s = 0; s < n; s++){
        lessons.push({id:u.id+".L"+s, t:"Урок "+(s+1),
                      kind:"slang",
                      from:Math.round(s*per), to:Math.round((s+1)*per),
                      cards:cards.slice(s*5, s*5+5)});
      }
      lessons.push({id:u.id+".LX", t:"Проверка", kind:"check", cards:cards, quiz:[], build:false});
    } else {
      for(var i2 = 0; i2 < cards.length; i2 += 5){
        var chunk = cards.slice(i2, i2+5);
        /* хвост короче трёх карточек не делаем отдельным уроком — он скучный */
        if(chunk.length < 3 && lessons.length){
          lessons[lessons.length-1].cards = lessons[lessons.length-1].cards.concat(chunk);
          break;
        }
        lessons.push({id:u.id+".L"+(i2/5), t:"Урок "+(lessons.length+1), kind:"cards", cards:chunk,
                      quiz: quizzes.length ? [quizzes[(i2/5) % quizzes.length]] : []});
      }
      lessons.push({id:u.id+".LX", t:"Проверка", kind:"check", cards:cards, quiz:quizzes, build:!!u.build});
    }
    course.push({u:u, lessons:lessons});
  });
  return course;
}

/* ================= СБОРКА УРОКА =================
   Урок собирается в момент открытия из всей базы знаний, а не из
   фиксированного пула. Состав: новые карточки раздела + повторение
   уже виденного из любых тем + прикладная задача + пары.
   Порядок перемешивается так, чтобы подряд не шло больше двух
   заданий одной темы — смешанная практика даёт худший результат
   в моменте, но заметно лучший перенос (Rohrer & Taylor, 2007).
   ================================================================= */

/* какие карточки ученик уже видел: ключи упражнений вида "c0|Термин" */
function seenTitles(srs){
  var set = {};
  for(var k in srs){ if(srs.hasOwnProperty(k)){ var t = k.split("|")[1]; if(t) set[t] = srs[k]; } }
  return set;
}

/* карточки на повторение: сперва просроченные, потом просто знакомые,
   и по возможности из других тем, чем ядро урока */
function pickReview(exclude, n, rnd, srs, coreGroups){
  var seen = seenTitles(srs), now = Date.now();
  var ex = {}; exclude.forEach(function(c){ ex[c.t] = 1; });
  var due = [], known = [];
  CARDS.forEach(function(c){
    if(ex[c.t]) return;
    var s = seen[c.t];
    if(!s) return;
    (s.d && s.d <= now ? due : known).push(c);
  });
  var other = function(list){ return list.filter(function(c){ return coreGroups.indexOf(c.g) < 0; }); };
  var out = pick(other(due), n, rnd);
  if(out.length < n) out = out.concat(pick(due.filter(function(c){ return out.indexOf(c) < 0; }), n - out.length, rnd));
  if(out.length < n) out = out.concat(pick(other(known), n - out.length, rnd));
  if(out.length < n) out = out.concat(pick(known.filter(function(c){ return out.indexOf(c) < 0; }), n - out.length, rnd));
  /* У новичка истории ещё нет. Чтобы урок не был однотемным, добираем
     карточки из других тем — они пойдут как первое знакомство. */
  if(out.length < n){
    var fresh = CARDS.filter(function(c){
      return !ex[c.t] && out.indexOf(c) < 0 && coreGroups.indexOf(c.g) < 0 && c.lvl <= 2;
    });
    out = out.concat(pick(fresh, n - out.length, rnd));
  }
  return out;
}

/* вариант задания зависит от того, впервые ли ученик видит термин:
   первое знакомство — узнавание, дальше — воспроизведение и применение */
function variantFor(card, srs, rnd){
  var s = seenTitles(srs)[card.t];
  if(!s) return 0;                       // впервые: определение по термину
  var box = s.b || 0;
  var pool = box >= 3 ? [2, 3, 1] : [1, 2, 3];
  return pool[Math.floor(rnd() * pool.length)];
}

/* перемешивание с ограничением: не больше двух подряд из одной темы */
function interleave(items, rnd){
  /* Раскладываем по темам и всегда берём из самой многочисленной,
     отличной от предыдущей. Жадный проход по списку оставлял хвост
     из заданий одной темы и давал тройки подряд. */
  var buckets = {}, order = [];
  shuffle(items, rnd).forEach(function(it){
    var g = it.g || "?";
    if(!buckets[g]){ buckets[g] = []; order.push(g); }
    buckets[g].push(it);
  });
  var out = [], last = null;
  while(true){
    var keys = order.filter(function(k){ return buckets[k].length; });
    if(!keys.length) break;
    keys.sort(function(a, b){ return buckets[b].length - buckets[a].length; });
    var key = null;
    for(var i = 0; i < keys.length; i++) if(keys[i] !== last){ key = keys[i]; break; }
    if(!key) key = keys[0];              /* остались задания только одной темы */
    last = key;
    out.push(buckets[key].shift());
  }
  return out;
}

/* прикладные задачи раздела, без повторов внутри урока */
function appliedFor(unit, lesson, rnd, used){
  var out = [];
  var qs = QUIZ.map(function(q, i){ return {q:q, i:i}; })
               .filter(function(x){ return unit.quizG.indexOf(x.q.g) >= 0 && !used["q|" + x.i]; });
  if(qs.length){ var q = pick(qs, 1, rnd)[0]; out.push(genQuiz(q.q, q.i, rnd)); used["q|" + q.i] = 1; }
  /* сборка кода и пропуск в коде — отдельные типы обработки материала,
     поэтому подмешиваются во все уроки, а не только в проверочные */
  var topics = unit.quizG.concat(unit.groups);
  var bs = BUILD.filter(function(b){ return topics.indexOf(b.g) >= 0; });
  var cz = CLOZE.map(function(c, i){ return {c:c, i:i}; })
                .filter(function(x){ return topics.indexOf(x.c.g) >= 0 && !used["z|" + x.i]; });
  if(!bs.length && !cz.length){                       /* у раздела нет своих — берём любые */
    bs = BUILD; cz = CLOZE.map(function(c, i){ return {c:c, i:i}; }).filter(function(x){ return !used["z|" + x.i]; });
  }
  if(bs.length && (rnd() < 0.5 || !cz.length)) out.push(genBuild(pick(bs, 1, rnd)[0]));
  else if(cz.length){ var z = pick(cz, 1, rnd)[0]; out.push(genCloze(CLOZE[z.i], z.i, rnd)); used["z|" + z.i] = 1; }
  return out;
}

function tag(ex, g){ ex.g = g; return ex; }

function makeLesson(unit, lesson, attempt, ctx){
  var rnd = seed(lesson.id + "#" + attempt);
  ctx = ctx || {};
  var srs = ctx.srs || {};
  var used = {};
  var ex = [];

  if(lesson.kind === "boss"){
    var qs = INTERVIEW.map(function(q, i){ return {q:q, i:i}; }).filter(function(x){ return x.q.lvl === lesson.lvl; });
    pick(qs, Math.min(8, qs.length), rnd).forEach(function(x){ ex.push(tag(genInterview(x.q, x.i), x.q.g)); });
    return interleave(ex, rnd);
  }

  var core = lesson.kind === "check" ? pick(lesson.cards, Math.min(6, lesson.cards.length), rnd)
                                     : (lesson.cards || []);
  var coreGroups = [];
  core.forEach(function(c){ if(coreGroups.indexOf(c.g) < 0) coreGroups.push(c.g); });

  /* ядро: по одному заданию на карточку, вариант — по степени знакомства */
  core.forEach(function(c){ ex.push(tag(genFromCard(c, CARDS, variantFor(c, srs, rnd), rnd), c.g)); });

  /* фразы сленга — свой тип задания */
  if(lesson.kind === "slang"){
    for(var i = lesson.from; i < lesson.to; i++) ex.push(tag(genPhrase(PHRASES[i], i, rnd), "сленг"));
  }

  /* Сколько нужно повторения, чтобы разбавить самую массивную тему урока:
     чтобы N заданий одной темы не шли подряд, нужно хотя бы N-1 чужих. */
  var counts = {}, domin = 0;
  ex.forEach(function(x){ counts[x.g] = (counts[x.g] || 0) + 1; if(counts[x.g] > domin) domin = counts[x.g]; });
  var otherN = ex.length - domin;
  var reviewN = Math.max(lesson.kind === "check" ? 4 : 3,
                         Math.min(7, domin - 1 - otherN));
  var review = pickReview(core, reviewN, rnd, srs, coreGroups);
  review.forEach(function(c){ ex.push(tag(genFromCard(c, CARDS, variantFor(c, srs, rnd), rnd), c.g)); });

  /* прикладное */
  appliedFor(unit, lesson, rnd, used).forEach(function(x){ ex.push(tag(x, unit.quizG[0] || coreGroups[0])); });
  if(lesson.kind === "check"){
    appliedFor(unit, lesson, rnd, used).forEach(function(x){ ex.push(tag(x, unit.quizG[0] || coreGroups[0])); });
  }

  /* пары: намеренно смешиваем ядро с повторением, чтобы столкнуть темы */
  var pairPool = core.concat(review);
  if(pairPool.length >= 4) ex.push(tag(genMatch(pick(pairPool, 4, rnd), rnd), "пары"));

  return interleave(ex, rnd);
}

var KEY = "odinesnik.v2";
var S = {
  xp:0, byDay:{}, day:"", streak:0, goal:30,
  hearts:5, heartAt:0, noHearts:false,
  crowns:{}, mistakes:[], srs:{}, road:{}, seenGreet:{}, runs:{}
};
try{ var raw = localStorage.getItem(KEY); if(raw){ var p = JSON.parse(raw); for(var k in p) if(p.hasOwnProperty(k)) S[k] = p[k]; } }catch(e){}
/* перенос отметок дорожной карты из первой версии */
try{
  if(!Object.keys(S.road).length){
    var old = localStorage.getItem("odinesnik.v1");
    if(old){ var o = JSON.parse(old); if(o && o.road) S.road = o.road; }
  }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

var TODAY = new Date().toISOString().slice(0,10);
var YESTERDAY = new Date(Date.now()-864e5).toISOString().slice(0,10);
/* Серия держится на факте занятия. Duolingo меняла именно это правило:
   продление любым уроком, а не выполнением дневной цели, дало заметный рост удержания. */
(function(){
  if(S.day && S.day !== TODAY && S.day !== YESTERDAY) S.streak = 0;  /* пропуск дня — серия сгорела */
  save();
})();
function markActive(){
  if(S.day === TODAY) return;
  S.streak = (S.day === YESTERDAY) ? (S.streak||0)+1 : 1;
  S.day = TODAY; save();
}
function todayXP(){ return S.byDay[TODAY] || 0; }
function addXP(n){ S.xp = (S.xp||0)+n; S.byDay[TODAY] = todayXP()+n; save(); }

/* сердца восстанавливаются по одному раз в 20 минут */
var HEART_MS = 20*60*1000;
function hearts(){
  if(S.noHearts) return 5;
  if(S.hearts >= 5) return 5;
  var gained = Math.floor((Date.now() - (S.heartAt||0)) / HEART_MS);
  if(gained > 0){
    S.hearts = Math.min(5, S.hearts + gained);
    S.heartAt = S.hearts >= 5 ? 0 : Date.now();
    save();
  }
  return S.hearts;
}
function loseHeart(){
  if(S.noHearts) return 5;
  if(S.hearts >= 5) S.heartAt = Date.now();
  S.hearts = Math.max(0, S.hearts-1); save(); return S.hearts;
}
function refillHearts(){ S.hearts = 5; S.heartAt = 0; save(); }
function heartTimer(){
  if(S.noHearts || S.hearts >= 5) return "";
  var left = HEART_MS - ((Date.now() - (S.heartAt||Date.now())) % HEART_MS);
  var m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
  return m + ":" + (s<10?"0":"") + s;
}

/* ===================== КУРС И ЗАМКИ ===================== */
var COURSE = buildCourse();
var FLAT = [];
COURSE.forEach(function(sec){ sec.lessons.forEach(function(l){ FLAT.push({sec:sec, l:l}); }); });

function crowns(id){ return S.crowns[id] || 0; }
function unlocked(idx){
  if(idx === 0) return true;
  return crowns(FLAT[idx-1].l.id) > 0;
}
function currentIdx(){
  for(var i = 0; i < FLAT.length; i++) if(crowns(FLAT[i].l.id) === 0) return i;
  return FLAT.length-1;
}
function unitProgress(sec){
  var done = 0;
  sec.lessons.forEach(function(l){ if(crowns(l.id) > 0) done++; });
  return {done:done, total:sec.lessons.length};
}
function totalCrowns(){ var n = 0; FLAT.forEach(function(f){ n += crowns(f.l.id); }); return n; }

/* ===================== СЕССИЯ УРОКА ===================== */
var LS = null;

function startLesson(idx){
  var f = FLAT[idx];
  if(hearts() === 0 && !S.noHearts){ screen = "nohearts"; render(); return; }
  /* seed переставал меняться после третьей звезды — урок повторялся дословно.
     Теперь у каждого запуска свой номер, он же уходит в seed. */
  if(!S.runs) S.runs = {};
  S.runs[f.l.id] = (S.runs[f.l.id] || 0) + 1;
  var attempt = crowns(f.l.id) + "r" + S.runs[f.l.id];
  LS = {
    idx: idx, sec: f.sec, lesson: f.l,
    queue: makeLesson(f.sec.u, f.l, attempt, {srs: S.srs, mistakes: S.mistakes}),
    done: 0, total: 0, wrong: 0, combo: 0, bestCombo: 0,
    pick: null, checked: false, correct: false,
    matched: {}, matchPick: null, built: [], startedAt: Date.now()
  };
  LS.total = LS.queue.length;
  screen = "lesson"; render();
}
function currentEx(){ return LS && LS.queue.length ? LS.queue[0] : null; }

function checkAnswer(){
  var e = currentEx(); if(!e || LS.checked) return;
  var ok = false;
  if(e.type === "choose") ok = LS.pick !== null && e.o[LS.pick] && !!e.o[LS.pick].c;
  else if(e.type === "build") ok = LS.built.join(" ") === e.tokens.join(" ");
  else if(e.type === "match") ok = Object.keys(LS.matched).length === e.pairs.length*2;
  else if(e.type === "recall") ok = LS.pick === 1;

  LS.checked = true; LS.correct = ok;
  if(ok){
    LS.combo++; LS.bestCombo = Math.max(LS.bestCombo, LS.combo);
    if(LS.combo > 0 && LS.combo % 5 === 0 && !S.noHearts && S.hearts < 5){
      S.hearts++; LS.gainedHeart = true; save();
    }
    if(e.type !== "recall"){
      var s = S.srs[e.k] || {b:0};
      s.b = Math.min(5, (s.b||0)+1); s.d = Date.now() + [0,1,3,8,21,45][s.b]*864e5;
      S.srs[e.k] = s;
      var mi = S.mistakes.indexOf(e.k);
      if(mi >= 0) S.mistakes.splice(mi, 1);
    }
  } else {
    LS.combo = 0; LS.wrong++;
    if(e.type !== "recall"){
      var repeat = LS.seen && LS.seen[e.k];
      if(S.mistakes.indexOf(e.k) < 0) S.mistakes.unshift(e.k);
      S.mistakes = S.mistakes.slice(0, 60);
      S.srs[e.k] = {b:0, d:Date.now()};
      if(!repeat) loseHeart();     /* разбор ошибки внутри урока — бесплатно */
    }
  }
  if(!LS.seen) LS.seen = {};
  LS.seen[e.k] = 1;
  save(); render();
  RIG.playAll(ok ? "correct" : "wrong", document.getElementById("lesson"));
}

function nextEx(){
  var e = LS.queue.shift();
  /* Ошибку прогоняем ещё раз, но не больше двух возвратов на задание:
     иначе упражнение, которое не даётся, крутится в уроке бесконечно. */
  if(!LS.requeued) LS.requeued = {};
  var back = LS.requeued[e.k] || 0;
  if(!LS.correct && e.type !== "recall" && back < 2){ LS.requeued[e.k] = back + 1; LS.queue.push(e); }
  else LS.done++;
  LS.pick = null; LS.checked = false; LS.correct = false;
  LS.matched = {}; LS.matchPick = null; LS.built = [];
  if(!S.noHearts && hearts() === 0){ screen = "failed"; render(); return; }
  if(!LS.queue.length){ finishLesson(); return; }
  render();
}

function finishLesson(){
  var id = LS.lesson.id;
  if(LS.lesson.kind === "mistakes"){
    refillHearts();                       /* разбор ошибок возвращает жизни */
  } else {
    S.crowns[id] = Math.min(3, crowns(id) + 1);
  }
  markActive();
  var base = (LS.lesson.kind === "check" || LS.lesson.kind === "boss") ? 30 : 20;
  LS.perfect = LS.wrong === 0;
  LS.comboBonus = Math.min(5, Math.floor(LS.bestCombo / 2));   /* комбо-бонус, потолок +5 */
  LS.earned = base + LS.comboBonus + (LS.perfect ? 5 : 0);
  addXP(LS.earned);
  save();
  screen = "done"; render();
}

function mistakeLesson(){
  var pool = [];
  COURSE.forEach(function(sec){ sec.lessons.forEach(function(l){
    if(l.kind === "boss") return;
    for(var a = 0; a < 2; a++){
      makeLesson(sec.u, l, a, {srs: S.srs}).forEach(function(e){ if(S.mistakes.indexOf(e.k) >= 0) pool.push(e); });
    }
  }); });
  var seen = {}, out = [];
  pool.forEach(function(e){ if(!seen[e.k]){ seen[e.k] = 1; out.push(e); } });
  return out.slice(0, 12);
}
function startMistakes(){
  var ex = mistakeLesson();
  if(!ex.length) return;
  LS = {idx:-1, sec:null, lesson:{id:"mistakes", t:"Разбор ошибок", kind:"mistakes"},
        queue:ex, done:0, total:ex.length, wrong:0, combo:0, bestCombo:0,
        pick:null, checked:false, correct:false, matched:{}, matchPick:null, built:[], startedAt:Date.now()};
  screen = "lesson"; render();
}

function vPath(){
  var cur = currentIdx(), h = "";

    h += '<div class="unit" style="--u:'+sec.u.c+'">'+

      '</div>';
    if(!locked) h += '<p class="unit-greet">'+esc(sec.u.greet)+'</p>';
    h += '<ol class="path">';
    sec.lessons.forEach(function(l, li){
      var idx = gi, cr = crowns(l.id), open = unlocked(idx), isCur = idx === cur;
      var off = [0, 34, 52, 34, 0, -34, -52, -34][li % 8];
      var state = cr >= 3 ? "gold" : cr > 0 ? "done" : open ? "open" : "lock";
      h += '<li class="node-wrap" style="--off:'+off+'px">'+

          ' aria-label="'+esc(l.t)+'">'+

      '</li>';
      gi++;
    });
    h += '</ol></div>';
  });
  return h;
}
function repeat(s, n){ var o = ""; for(var i=0;i<n;i++) o += s; return o; }
function nodeIcon(l, state){
  if(state === "lock") return ICON.lock;
  if(l.kind === "check") return ICON.check;
  if(l.kind === "boss") return ICON.boss;
  if(l.kind === "slang") return ICON.chat;
  return ICON.star;
}

/* ---------- УРОК ---------- */
function vLesson(){
  var e = currentEx();

  var body = "";

  if(e.type === "choose"){

      (e.code ? '<pre class="code">'+hl(e.code)+'</pre>' : '')+

          '<span class="opt-k">'+(i+1)+'</span><span>'+esc(o.t)+'</span></button>';
      }).join("")+'</div>';
  }

  if(e.type === "match"){
    var left = e.pairs.map(function(p){ return p.l; });

    body = '<div class="match">'+
      '<div class="match-col">'+ left.map(function(t, i){

      }).join("")+'</div>'+
      '<div class="match-col">'+ right.map(function(t, i){
        var pi = left.indexOf(e.pairs.filter(function(p){ return p.r === t; })[0].l);
        var done = LS.matched["r"+i] ? " matched" : "";
        var sel = LS.matchPick === "r"+i ? " sel" : "";
        return '<button class="chip'+done+sel+'" data-match="r'+i+'" data-pair="'+pi+'"'+(done?" disabled":"")+'>'+esc(t)+'</button>';
      }).join("")+'</div></div>';

    body = '<div class="build-line">'+

                         : '<span class="build-empty">Собери из блоков ниже</span>')+
      '</div>'+
      '<div class="build-bank">'+ bank.map(function(t){

      }).join("")+'</div>';

      '</div>'+
      (LS.checked ? '' :
      '<div class="opts"><button class="opt" data-pick="1">'+

      '<button class="opt" data-pick="0"><span class="opt-k">?</span><span>Плаваю, покажи ответ</span></button></div>');
  }

  var canCheck = e.type === "choose" ? LS.pick !== null
               : e.type === "build" ? LS.built.length > 0
               : e.type === "match" ? Object.keys(LS.matched).length === e.pairs.length*2
               : LS.pick !== null;

  var bar = "";
  if(LS.checked){
    var mc = lessonMascot(), mm = LS.correct ? "happy" : (e.type === "recall" ? "idle" : "sad");
    bar = '<div class="fb '+(LS.correct?"ok":"no")+'">'+

          '<div class="fb-txt"><b>'+(LS.correct ? praise() : (e.type==="recall" ? "Эталонный ответ" : "Не так")) +'</b>'+
          '<span>'+esc(e.w)+'</span></div>'+

      '</div></div>';
  } else {
    bar = '<div class="fb idle"><div class="fb-in">'+
      '<button class="btn ghost" data-skip="1">Пропустить</button>'+

      body+
    '</div></div>'+ bar +'</div>';

       : e.type === "build" ? "Собери из блоков"

/* персонаж подбирается под тему раздела: предметку ведёт Нина, инженерию — Саныч */
function lessonMascot(){

}
var PRAISE = ["Верно","Точно","Именно так","Хорошо","В точку","Так и есть","Правильно"];
function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }

/* ---------- ЗАВЕРШЕНИЕ ---------- */
function vDone(){
  var acc = LS.total ? Math.round((LS.total/(LS.total+LS.wrong))*100) : 100;
  var sec = Math.round((Date.now()-LS.startedAt)/1000);
  return '<div class="finish">'+
    '<div class="finish-hero">'+MASCOT.render(lessonMascot(), {mood:"cheer", cls:(LS.wrong===0?"is-hop":"idle-bob")})+'</div>'+
    '<h2>'+(LS.wrong === 0 ? "Идеальный урок" : "Урок пройден")+'</h2>'+
    '<p>'+doneLine(LS.wrong)+'</p>'+
    '<div class="finish-stats">'+
      '<div class="ds xp"><b>+'+LS.earned+'</b><span>XP</span></div>'+
      '<div class="ds acc"><b>'+acc+'%</b><span>точность</span></div>'+
      '<div class="ds time"><b>'+Math.floor(sec/60)+':'+(sec%60<10?"0":"")+(sec%60)+'</b><span>время</span></div>'+
    '</div>'+
    '<button class="btn primary big" data-back="1">Дальше</button>'+
  '</div>';
}
function doneLine(w){
  if(w === 0) return "Ни одной ошибки. Эти термины можно считать своими.";
  if(w <= 2) return "Пара промахов — нормально. Они уже поставлены в очередь на повтор.";
  return "Ошибки записаны в разбор. Прогони его, пока материал свежий.";
}
function vFailed(){
  return '<div class="finish">'+
    '<div class="finish-hero">'+MASCOT.render("byte", {mood:"sad"})+'</div>'+
    '<h2>Жизни кончились</h2>'+
    '<p>Так бывает. Пройди разбор ошибок — он вернёт жизни и закроет пробелы.</p>'+
    '<div class="row">'+
      '<button class="btn primary big" data-mistakes="1">Разбор ошибок</button>'+
      '<button class="btn big" data-back="1">Выйти</button>'+
    '</div>'+
    '<button class="link" data-nohearts="1">Отключить жизни насовсем</button>'+
  '</div>';
}
function vNoHearts(){
  return '<div class="finish">'+
    '<div class="finish-hero">'+MASCOT.render("byte", {mood:"sad"})+'</div>'+
    '<h2>Жизней нет</h2>'+
    '<p>Следующая восстановится через '+heartTimer()+'. Или пройди разбор ошибок — он вернёт все сразу.</p>'+
    '<div class="row">'+
      '<button class="btn primary big" data-mistakes="1">Разбор ошибок</button>'+
      '<button class="btn big" data-back="1">Назад</button>'+
    '</div>'+
    '<button class="link" data-nohearts="1">Учиться без жизней</button>'+
  '</div>';
}

/* ---------- ПРОФИЛЬ ---------- */
function vStats(){
  var xpToday = todayXP(), pct = Math.min(100, Math.round(xpToday/S.goal*100));
  var C = 2*Math.PI*33;
  var days = [], names = ["вс","пн","вт","ср","чт","пт","сб"];
  for(var i = 6; i >= 0; i--){
    var d = new Date(Date.now()-i*864e5), k = d.toISOString().slice(0,10);
    days.push({n:names[d.getDay()], v:S.byDay[k]||0});
  }
  var max = Math.max(30, Math.max.apply(null, days.map(function(d){return d.v;})));
  var cr = totalCrowns(), maxCr = FLAT.length*3;
  var learned = Object.keys(S.srs).filter(function(k){ return S.srs[k].b >= 4; }).length;

  return '<div class="sec-h"><span class="eyebrow">Профиль</span><h2>Твой прогресс</h2></div>'+

  '<div class="card goal-ring">'+
    '<svg class="ring" viewBox="0 0 76 76"><circle class="bg" cx="38" cy="38" r="33"/>'+
    '<circle class="fg" cx="38" cy="38" r="33" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C-C*pct/100)+'"/></svg>'+
    '<div><h3 style="font-size:18px">Цель дня: '+S.goal+' XP</h3>'+
    '<p style="color:var(--ink-2);font-size:14px;margin-top:4px">'+
      (xpToday >= S.goal ? "Цель выполнена. Всё, что сверху, — в запас." : "Сегодня набрано "+xpToday+" XP. Осталось "+(S.goal-xpToday)+".")+'</p>'+
    '<div class="pill-row" style="margin-top:10px">'+
      [10,30,50,100].map(function(g){ return '<button class="pill" data-goal="'+g+'" aria-pressed="'+(S.goal===g)+'">'+g+' XP</button>'; }).join("")+
    '</div></div></div>'+

  '<div class="tile-row">'+
    '<div class="tile"><b style="color:var(--gold)">'+(S.streak||1)+'</b><span>дней подряд</span></div>'+
    '<div class="tile"><b style="color:var(--info)">'+(S.xp||0)+'</b><span>всего XP</span></div>'+
    '<div class="tile"><b style="color:var(--brand)">'+cr+'</b><span>из '+maxCr+' звёзд</span></div>'+
    '<div class="tile"><b style="color:var(--ok)">'+learned+'</b><span>терминов освоено</span></div>'+
  '</div>'+

  '<div class="card"><h3 style="font-size:17px;margin-bottom:14px">Последние 7 дней</h3>'+
    '<div class="week">'+ days.map(function(d){
      return '<div class="d"><div class="b'+(d.v?"":" zero")+'" style="height:'+Math.max(4, Math.round(d.v/max*54))+'px" title="'+d.v+' XP"></div><small>'+d.n+'</small></div>';
    }).join("")+'</div></div>'+

  '<div class="card"><div class="speech">'+MASCOT.render("sanych",{mood:"idle"})+
    '<div class="bubble"><b>Сан Саныч:</b> «'+sanychLine()+'»</div></div></div>'+

  '<div class="card"><h3 style="font-size:17px;margin-bottom:6px">Настройки</h3>'+
    '<button class="chk" data-nohearts="toggle" aria-pressed="'+(!!S.noHearts)+'">'+
      '<span class="box">'+(S.noHearts?"✓":"")+'</span>'+
      '<span class="txt" style="text-decoration:none;color:var(--ink)">Учиться без жизней<br>'+
      '<small style="color:var(--ink-3);font-weight:600">Ошибка не выкидывает из урока. Полезно, когда разбираешь новую тему, а не проверяешь себя.</small></span>'+
    '</button>'+
    '<button class="chk" data-reset="1"><span class="box">✕</span>'+
      '<span class="txt" style="text-decoration:none;color:var(--no)">Сбросить весь прогресс</span></button>'+
  '</div>';
}
var SANYCH = [
 "Гадать не будем — сделай замер, потом приходи.",
 "Работает — не трогай. Особенно на закрытии месяца.",
 "Запрос в цикле по табличной части — и всё, приехали.",
 "Не лезь в типовой модуль. Сделай расширением.",
 "Остатки читаешь без блокировки? Готовься к минусу на складе.",
 "Отбор — в параметры виртуальной таблицы, а не в ГДЕ.",
 "Сначала на копии. Всегда сначала на копии."
];
function sanychLine(){ return SANYCH[(S.xp||0) % SANYCH.length]; }

/* ---------- СПРАВОЧНИК ---------- */
function vRef(){
  var tabs = [["arch","Архитектура"],["hood","Под капотом"],["road","План"],["lib","Ссылки"]];
  var h = '<div class="sec-h"><span class="eyebrow">Без игры и без жизней</span><h2>Справочник</h2>'+
    '<p>Сюда возвращаются, когда нужно не тренироваться, а прочитать.</p></div>'+
    '<div class="pill-row">'+ tabs.map(function(t){
      return '<button class="pill" data-ref="'+t[0]+'" aria-pressed="'+(refTab===t[0])+'">'+t[1]+'</button>';
    }).join("")+'</div>';

  if(refTab === "arch" || refTab === "hood"){
    var list = refTab === "arch" ? ARCH : HOOD;
    h += '<div class="card" style="padding:0 18px">'+ list.map(function(a){
      var open = openRef === a.id;
      return '<div class="acc-item">'+
        '<button class="acc-btn" data-open="'+a.id+'"><span class="sign">'+(open?"−":"+")+'</span>'+
        '<span>'+esc(a.t)+(a.sub?'<br><small style="color:var(--ink-3);font-weight:600;font-size:12.5px">'+esc(a.sub)+'</small>':'')+'</span></button>'+
        (open ? '<div class="acc-body">'+a.html+'</div>' : '')+
      '</div>';
    }).join("")+'</div>';
  }

  if(refTab === "road"){
    h += ROADMAP.map(function(st_, idx){
      var n = 0; st_.tasks.forEach(function(t,i){ if(S.road[st_.id+"."+i]) n++; });
      return '<div class="card">'+
        '<div style="display:flex;gap:13px;align-items:flex-start;margin-bottom:10px">'+
          '<span class="num" style="font-size:25px;font-weight:800;color:var(--brand);line-height:1">'+idx+'</span>'+
          '<div style="flex:1"><h3 style="font-size:18px">'+esc(st_.t)+'</h3>'+
          '<p style="font-size:13px;color:var(--ink-3);margin-top:2px">'+esc(st_.w)+' · '+n+' из '+st_.tasks.length+'</p></div></div>'+
        '<p style="font-size:14.5px;color:var(--ink-2);margin-bottom:10px">'+esc(st_.goal)+'</p>'+
        st_.tasks.map(function(t,i){
          var k = st_.id+"."+i, on = !!S.road[k];
          return '<button class="chk" data-road="'+k+'" aria-pressed="'+on+'"><span class="box">'+(on?"✓":"")+'</span><span class="txt">'+esc(t)+'</span></button>';
        }).join("")+
        '<div class="note" style="margin-top:12px"><b>Этап закрыт, когда:</b> '+esc(st_.done)+'</div>'+
      '</div>';
    }).join("");
  }

  if(refTab === "lib"){
    h += LIBRARY.map(function(sec){
      return '<div class="card"><h3 style="font-size:17px;margin-bottom:6px">'+esc(sec.cat)+'</h3>'+
        sec.items.map(function(it){
          return '<div class="lib-item"><a href="'+it.u+'" target="_blank" rel="noopener">'+esc(it.n)+'</a>'+
                 '<span>'+esc(it.d)+'</span></div>';
        }).join("")+'</div>';
    }).join("")+
    '<div class="card"><h3 style="font-size:16px;margin-bottom:8px">Оговорки</h3><ul class="tight" style="padding-left:20px;list-style:disc;display:flex;flex-direction:column;gap:7px;color:var(--ink-2);font-size:14px">'+
    '<li>Платформа в 2026 живёт двумя ветками: <b>8.3.27</b> (последняя в линейке 8.3, на ней большинство внедрений) и <b>8.5.x</b> (финальный релиз 8.5.1 — 25 декабря 2025). Версии 8.3.28 не будет.</li>'+
    '<li>Учиться практичнее на 8.3: под неё написаны книги, курсы и почти все рабочие базы.</li>'+
    '<li>Цены курсов и даты потоков собраны в августе 2026 и устаревают быстрее всего остального.</li>'+
    '</ul></div>';
  }
  return h;
}

/* ---------- РАЗБОР ОШИБОК ---------- */
function vPractice(){
  var n = S.mistakes.length;
  var learned = Object.keys(S.srs).filter(function(k){ return S.srs[k].b >= 4; }).length;
  var due = Object.keys(S.srs).filter(function(k){ return S.srs[k].b > 0 && S.srs[k].d <= Date.now(); }).length;
  return '<div class="sec-h"><span class="eyebrow">Повторение</span><h2>Разбор ошибок</h2>'+
    '<p>Всё, что ты не угадал, попадает сюда. Прогон возвращает жизни.</p></div>'+
    '<div class="tile-row">'+
      '<div class="tile"><b style="color:var(--no)">'+n+'</b><span>в разборе</span></div>'+
      '<div class="tile"><b style="color:var(--gold)">'+due+'</b><span>пора повторить</span></div>'+
      '<div class="tile"><b style="color:var(--ok)">'+learned+'</b><span>освоено</span></div>'+
    '</div>'+
    (n ? '<div class="card" style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center">'+
        MASCOT.render("nina",{mood:"idle"})+
        '<p style="font-size:15px;color:var(--ink-2);max-width:40ch">Соберём '+Math.min(12,n)+' упражнений из тех, где ты ошибся. Пройдёшь — жизни восстановятся полностью.</p>'+
        '<button class="btn primary big" data-mistakes="1">Начать разбор</button></div>'
      : '<div class="card empty">'+MASCOT.render("byte",{mood:"cheer",cls:"idle-bob"})+
        '<div><b style="font-size:17px;color:var(--ink)">Ошибок нет</b>'+
        '<p style="margin-top:6px">Либо ты идеален, либо ещё не начинал. Иди на путь и проходи уроки.</p></div>'+
        '<button class="btn primary" data-tab="path">На путь</button></div>');
}

/* ---------- ОБОЛОЧКА ---------- */
var TABS = [
  {id:"path", n:"Путь", ic:'<svg viewBox="0 0 24 24"><path d="M4 20V8a4 4 0 014-4h4a3 3 0 010 6H9a3 3 0 000 6h4a4 4 0 014 4"/></svg>'},
  {id:"practice", n:"Разбор", ic:ICON.bolt},
  {id:"ref", n:"Справочник", ic:'<svg viewBox="0 0 24 24"><path d="M5 4h9a4 4 0 014 4v12H9a4 4 0 01-4-4z"/><path d="M14 4h5v16" fill="none" stroke="currentColor" stroke-width="2"/></svg>'},
  {id:"stats", n:"Профиль", ic:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0z"/></svg>'}
];

function renderHUD(){
  var hp = hearts();
  $("#hud").innerHTML = '<div class="hud-in">'+
    '<div class="brand">'+MASCOT.render("byte",{mood:"idle",frame:"head",cls:"idle-bob"})+'<b>Тренажёр <span>одинэсника</span></b></div>'+
    '<span class="chip-stat fire'+((S.streak||0)>0?"":" dim")+'">'+ICON.flame+(S.streak||1)+'</span>'+
    '<span class="chip-stat xp">'+ICON.bolt+(S.xp||0)+'</span>'+
    (S.noHearts ? '<span class="chip-stat hp inf">∞</span>'
                : '<span class="chip-stat hp'+(hp?"":" dim")+'">'+ICON.heart+hp+'</span>')+
  '</div>';
}
function renderTabs(){
  $("#tabs").innerHTML = '<div class="tabs-in">'+ TABS.map(function(t){
    var b = t.id === "practice" && S.mistakes.length ? '<span class="badge">'+S.mistakes.length+'</span>' : '';
    return '<button class="tab" data-tab="'+t.id+'" aria-current="'+(screen===t.id)+'">'+t.ic+b+'<span>'+t.n+'</span></button>';
  }).join("")+'</div>';
}

function render(){
  var lesson = $("#lesson"), main = $("#main"), hud = $("#hud"), tabs = $("#tabs");
  if(screen === "lesson" || screen === "done" || screen === "failed" || screen === "nohearts"){
    lesson.innerHTML = screen === "lesson" ? vLesson()
                     : screen === "done" ? vDone()
                     : screen === "failed" ? vFailed() : vNoHearts();
    lesson.classList.remove("hidden");
    main.classList.add("hidden"); hud.classList.add("hidden"); tabs.classList.add("hidden");
    RIG.scan();
    return;
  }
  lesson.classList.add("hidden"); lesson.innerHTML = "";
  main.classList.remove("hidden"); hud.classList.remove("hidden"); tabs.classList.remove("hidden");
  var v = $("#view");
  v.innerHTML = screen === "path" ? vPath()
              : screen === "practice" ? vPractice()
              : screen === "ref" ? vRef() : vStats();
  renderHUD(); renderTabs();
  RIG.scan();
}

/* ---------- СОБЫТИЯ ---------- */
document.addEventListener("click", function(e){
  var t = e.target.closest("button, a");
  if(!t) return;
  var A = function(n){ return t.getAttribute(n); };

  if(A("data-tab")){ screen = A("data-tab"); render(); var mn = $("#main"); if(mn) mn.scrollTop = 0; try{ window.scrollTo(0,0); }catch(e){} return; }
  if(A("data-lesson") !== null && A("data-lesson") !== undefined){ startLesson(+A("data-lesson")); return; }
  if(A("data-quit")){ if(confirm("Не бросай на середине — прогресс этого подхода не сохранится. Точно выйти?")){ screen = "path"; LS = null; render(); } return; }
  if(A("data-check")){ checkAnswer(); return; }
  if(A("data-next")){ nextEx(); return; }
  if(A("data-skip")){ LS.pick = null; LS.checked = true; LS.correct = false;
    var ce = currentEx();
    if(ce && ce.type !== "recall" && S.mistakes.indexOf(ce.k) < 0) S.mistakes.unshift(ce.k);
    save(); render(); return; }
  if(A("data-back")){ screen = "path"; LS = null; render(); return; }
  if(A("data-mistakes")){ startMistakes(); return; }

  var p = A("data-pick");
  if(p !== null && p !== undefined && !LS.checked){ LS.pick = +p; render(); return; }

  var mm = A("data-match");
  if(mm){
    var ex = currentEx();
    if(!LS.matchPick){ LS.matchPick = mm; render(); return; }
    if(LS.matchPick === mm){ LS.matchPick = null; render(); return; }
    var a = LS.matchPick, b = mm;
    if(a[0] === b[0]){ LS.matchPick = mm; render(); return; }
    var l = a[0] === "l" ? a : b, r = a[0] === "r" ? a : b;
    var rBtn = document.querySelector('[data-match="'+r+'"]');
    if(rBtn && +rBtn.getAttribute("data-pair") === +l.slice(1)){
      LS.matched[l] = 1; LS.matched[r] = 1; LS.matchPick = null;
      if(Object.keys(LS.matched).length === ex.pairs.length*2){ render(); checkAnswer(); return; }
    } else {
      LS.matchPick = null;
      if(rBtn){ rBtn.classList.add("miss"); setTimeout(function(){ render(); }, 400); return; }
    }
    render(); return;
  }

  var bt = A("data-build");
  if(bt){ LS.built.push(bt); render(); return; }
  var ub = A("data-unbuild");
  if(ub !== null && ub !== undefined && !LS.checked){ LS.built.splice(+ub, 1); render(); return; }

  if(A("data-open")){ openRef = openRef === A("data-open") ? "" : A("data-open"); render(); return; }
  if(A("data-ref")){ refTab = A("data-ref"); openRef = ""; render(); return; }
  if(A("data-road")){ var k = A("data-road"); S.road[k] = !S.road[k]; save(); render(); return; }
  if(A("data-goal")){ S.goal = +A("data-goal"); save(); render(); return; }
  if(A("data-nohearts")){
    S.noHearts = A("data-nohearts") === "toggle" ? !S.noHearts : true;
    if(S.noHearts) refillHearts();
    save();
    if(screen === "failed" || screen === "nohearts"){ screen = "path"; LS = null; }
    render(); return;
  }
  if(A("data-reset")){
    if(!confirm("Обнулить весь прогресс: XP, серию, звёзды и отметки?")) return;
    S = {xp:0, byDay:{}, day:TODAY, streak:1, goal:30, hearts:5, heartAt:0, noHearts:false,
         crowns:{}, mistakes:[], srs:{}, road:{}, seenGreet:{}};
    save(); screen = "path"; render(); return;
  }
});

document.addEventListener("keydown", function(e){
  if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if(screen !== "lesson" || !LS) return;
  var ex = currentEx(); if(!ex) return;
  if(e.key === "Enter"){
    e.preventDefault();
    if(LS.checked) nextEx();
    else {
      var cb = document.querySelector('[data-check]');
      if(cb && !cb.disabled) checkAnswer();
    }
    return;
  }
  if(!LS.checked && (ex.type === "choose" || ex.type === "recall")){
    var n = parseInt(e.key, 10);
    if(n >= 1 && n <= 4){
      var el = document.querySelector('[data-pick="'+(ex.type === "recall" ? (n===1?1:0) : n-1)+'"]');
      if(el) el.click();
    }
  }
});

/* ---------- СТАРТ ---------- */
/* пути персонажей лежат в одном скрытом <defs>, экземпляры ссылаются на них */
(function(){
  var host = document.createElement("div");
  host.innerHTML = MASCOT.defs();
  document.body.insertBefore(host.firstChild, document.body.firstChild);
})();
render();

})();
</script>
